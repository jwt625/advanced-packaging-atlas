name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: app
        run: npx pnpm@10.12.4 install --frozen-lockfile

      - name: Type-check
        working-directory: app
        run: npx pnpm@10.12.4 run check

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /advanced-packaging-atlas
        run: npx pnpm@10.12.4 run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
