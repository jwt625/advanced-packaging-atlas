schema: ap-sim/0
id: em/em5a_tsv_gsg_chain_reduced
title: EM-5a reduced, GSG line through 2 via-last Cu TSVs in series (down and up) in 100 um Si, Al RDL both sides
status: draft
family: em3d
em3d:
  # z = 0 at the back-side passivation surface. Back oxide [0, 3] with Al RDL [1, 2]; Si [3, 103]; front oxide
  # [103, 106] with Al RDL [104, 105]; air 20 um above and below. Signal: front line from x = -90 to TSV 1
  # (x = -40), back line to TSV 2 (x = +40), front line to x = +90. Ground lines on both sides at y = +-50 um, tied by
  # ground TSVs at (+-40, +-50). Every in-plane dimension is a template (pad layout, pitch and line widths of the
  # paper's test structure are not reported).
  box_um: {x: [-90, 90], y: [-65, 65], z: [-20, 126]}
  axis: z
  bc: {ymin: pec, ymax: pec, zmin: pmc, zmax: pmc}
  background: air
  materials:
    oxide: {model: const, eps_r: 3.9, tan_delta: 0, status: template, note: "SiO2 eps_r 3.9 (textbook); DB rows give thickness only"}
    si: {model: const, eps_r: 11.9, sigma_S_m: 10, status: template, note: "Si eps_r 11.9 (R3 Sec. 2.7); resistivity N/A in DB, 10 S/m (10 ohm cm) template; variant hr_si uses 0.1 S/m"}
    liner: {model: const, eps_r: 3.9, status: template}
  solids:
    - {name: bot_oxide, kind: dielectric, material: oxide, box_um: {x: [-90, 90], y: [-65, 65], z: [0, 3]}}
    - {name: si, kind: dielectric, material: si, box_um: {x: [-90, 90], y: [-65, 65], z: [3, 103]}}
    - {name: top_oxide, kind: dielectric, material: oxide, box_um: {x: [-90, 90], y: [-65, 65], z: [103, 106]}}
    - {name: tsv1_liner, kind: dielectric, material: liner, cylinder_um: {c: [-40, 0], r: 6, n: 12, z: [3, 103]}, h_um: 3.5}
    - {name: tsv2_liner, kind: dielectric, material: liner, cylinder_um: {c: [40, 0], r: 6, n: 12, z: [3, 103]}, h_um: 3.5}
    - {name: gtsv1n_liner, kind: dielectric, material: liner, cylinder_um: {c: [-40, -50], r: 6, n: 12, z: [3, 103]}, h_um: 3.5}
    - {name: gtsv1p_liner, kind: dielectric, material: liner, cylinder_um: {c: [-40, 50], r: 6, n: 12, z: [3, 103]}, h_um: 3.5}
    - {name: gtsv2n_liner, kind: dielectric, material: liner, cylinder_um: {c: [40, -50], r: 6, n: 12, z: [3, 103]}, h_um: 3.5}
    - {name: gtsv2p_liner, kind: dielectric, material: liner, cylinder_um: {c: [40, 50], r: 6, n: 12, z: [3, 103]}, h_um: 3.5}
    - {name: sig_in, kind: conductor, model: pec, box_um: {x: [-90, -30], y: [-10, 10], z: [104, 105]}, h_um: 12}
    - {name: sig_bot, kind: conductor, model: pec, box_um: {x: [-50, 50], y: [-10, 10], z: [1, 2]}, h_um: 12}
    - {name: sig_out, kind: conductor, model: pec, box_um: {x: [30, 90], y: [-10, 10], z: [104, 105]}, h_um: 12}
    - {name: gn_top, kind: conductor, model: pec, box_um: {x: [-90, 90], y: [-60, -40], z: [104, 105]}, h_um: 12}
    - {name: gn_bot, kind: conductor, model: pec, box_um: {x: [-90, 90], y: [-60, -40], z: [1, 2]}, h_um: 12}
    - {name: gp_top, kind: conductor, model: pec, box_um: {x: [-90, 90], y: [40, 60], z: [104, 105]}, h_um: 12}
    - {name: gp_bot, kind: conductor, model: pec, box_um: {x: [-90, 90], y: [40, 60], z: [1, 2]}, h_um: 12}
    - {name: tsv1, kind: conductor, model: pec, cylinder_um: {c: [-40, 0], r: 5, n: 12, z: [1, 105]}, h_um: 3.5}
    - {name: tsv1_pad_t, kind: conductor, model: pec, box_um: {x: [-50, -30], y: [-10, 10], z: [104, 105]}}
    - {name: tsv1_pad_b, kind: conductor, model: pec, box_um: {x: [-50, -30], y: [-10, 10], z: [1, 2]}}
    - {name: tsv2, kind: conductor, model: pec, cylinder_um: {c: [40, 0], r: 5, n: 12, z: [1, 105]}, h_um: 3.5}
    - {name: tsv2_pad_t, kind: conductor, model: pec, box_um: {x: [30, 50], y: [-10, 10], z: [104, 105]}}
    - {name: tsv2_pad_b, kind: conductor, model: pec, box_um: {x: [30, 50], y: [-10, 10], z: [1, 2]}}
    - {name: gtsv1n, kind: conductor, model: pec, cylinder_um: {c: [-40, -50], r: 5, n: 12, z: [1, 105]}, h_um: 3.5}
    - {name: gtsv1n_pad_t, kind: conductor, model: pec, box_um: {x: [-50, -30], y: [-60, -40], z: [104, 105]}}
    - {name: gtsv1n_pad_b, kind: conductor, model: pec, box_um: {x: [-50, -30], y: [-60, -40], z: [1, 2]}}
    - {name: gtsv1p, kind: conductor, model: pec, cylinder_um: {c: [-40, 50], r: 5, n: 12, z: [1, 105]}, h_um: 3.5}
    - {name: gtsv1p_pad_t, kind: conductor, model: pec, box_um: {x: [-50, -30], y: [40, 60], z: [104, 105]}}
    - {name: gtsv1p_pad_b, kind: conductor, model: pec, box_um: {x: [-50, -30], y: [40, 60], z: [1, 2]}}
    - {name: gtsv2n, kind: conductor, model: pec, cylinder_um: {c: [40, -50], r: 5, n: 12, z: [1, 105]}, h_um: 3.5}
    - {name: gtsv2n_pad_t, kind: conductor, model: pec, box_um: {x: [30, 50], y: [-60, -40], z: [104, 105]}}
    - {name: gtsv2n_pad_b, kind: conductor, model: pec, box_um: {x: [30, 50], y: [-60, -40], z: [1, 2]}}
    - {name: gtsv2p, kind: conductor, model: pec, cylinder_um: {c: [40, 50], r: 5, n: 12, z: [1, 105]}, h_um: 3.5}
    - {name: gtsv2p_pad_t, kind: conductor, model: pec, box_um: {x: [30, 50], y: [40, 60], z: [104, 105]}}
    - {name: gtsv2p_pad_b, kind: conductor, model: pec, box_um: {x: [30, 50], y: [40, 60], z: [1, 2]}}
  ports:
    - {name: p1, side: xmin, signal: sig_in, deembed_um: 0}
    - {name: p2, side: xmax, signal: sig_out, deembed_um: 0}
  mesh: {max_edge_um: 40, max_dz_um: 25, grade: 0.7}
  max_dof: 60000
  sweep: {f_GHz: [1, 10, 20, 30, 40, 45, 50, 60, 67]}
  zref_ohm: 50
  lumped: pi
  touchstone: true
  variants:
    - id: hr_si
      title: high-resistivity Si (0.1 S/m template)
      patch: {materials: {si: {sigma_S_m: 0.1}}}
targets: []
assumptions:
  - "Reduced EM-5a: 2 TSVs in series (the paper measures 2 / 4 / 6; its HFSS model, p.2 Fig. 2, shows several TSVs per pad and stadium-shaped pads, dimensions not given)."
  - "TSV d 10 um, depth 100 um (ectc51909.2023.00230-a-i1); Al RDL 1 um both sides and 1 um SiO2 passivation (a-L02, L03, L11-L13); Si 100 um (a-L10)."
  - "Liner 1 um SiO2 (template, not reported), GSG pitch 50 um and line width 20 um (templates), front-side BEOL / BOX layers lumped into the 3 um front oxide."
  - "All metal PEC; Si conductivity 10 S/m (base) or 0.1 S/m (hr_si): N/A in the DB."
  - "Port leads are 40 um, below the SPEC 14.2 rule max(2 h, w_max) = 60 um for this CPW-like port (h = 30 um gap to the ground lines): runEm3d warns; a longer lead does not fit the 6e4 DOF budget, so the reduced case keeps it (port-distance error ~1e-3 in |S| per the wave-4 study)."
  - "Known limitation (L7 wave 6, lane L5 finding): at this 58.6k-DOF layered mesh the 1 um CPW lines on 100 um Si are under-resolved: port / line impedance 53.9 ohm (0.1 S/m) vs 68.87 ohm from a converged 2D solve; S at a fixed 50 ohm reference is wrong for hr_si (S11 about 20 dB too low). runEm3d warns (port_z_check). Use lane L5's NGSolve results for this case."
missing:
  - "GSG pitch, pad and line geometry, number of TSVs per pad, liner thickness, Si resistivity, BEOL stack thickness (needed to reproduce the 40 GHz HFSS / 45 GHz measured S11 dip, a-m4, a-m5)."
notes: "Browser-budget reduced case; not compared with a-m3..m6 (geometry not reproducible). Desktop deck: sims/em/em5a_tsv_gsg_reference_deck.md."
