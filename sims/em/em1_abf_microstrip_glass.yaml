schema: ap-sim/0
id: em/em1_abf_microstrip_glass
title: EM-1 70 ohm SAP Cu microstrip on 30 um ABF Type-A over Cu ground on glass core, IL/mm 10-220 GHz at 25 C
status: unvalidated
family: em2d
em2d:
  section:
    # x centred on the strip; y = 0 at the ground top face. Lateral half-width w/2 + 10 h, air 10 h above the strip
    # (R3 Sec. 2.4 microstrip rule >= 10 h; checked by the box_20h variant).
    box:
      x_um: [-317, 317]
      y_um: [-4.5, 334]
      bc: {left: pmc, right: pmc, bottom: pmc, top: pmc}
    background: air
    dielectrics:
      - name: abf
        material: abf_type_a_25C
        rect_um: {x: [-317, 317], y: [0, 30]}
        ref: "ectc51846.2026.00389-b-L02 (30 um, p.3 Sec. II.B)"
    conductors:
      - name: sig
        role: signal
        conductor: cu_plated
        rect_um: {x: [-17, 17], y: [30, 34]}
        roughness: {model: hammerstad, rq_um: 0.19}
        ref: "w 34 um, t 4 um, Rq 190 nm: ectc51846.2026.00389-b-L01 (p.3 Sec. III, Sec. II.B)"
      - name: gnd
        role: ground
        conductor: cu_plated
        rect_um: {x: [-317, 317], y: [-4.5, 0]}
        roughness: {model: hammerstad, rq_um: 0.19}
        ref: "ground Cu 3-6 um (ectc51846.2026.00389-b-L03, p.3 Sec. III); 4.5 um = midpoint (derived)"
  materials:
    abf_type_a_25C:
      model: causal_fit
      ref: "ectc51846.2026.00389-a-m1,m2,m7,m8,m13,m14,m19,m20,m25,m26,m31,m32 (p.5 Table I, 25 C)"
      points:
        - {f_GHz: 16.5, Dk: 3.406, Df: 0.00203}
        - {f_GHz: 60, Dk: 3.416, Df: 0.0031}
        - {f_GHz: 77, Dk: 3.412, Df: 0.0036}
        - {f_GHz: 138, Dk: 3.46, Df: 0.0049}
        - {f_GHz: 162, Dk: 3.463, Df: 0.0067}
        - {f_GHz: 216, Dk: 3.479, Df: 0.0083}
  conductor_materials:
    cu_plated:
      sigma_S_m: 5.8e7
      tcr_per_K: 0.00393
      T_ref_C: 20
      status: template
      note: >-
        Annealed-copper (IACS) conductivity at 20 C and its temperature coefficient of resistance (textbook values,
        not re-checked this session). Plated-Cu conductivity is not reported (N/A in DB); the paper adjusts resistivity
        with rho = rho0 (1 + alpha (T - T0)), T0 = 20 C (paper p.6 Eq. 7) without giving rho0 or alpha.
  temperature_C: 25
  conductor_model: volumetric
  return: auto
  roughness_reactance: true
  mesh: {order: 2, skin_cells: 1, grade: 0.45, f_max_GHz: 220}
  sweep: {start_GHz: 10, stop_GHz: 220, points: 50, spacing: lin}
  lines:
    - {length_mm: 4, zref_ohm: 50}
  touchstone: true
  variants:
    - id: smooth
      title: smooth Cu (no roughness)
      patch: {section: {conductors: {sig: {roughness: null}, gnd: {roughness: null}}}}
    - id: rough_signal_only
      title: Hammerstad roughness on the signal strip only
      patch: {section: {conductors: {gnd: {roughness: null}}}}
    - id: cannonball
      title: cannonball-Huray roughness (h_rms 0.19 um) on all Cu
      patch: {section: {conductors: {sig: {roughness: {model: cannonball, h_rms_um: 0.19}}, gnd: {roughness: {model: cannonball, h_rms_um: 0.19}}}}}
    - id: table
      title: ABF as a linear frequency table through the 6 points (non-causal, HFSS-style frequency-domain reference)
      patch:
        materials:
          abf_type_a_25C:
            model: table
    - id: box_20h
      title: clearance check, box half-width w/2 + 20 h and air 20 h
      patch:
        section:
          box: {x_um: [-617, 617], y_um: [-4.5, 634]}
          dielectrics: {abf: {rect_um: {x: [-617, 617], y: [0, 30]}}}
          conductors: {gnd: {rect_um: {x: [-617, 617], y: [-4.5, 0]}}}
    - id: T80C
      title: 80 C chuck (ABF Table I at 80 C, Cu conductivity scaled by the TCR), base roughness
      patch:
        temperature_C: 80
        materials:
          abf_type_a_25C:
            ref: "ectc51846.2026.00389-a-m3,m4,m9,m10,m15,m16,m21,m22,m27,m28,m33,m34 (p.5 Table I, 80 C)"
            points:
                - {f_GHz: 16.5, Dk: 3.412, Df: 0.0025}
                - {f_GHz: 60, Dk: 3.424, Df: 0.0034}
                - {f_GHz: 77, Dk: 3.426, Df: 0.0039}
                - {f_GHz: 138, Dk: 3.465, Df: 0.0053}
                - {f_GHz: 162, Dk: 3.471, Df: 0.0073}
                - {f_GHz: 216, Dk: 3.491, Df: 0.0091}
    - id: T115C
      title: 115 C chuck (ABF Table I at 115 C, Cu conductivity scaled by the TCR), base roughness
      patch:
        temperature_C: 115
        materials:
          abf_type_a_25C:
            ref: "ectc51846.2026.00389-a-m5,m6,m11,m12,m17,m18,m23,m24,m29,m30,m35,m36 (p.5 Table I, 115 C)"
            points:
                - {f_GHz: 16.5, Dk: 3.419, Df: 0.0028}
                - {f_GHz: 60, Dk: 3.43, Df: 0.0039}
                - {f_GHz: 77, Dk: 3.43, Df: 0.0041}
                - {f_GHz: 138, Dk: 3.469, Df: 0.0065}
                - {f_GHz: 162, Dk: 3.474, Df: 0.0078}
                - {f_GHz: 216, Dk: 3.532, Df: 0.0101}
targets:
  - {metric_id: ectc51846.2026.00389-b-m2, quantity: alpha_dB_mm, f_GHz: 33, value: 0.08, unit: dB/mm, tolerance: {abs: 0.033}, tier: D, variant: [base, smooth, rough_signal_only, cannonball, table, box_20h], locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m5, quantity: alpha_dB_mm, f_GHz: 77, value: 0.155, unit: dB/mm, tolerance: {abs: 0.0368}, tier: D, variant: [base, smooth, rough_signal_only, cannonball, table, box_20h], locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m8, quantity: alpha_dB_mm, f_GHz: 140, value: 0.265, unit: dB/mm, tolerance: {abs: 0.0423}, tier: D, variant: [base, smooth, rough_signal_only, cannonball, table, box_20h], locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m11, quantity: alpha_dB_mm, f_GHz: 200, value: 0.45, unit: dB/mm, tolerance: {abs: 0.0515}, tier: D, variant: [base, smooth, rough_signal_only, cannonball, table, box_20h], locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m3, quantity: alpha_dB_mm, f_GHz: 33, value: 0.096, unit: dB/mm, tolerance: {abs: 0.0338}, tier: D, variant: T80C, locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m6, quantity: alpha_dB_mm, f_GHz: 77, value: 0.2, unit: dB/mm, tolerance: {abs: 0.039}, tier: D, variant: T80C, locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m9, quantity: alpha_dB_mm, f_GHz: 140, value: 0.32, unit: dB/mm, tolerance: {abs: 0.045}, tier: D, variant: T80C, locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m12, quantity: alpha_dB_mm, f_GHz: 200, value: 0.519, unit: dB/mm, tolerance: {abs: 0.0549}, tier: D, variant: T80C, locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m4, quantity: alpha_dB_mm, f_GHz: 33, value: 0.11, unit: dB/mm, tolerance: {abs: 0.0345}, tier: D, variant: T115C, locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m7, quantity: alpha_dB_mm, f_GHz: 77, value: 0.21, unit: dB/mm, tolerance: {abs: 0.0395}, tier: D, variant: T115C, locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m10, quantity: alpha_dB_mm, f_GHz: 140, value: 0.43, unit: dB/mm, tolerance: {abs: 0.0505}, tier: D, variant: T115C, locator: "p.5 Table II"}
  - {metric_id: ectc51846.2026.00389-b-m13, quantity: alpha_dB_mm, f_GHz: 200, value: 0.596, unit: dB/mm, tolerance: {abs: 0.0588}, tier: D, variant: T115C, locator: "p.5 Table II"}
assumptions:
  - "TRL-de-embedded average IL/mm (paper p.5 Table II) is compared with the modal attenuation alpha of the quasi-TEM line (TRL references the line impedance, so mismatch loss is removed)."
  - "Quasi-TEM: no radiation, no surface-wave or dispersion beyond what RLGC(f) carries; strip w 34 um on h 30 um at 220 GHz is h / lambda_0 = 0.022."
  - "Rectangular trace profile (trapezoid / undercut not reported); ground Cu 4.5 um (DB range 3-6 um, midpoint)."
  - "Box bottom at the ground lower face (pmc): the ABF buffer, glass core and back-side layers below the ground are not modelled (ground thickness >> skin depth above 1 GHz)."
  - "Hammerstad roughness with Rq = 190 nm applied to every Cu surface (only one RMS value is reported; surface not stated); variants show smooth and signal-only."
  - "Cu conductivity: IACS 5.8e7 S/m at 20 C, TCR 0.00393 1/K, scaled to 25 C (template; plated-Cu value N/A)."
  - "ABF Dk/Df as a causal DS + Debye + Lorentz fit (NNLS) to the 25 C Table I points: misses Df by up to 8.8 % and Dk by up to 1.3 % (the extracted data are not representable by a passive causal model); variant table is the exact non-causal frequency table (2026-10-20 wave 3: base switched to causal_fit at lane L4's request so Touchstone / time-domain output is causal)."
missing:
  - "Plated Cu conductivity and its temperature coefficient (paper Eq. 7 without values)."
  - "Trace cross-section profile, ground Cu exact thickness, roughness per surface."
  - "Measured line widths per sample (max deviation +1.54 um only, ectc51846.2026.00389-b-m1)."
notes: "EM-1 of R3 Sec. 4.2. Tolerance = lane L4 rule (validation/cases/D/em_1_abf_microstrip_glass.yaml): 0.029 dB/mm + 5 % of the measured value (measurement uncertainty), so base (Hammerstad on all Cu) and smooth are expected to miss at one frequency each; they bracket the data."
