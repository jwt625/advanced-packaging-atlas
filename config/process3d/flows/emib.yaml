        equipment: {template: "electroless plating line", note: "tool not named"}
        hud:
          temp_c: {template: 40, source: "RESEARCH_PENDING.md P42 (US9702046B2: 30-60 C preferred, examples 35-55 C)", note: "48 C glass-interposer analog (tcpmt.2025.3557232-F1-s08)"}
          thickness_um: {analog: ectc51906.2022.00360-F1-s03.thickness_um, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: Georgia Tech laminated glass-panel flow, not an Intel EMIB paper)"}
