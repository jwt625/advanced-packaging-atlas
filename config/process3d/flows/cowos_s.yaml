        name: "Sputter Ti / Cu seed"
        category: deposition_pvd
        order: {kind: expansion, db: ectc51909.2023.00155-F1-s01, note: "seed sputter of the source module (s01)"}
        equipment: {analog: ectc51909.2023.00155-F1-s01.equipment, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: JOINT2 / Resonac 2.5D Si-interposer flow, not a TSMC CoWoS paper)"}
        hud:
          thickness_um: {analog: ectc51909.2023.00155-F1-s01.thickness_um, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: JOINT2 / Resonac 2.5D Si-interposer flow, not a TSMC CoWoS paper)"}
