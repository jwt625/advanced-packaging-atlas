          ti_um: {analog: ectc51909.2023.00155-F1-s01.target, value: 0.025, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: JOINT2 / Resonac 2.5D Si-interposer flow, not a TSMC CoWoS paper)"}
      - id: litho
        name: "Laminate dry-film resist, expose (i-line) and develop"
        category: lithography
        order: {kind: expansion, db: ectc51909.2023.00155-F1-s03, evidence: [ectc51909.2023.00155-F1-s02], note: "dry-film lamination (s02) and exposure / development (s03), one op"}
        equipment: {analog: ectc51909.2023.00155-F1-s03.equipment, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: JOINT2 / Resonac 2.5D Si-interposer flow, not a TSMC CoWoS paper)"}
        hud:
          dose_mj_cm2: {template: 100, source: "RESEARCH_TOOLS_FAB.md F80 (Ordyl Alpha 900 datasheet)", note: "dose not reported; upper end of the 35-100 mJ/cm2 window of a dry-film resist (PCB-grade film, low confidence)"}
          thickness_um: {analog: ectc51906.2022.00180-F3-s11.thickness_um, note: "resist thickness not reported; must exceed the 5 um plated pad; analog = 7 um dry-film positive resist (thinnest DB dry film above 5 um, RESEARCH_TOOLS_FAB.md F78)"}
      - id: plate
