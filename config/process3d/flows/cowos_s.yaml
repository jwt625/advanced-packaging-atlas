        hud:
          current_density_ma_cm2: {analog: ectc51846.2026.00199-F1-s08.current_density_ma_cm2, note: "not reported; analog = 1 A/dm2 Cu plating of 5 um traces and pads (RESEARCH_TOOLS_FAB.md F63)"}
          time_s: {analog: ectc51846.2026.00199-F1-s08.time_s, note: "not reported; analog = 28 min for a 5 um Cu target at 1 A/dm2 (F63)"}
          thickness_um: {analog: ectc51909.2023.00155-F1-s04.thickness_um, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: JOINT2 / Resonac 2.5D Si-interposer flow, not a TSMC CoWoS paper)"}
        targets:
          pad_um: {geom: ubump_pad_um}
      - id: strip
        name: "Strip the resist"
        category: resist_strip
        order: {kind: expansion, db: ectc51909.2023.00155-F1-s05, note: "resist stripping (s05)"}
        equipment: {template: "wet bench", note: "tool not named"}
