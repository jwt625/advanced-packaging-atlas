    piece: interposer_wafer
    order: {kind: backbone, db: ectc.2013.6575597-F2-s01}
    note: "op order: grind, Si recess dry etch, backside passivation, backside CMP of a 300 mm, 10 x 100 um TSV interposer (eptc59621.2023.10457670-F1 s14-s17). Grind stops above the TSV bottoms, the recess exposes liner-covered tips, passivation covers them, CMP opens the tips (nails polished flush with the passivation)."
    hud:
      thickness_in_um: {geom: ip_h0_um}
      thickness_um: {geom: si_final_um}
    targets:
      thinning_2013_um: {ref: ectc.2013.6575597-F2-s01.thickness_um}
      protrusion_um: {geom: protr_um}
    ops:
      - id: grind
        name: "Back-grind to just above the TSV tips"
        category: grinding_thinning
        order: {kind: expansion, db: eptc59621.2023.10457670-F1-s14, note: "wafer thinning by grinding of the source module (s14)"}
        equipment:
          analog: ectc51687.2025.00027-F1-s07.equipment
          note: "grinder not named for CoWoS; analog = surface grinder used for the interposer backside of a CoW wafer on a glass carrier"
        hud:
          thickness_in_um: {geom: ip_h0_um}
          thickness_um: {geom: reveal_grind_um}
        targets:
          removal_um: {geom: reveal_removal_um}
        physics:
          feed_um_s: {template: 5, source: "RESEARCH_TOOLS_FAB.md F126 (US7758402)", note: "rough infeed 4-6 um/s (med, recess-grinding patent); fine phases 0.25 / 0.12 / 0.05 um/s (F124, DAG810 #2000)"}
      - id: recess
        name: "Si recess dry etch to reveal the TSV tips"
        category: via_reveal
        order: {kind: expansion, db: eptc59621.2023.10457670-F1-s15, note: "TSV reveal dry etching of the source module (s15)"}
        equipment: {template: "plasma etcher (Si recess)", note: "tool not named"}
        hud:
          thickness_in_um: {geom: reveal_grind_um}
          thickness_um: {geom: si_final_um}
          time_s: {template: "recess_um / 9 * 60", source: "RESEARCH_TOOLS_FAB.md F141", note: "Si recess from the grind stop to the final thickness at > 9 um/min (SPTS Rapier XE, search excerpt, med)"}
        targets:
          protrusion_um: {geom: protr_um}
          liner_loss_um: {geom: liner_loss_um}
      - id: passivate
        name: "Backside passivation"
        category: deposition_other
        order: {kind: expansion, db: eptc59621.2023.10457670-F1-s16, note: "backside passivation of the source module (s16)"}
        equipment: {template: "low-temperature PECVD (< 200 C)", source: "RESEARCH_TOOLS_FAB.md F144, F25", note: "tool not named; backside passivation of a carrier-bonded wafer uses low-temperature (< 200 C) CVD films"}
        hud:
          thickness_um: {geom: bs_pass_h_um}
      - id: cmp
        name: "Backside CMP to open the TSV tips"
        category: cmp
        order: {kind: expansion, db: eptc59621.2023.10457670-F1-s17, note: "backside CMP of the source module (s17)"}
        equipment: {template: "CMP tool (platen, pad, carrier head, slurry)", note: "tool not named"}
        hud:
          pressure_mpa: {template: "3.0 * 0.006894757", source: "RESEARCH_TOOLS_FAB.md F102, F105 (US9956664B2)", note: "pressure not reported; 3.0 psi bulk Cu CMP on a 300 mm Reflexion tool (psi -> MPa exact factor)"}
          time_s: {template: "protr_um / 1.0268 * 60", source: "RESEARCH_TOOLS_FAB.md F105 (removal rate); F145 (reveal-CMP removal not found)", note: "tip-opening CMP: from the passivated tip bottom (TSV bottom - passivation) to the stop plane (Si plane - passivation) = the protrusion (5 um), at the 3 psi Cu rate (1.0268 um/min); rate for mixed Cu / oxide not found (audit A1 m7)"}
  - id: c4_bumping
    name: "C4 bumping: SnPb eutectic plated solder on the TSV backside (200 um pitch)"
    category: bumping
    piece: interposer_wafer
    order: {kind: backbone, db: ectc.2013.6575597-F2-s02}
    note: "op order: seed sputter, resist lithography, plating, strip, seed etch, reflow (ectc51909.2023.00155-F2 s05-s12, bottom-side bumping on a ground Si interposer on a glass carrier); the plated metal is the 2013 SnPb eutectic solder."
    targets:
      pitch_um: {geom: c4_pitch_um}
      diameter_um: {geom: c4_d_um}
      material: {ref: ectc.2013.6575597-F2-s02.material}
    ops:
      - id: seed
        name: "Sputter the C4 UBM / seed"
        category: deposition_pvd
        order: {kind: expansion, db: ectc51909.2023.00155-F2-s05, note: "seed sputter of the source module (s05); 2013: C4 'plated solder on UBM' (a-i3)"}
        equipment: {analog: ectc51909.2023.00155-F2-s05.equipment, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: JOINT2 / Resonac 2.5D Si-interposer flow, not a TSMC CoWoS paper)"}
        hud:
          thickness_um: {geom: ubm_h_um}
      - id: litho
        name: "Laminate resist, expose and develop the C4 openings"
        category: lithography
        order: {kind: expansion, db: ectc51909.2023.00155-F2-s07, evidence: [ectc51909.2023.00155-F2-s06], note: "dry-film lamination (s06) and i-line exposure / development (s07), one op"}
        equipment: {analog: ectc51909.2023.00155-F2-s07.equipment, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: JOINT2 / Resonac 2.5D Si-interposer flow, not a TSMC CoWoS paper)"}
        hud:
          dose_mj_cm2: {template: 100, source: "RESEARCH_TOOLS_FAB.md F80 (Ordyl Alpha 900 datasheet)", note: "dose not reported; upper end of the 35-100 mJ/cm2 window of a dry-film resist (PCB-grade film, low confidence)"}
          thickness_um: {geom: c4_res_h_um}
      - id: plate
        name: "Plate SnPb eutectic solder"
        category: electroplating
        order: {kind: self}
        equipment: {template: "wafer electroplating tool", note: "tool not named; 2013 states plated SnPb eutectic solder"}
        hud:
          current_density_ma_cm2: {template: 20, source: "RESEARCH_PENDING.md P3 (US6622907B2, IBM: eutectic PbSn from MSA, 20-100 mA/cm2)", note: "lower end of the range"}
          time_s: {template: "c4_h_um / (0.05219 * 20) * 60", source: "RESEARCH_PENDING.md P7, P8", note: "Faraday time for 63Sn37Pb (rho 8.4, NIST), 100 % efficiency"}
          thickness_um: {geom: c4_h_um}
      - id: strip
        name: "Strip the resist"
        category: resist_strip
        order: {kind: expansion, db: ectc51909.2023.00155-F2-s09, note: "resist stripping (s09)"}
        equipment: {template: "wet bench", note: "tool not named"}
      - id: seed_etch
        name: "Etch the seed outside the C4"
        category: etch_other
        order: {kind: expansion, db: ectc51909.2023.00155-F2-s10, note: "seed layer etching (s10)"}
        equipment: {template: "wet bench", note: "tool not named"}
      - id: reflow
        name: "Reflow the plated C4 into spheres"
        category: reflow
        order: {kind: expansion, db: ectc51909.2023.00155-F2-s12, note: "flux + bump reflow of the source module (s12); the source row's 260 C is a Cu/SnAg value and is not used for SnPb"}
        equipment: {analog: ectc51909.2023.00155-F2-s12.equipment, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: JOINT2 / Resonac 2.5D Si-interposer flow, not a TSMC CoWoS paper)"}
        hud:
          temp_c_max: {template: "(210 + 225) / 2", source: "Kester EP256 data sheet Rev 21Sep09 (2009-09-21), Sn63Pb37 recommended reflow profile: 'Peak Temp. 210 - 225 C', reflow zone 45-75 s typical; https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/876/EP256_Global_(21Sep09)[1].pdf", note: "SnPb bump reflow peak not reported for CoWoS; middle of a solder vendor's Sn63Pb37 process window (audit A1 M12; the J-STD-020 Tc 235 C used before is a classification limit, not a process peak). Solder hierarchy: the window straddles the 221 C liquidus of the SnAg uBumps already joined under UF1 / mold; at the drawn 217.5 C they stay solid, at the 225 C upper end (or the 235 C Tc) they would remelt inside the underfill"}
        physics:
          liquidus_c: {geom: liq_snpb_c}
  - id: debond
    name: "Laser debond the glass carrier"
    category: debonding
    piece: interposer_wafer
    order: {kind: inserted, db: ectc51687.2025.00027-F1-s10, note: "debond after backside bumping and before dicing, pairing the carrier of carrier_bond (ectc51687.2025.00027-F1 s09 -> s10 -> s11)"}
    equipment: {analog: ectc51687.2025.00027-F1-s10.equipment, note: "analog (audit A1 M11): value of the DB flow that orders this step or op (another build: JOINT2 / Resonac 120 mm 2.5D Si-interposer flow, not a TSMC CoWoS paper)"}
  - id: singulate
    name: "Singulate the CoW wafer into units"
