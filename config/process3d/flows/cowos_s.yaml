        equipment: {template: "i-line stepper", source: "RESEARCH_TOOLS_FAB.md F83-F85", note: "tool not named; packaging i-line steppers resolve 0.8-1 um, enough for a 5 um pitch"}
        hud:
          dose_mj_cm2: {template: 245, source: "RESEARCH_PENDING.md P29 (SPR955-CM: 245 mJ/cm2 at 0.40 um L/S in 1.40 um, i-line)", note: "Al RDL dose not reported"}
          thickness_um: {geom: al_res_h_um}
        targets:
          line_um: {geom: al_line_um}
      - id: al_etch
        name: "Dry etch the Al RDL"
        category: etch_dry
        order: {kind: expansion, db: eptc67330.2025.11392196-F2-s09, note: "dry etch Al (source s09)"}
        equipment: {template: "plasma etcher (metal etch)", note: "tool and chemistry not named in the source row"}
        hud:
          time_s: {na: "Al RDL dry-etch time (s); the only found rate (RESEARCH_PENDING.md P34, 1984 Al(Si) RIE with CCl4) is an obsolete chemistry for a 2013 TSMC flow, so it is not used"}
