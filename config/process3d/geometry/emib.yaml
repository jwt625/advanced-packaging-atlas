    trace: actual
    label: "joint (actual)"
    note: "proposal X3 (low confidence): EMIB top-die TCB joint temperature, s from contact; built from an Intel 2015 TCB process description (P17), a K&S head paper (P18) and non-EMIB DB rows (A10, A13, A55); no EMIB number. Time above the 221 C liquidus: 0.81 -> 4.68 s = 3.87 s"
    points:
      - ["0", {template: 140, source: "RESEARCH_PENDING.md P17 (Intel TCB: substrate e.g. 140 C)", note: "proposal: contact / preheat"}]
      - [{template: 1.1, source: "RESEARCH_PENDING.md X3 (P17 ramp > 100 C/s)", note: "proposal: 140 -> 250 C at > 100 C/s"}, {template: 250, source: "RESEARCH_PENDING.md X3 (A55 / A10 SnAg joint peak 250 C)", note: "proposal: joint peak"}]
      - [{template: 4.1, source: "RESEARCH_PENDING.md X3 (A13 6 s, A10 7 s)", note: "proposal: 3.0 s hold at the 250 C peak (time above the 221 C liquidus 3.87 s with the ramps)"}, {template: 250, source: "RESEARCH_PENDING.md X3", note: "proposal: joint peak hold"}]
      - [{template: 6.3, source: "RESEARCH_PENDING.md X3 (P17 cooling > 50 C/s)", note: "proposal: release"}, {template: 140, source: "RESEARCH_PENDING.md X3 (P17)", note: "proposal: back to the contact temperature"}]
  - id: tcb_F
    q: F
    unit: N
    label: "bond force"
    note: "proposal X3 (low confidence): constant 39.2 N (A13) until the joint crosses the 221 C liquidus at 0.81 s, then position control (solder chase, P17 / A17; force not drawn after)"
    points:
      - ["0", {analog: ectc51529.2024.00311-F1-s08.force_n, note: "4 kgf fluxless D2W TCB force (A13)"}]
      - [{template: 0.81, source: "RESEARCH_PENDING.md X3", note: "proposal: joint reaches 221 C on the 140 -> 250 C ramp"}, {analog: ectc51529.2024.00311-F1-s08.force_n, note: "constant force until melt"}]
  - id: btcb_T
    q: T
    unit: C
    trace: actual
    label: "bridge joint (actual)"
    note: "proposal X4 (low confidence): EMIB-T bridge panel-level TCB, same shape as X3 with the SnAg joint (X5); no condition found (P26). Time above the 221 C liquidus 3.87 s"
    points:
      - ["0", {template: 140, source: "RESEARCH_PENDING.md P17 (Intel TCB: substrate e.g. 140 C)", note: "proposal: contact / preheat"}]
      - [{template: 1.1, source: "RESEARCH_PENDING.md X4 (P17 ramp > 100 C/s)", note: "proposal: 140 -> 250 C at > 100 C/s"}, {template: 250, source: "RESEARCH_PENDING.md X4 (A55 / A10 SnAg joint peak 250 C)", note: "proposal: joint peak"}]
      - [{template: 4.1, source: "RESEARCH_PENDING.md X4 (A13 6 s, A10 7 s)", note: "proposal: 3.0 s hold at the 250 C peak (time above the 221 C liquidus 3.87 s with the ramps)"}, {template: 250, source: "RESEARCH_PENDING.md X4", note: "proposal: joint peak hold"}]
      - [{template: 6.3, source: "RESEARCH_PENDING.md X4 (P17 cooling > 50 C/s)", note: "proposal: release"}, {template: 140, source: "RESEARCH_PENDING.md X4 (P17)", note: "proposal: back to the contact temperature"}]

steps:
  buildup.laminate:
    - {op: coat, body: "abf_{i}", method: vacuum_laminate, label: "ABF level {i}"}
  buildup.cure:
    - {op: cure, bodies: ["abf_{i}"], label: "cure level {i}"}
  buildup.laser_via:
    - {op: etch_via, hole: "mv_{i}_c1", method: laser, label: "laser vias level {i} (DIE 1 field)"}
    - {op: etch_via, hole: "mv_{i}_c2", method: laser, label: "laser vias level {i} (DIE 2 field)"}
    - {op: etch_via, hole: "mv_{i}_c3", method: laser, label: "laser vias level {i} (DIE 3 field)"}
  buildup.desmear:
    - {op: clean, method: desmear, label: "desmear level {i}"}
  buildup.seed:
    - {op: deposit, film: "seed_{i}", method: electroless, label: "seed level {i}"}
  buildup.litho:
    - {op: coat, body: "dfr_{i}", method: dry_film, label: "dry film level {i}"}
    - {op: pattern, body: "dfr_{i}", method: aligner, tone: negative, label: "expose / develop level {i}"}
  buildup.plate:
    - {op: plate, bodies: ["vf_{i}_c1", "vf_{i}_c2", "vf_{i}_c3", "cu_{i}"], mode: through_mask, label: "Cu plating level {i}"}
  buildup.strip:
    - {op: strip, bodies: ["dfr_{i}"], method: resist_strip, label: "strip level {i}"}
  buildup.seed_etch:
    - {op: strip, bodies: ["seed_{i}"], method: seed_etch, label: "seed etch level {i}"}
  cavity:
    view: {primary: block, pip: cell, cell_site: fv_1a}  # block shows the cavity wall, floor and build-up (final audit F5)
    calls:
      - {op: etch_recess, cut: "cav_{k}", method: laser, repeat_over: {n: {geom: bridge_n}, var: k}, label: "cavity {k}"}
  cavity_t:
    view: {primary: block, pip: work}
    calls:
      - {op: etch_recess, cut: "cav_t_{k}", method: laser, repeat_over: {n: {geom: bridge_n}, var: k}, label: "cavity {k}"}
      - {op: plate, bodies: [cpfin_1, cpfin_2], mode: panel, tool: {id: wet_bench}, label: "cavity pad finish (ENi / Au, assumed)"}
  bridge_place:
    view: {primary: block, pip: cell, cell_site: fv_1a}
    calls:
      - {op: coat, body: "adh_{k}", method: print, repeat_over: {n: {geom: bridge_n}, var: k}, label: "adhesive {k} (form not reported)"}
      - op: place
        piece: bridge
        onto: substrate
        flip: false
        medium: adhesive
        at:
          - {x_um: {geom: bx_um}, y_um: "0", z_um: "cav_z_um + adh_h_um"}
          - {x_um: "0 - bx_um", y_um: "0", z_um: "cav_z_um + adh_h_um"}
  bridge_place_t:
    view: {primary: block, pip: cell, cell_site: cpad_1}
    calls:
      - op: bond_tcb
        piece: bridge_t
        onto: substrate
        flip: false
        solder: [bt_sol]
        profiles: {T: btcb_T}
        at:
          - {x_um: {geom: bx_um}, y_um: "0", z_um: "base_top_um + cav_fin_um"}
          - {x_um: "0 - bx_um", y_um: "0", z_um: "base_top_um + cav_fin_um"}
  bridge_uf_t:
    calls:
      - {op: underfill, fill: "uf_br_{k}", gap_um: {geom: bt_jh_um}, length_mm: {geom: t_bridge_w_mm}, dispense: one_side, repeat_over: {n: {geom: bridge_n}, var: k}, label: "bridge {k}"}
  final_lam.laminate:
    - {op: coat, body: "cav_fill_{k}", method: vacuum_laminate, repeat_over: {n: {geom: bridge_n}, var: k}, label: "cavity {k} fill"}
    - {op: coat, body: abf_5, method: vacuum_laminate, time: true, label: "ABF level 5"}
  final_lam.cure:
    - {op: cure, bodies: [cav_fill_1, cav_fill_2, abf_5]}
  encap_t.laminate:
    - {op: coat, body: "cav_fill_t_{k}", method: vacuum_laminate, repeat_over: {n: {geom: bridge_n}, var: k}, label: "encapsulate bridge {k}"}
    - {op: coat, body: abf_5, method: vacuum_laminate, time: true, label: "ABF level 5"}
  encap_t.cure:
    - {op: cure, bodies: [cav_fill_t_1, cav_fill_t_2, abf_5]}
  via_drill.drill:
    - {op: etch_via, hole: "mv5f_{k}a", method: laser, repeat_over: {n: {geom: bridge_n}, var: k}, label: "fine vias, bridge {k}, DIE 1 side"}
    - {op: etch_via, hole: "mv5f_{k}b", method: laser, repeat_over: {n: {geom: bridge_n}, var: k}, label: "fine vias, bridge {k}, outer side"}
    - {op: etch_via, hole: mv5c_c1, method: laser, label: "coarse vias (DIE 1 field)"}
    - {op: etch_via, hole: mv5c_c2, method: laser, label: "coarse vias (DIE 2 field)"}
    - {op: etch_via, hole: mv5c_c3, method: laser, label: "coarse vias (DIE 3 field)"}
  via_t.drill:
    - {op: etch_via, hole: "mv5t_{k}a", method: laser, repeat_over: {n: {geom: bridge_n}, var: k}, label: "direct vias, bridge {k}, DIE 1 side"}
    - {op: etch_via, hole: "mv5t_{k}b", method: laser, repeat_over: {n: {geom: bridge_n}, var: k}, label: "direct vias, bridge {k}, outer side"}
    - {op: etch_via, hole: mv5c_c1, method: laser, label: "coarse vias (DIE 1 field)"}
    - {op: etch_via, hole: mv5c_c2, method: laser, label: "coarse vias (DIE 2 field)"}
    - {op: etch_via, hole: mv5c_c3, method: laser, label: "coarse vias (DIE 3 field)"}
  via_plating.desmear:
    - {op: clean, method: desmear, label: "desmear"}
  via_plating.seed:
    - {op: deposit, film: seed_5, method: electroless}
  via_plating.litho:
    - {op: coat, body: dfr_5, method: dry_film}
    - {op: pattern, body: dfr_5, method: aligner, tone: negative}
  via_plating.plate:
    - {op: plate, bodies: [vf5f_1a, vf5f_1b, vf5f_2a, vf5f_2b, vf5t_1a, vf5t_1b, vf5t_2a, vf5t_2b, vf5c_c1, vf5c_c2, vf5c_c3, cu_5], mode: through_mask}
  via_plating.strip:
    - {op: strip, bodies: [dfr_5], method: resist_strip}
  via_plating.seed_etch:
    - {op: strip, bodies: [seed_5], method: seed_etch}
  bumps:
    view: {primary: cell, pip: block, cell_site: fv_1a}
    calls:
      - {op: coat, body: sr, method: dry_film, label: "solder resist"}
      - {op: pattern, body: sr, method: aligner, tone: negative, label: "SR openings"}
      - {op: plate, bodies: [fb_cu_1a, fb_cu_1b, fb_cu_2a, fb_cu_2b, cb_cu_1, cb_cu_2, cb_cu_3, fb_cap_1a, fb_cap_1b, fb_cap_2a, fb_cap_2b, cb_cap_1, cb_cap_2, cb_cap_3], mode: through_mask, label: "Cu, then SnAg caps"}
  fli_t:
    view: {primary: cell, pip: block, cell_site: fvt_1a}
    calls:
      - {op: coat, body: sr_t, method: dry_film, label: "solder resist"}
      - {op: pattern, body: sr_t, method: aligner, tone: negative, label: "SR openings"}
      - {op: plate, bodies: [ft_cu_1a, ft_cu_1b, ft_cu_2a, ft_cu_2b, cb_cu_1, cb_cu_2, cb_cu_3, ft_cap_1a, ft_cap_1b, ft_cap_2a, ft_cap_2b, cb_cap_1, cb_cap_2, cb_cap_3], mode: through_mask, label: "Cu, then SnAg caps"}
  tcb:
    view: {primary: block, pip: cell, cell_site: fv_1a}
    calls:
      - op: bond_tcb
        label: "DIE 1"
        piece: top_dies
        onto: substrate
        flip: true
        solder: [fb_cap_1a, fb_cap_2a, ft_cap_1a, ft_cap_2a, cb_cap_1]
        profiles: {T: tcb_T, F: tcb_F}
        at: [{x_um: "0", y_um: "0", z_um: {geom: bump_top_um}}]
      - op: bond_tcb
        label: "DIE 2 / DIE 3"
        piece: die2
        onto: substrate
        flip: true
        solder: [fb_cap_1b, fb_cap_2b, ft_cap_1b, ft_cap_2b, cb_cap_2, cb_cap_3]
        profiles: {T: tcb_T, F: tcb_F}
        at:
          - {x_um: {geom: d2c_um}, y_um: "0", z_um: {geom: bump_top_um}}
          - {x_um: "0 - d2c_um", y_um: "0", z_um: {geom: bump_top_um}}
  cuf:
    calls:
      - {op: underfill, fill: cuf, gap_um: {geom: fli_gap_um}, length_mm: {geom: d1_d_mm}, dispense: one_side, label: "DIE 1"}
      - {op: underfill, fill: cuf_2, gap_um: {geom: fli_gap_um}, length_mm: {geom: d2_d_mm}, dispense: one_side, label: "DIE 2"}
      - {op: underfill, fill: cuf_3, gap_um: {geom: fli_gap_um}, length_mm: {geom: d2_d_mm}, dispense: one_side, label: "DIE 3"}
  cuf_cure:
    calls:
      - {op: cure, bodies: [cuf, cuf_2, cuf_3]}
  lid:
    view: {primary: block, pip: work}
    calls:
      - {op: coat, body: tim_1, method: print, label: "TIM, DIE 1"}
      - {op: coat, body: tim_2, method: print, label: "TIM, DIE 2"}
      - {op: coat, body: tim_3, method: print, label: "TIM, DIE 3"}
      - {op: coat, body: seal, method: print, label: "sealant"}
      - op: place
        piece: lid
        onto: substrate
        flip: false
        medium: adhesive
        medium_body: seal
        at: [{x_um: "0", y_um: "0", z_um: "sr_top_um + seal_h_um"}]
  bga:
    orient: down
    calls:
      - {op: ball_attach, solder: [bga_ball], method: ball_drop}
