  - {id: cuf_3, name: "capillary underfill (DIE 3)", piece: substrate, kind: fill, material: underfill, rect: {x_um: {geom: d2c_um}, y_um: "0", w_um: "d2_w_mm * 1000", d_um: "d2_d_mm * 1000"}, z_um: {geom: sr_top_um}, h_um: {geom: fli_gap_um}, flow: {from: y-}}
  - {id: tim_1, name: "polymer TIM (DIE 1)", piece: substrate, kind: slab, material: silicone, label: "polymer TIM (composition not reported)", rect: {x_um: "0", y_um: "0", w_um: "d1_w_mm * 1000", d_um: "d1_d_mm * 1000"}, z_um: {geom: die_top_um}, h_um: {geom: tim_h_um}}
  - {id: tim_2, name: "polymer TIM (DIE 2)", piece: substrate, kind: slab, material: silicone, label: "polymer TIM (composition not reported)", rect: {x_um: "0 - d2c_um", y_um: "0", w_um: "d2_w_mm * 1000", d_um: "d2_d_mm * 1000"}, z_um: {geom: die_top_um}, h_um: {geom: tim_h_um}}
  - {id: tim_3, name: "polymer TIM (DIE 3)", piece: substrate, kind: slab, material: silicone, label: "polymer TIM (composition not reported)", rect: {x_um: {geom: d2c_um}, y_um: "0", w_um: "d2_w_mm * 1000", d_um: "d2_d_mm * 1000"}, z_um: {geom: die_top_um}, h_um: {geom: tim_h_um}}
  - {id: seal, name: "lid sealant bead", piece: substrate, kind: slab, material: adhesive, label: "sealant (not reported)", rect: {x_um: "0", y_um: "0", w_um: "sbt_w_mm * 1000", d_um: "sbt_d_mm * 1000"}, frame_inner: {w_um: {geom: lid_in_um}, d_um: {geom: lid_in_um}}, z_um: {geom: sr_top_um}, h_um: {geom: seal_h_um}}
  - {id: lid_foot, name: "IHS foot ring", piece: lid, kind: slab, material: cu, label: "IHS (material not reported)", initial: true, rect: {x_um: "0", y_um: "0", w_um: "sbt_w_mm * 1000", d_um: "sbt_d_mm * 1000"}, frame_inner: {w_um: {geom: lid_in_um}, d_um: {geom: lid_in_um}}, z_um: "0", h_um: {geom: foot_h_um}}
