# EMIB 3D template. Format: config/package3d/TEMPLATE_FORMAT.md. Generator: scripts/build_package3d.py.
# Backbone: ectc.2016.201-a (Intel EMIB architecture: thin Si bridge, no TSV, M1-M4 at 2/2 um, embedded in a cavity at
# the final build-up layer of an organic FCBGA substrate, held by adhesive, covered by the final build-up dielectric;
# fine-pitch vias land on the bridge pads; dies attached by TCB with 55 um bumps over the bridge and 130 um bumps
# elsewhere, capillary underfill). Layout follows its Fig. 4(a) schematic: DIE 2 | DIE 1 | DIE 3 in a row, one bridge
# under each die-die edge. The substrate outline comes from the EMIB CHIPS prototype MCP (ectc51687.2025.00061-a)
# because the backbone reports none.
# Routing (DevLog-011, 2026-10-20): the substrate is decomposed into SR / L1 pad level / build-up levels / core Cu /
# core with PTH / mirrored back side / BGA pad level / SR. No organic-substrate number is reported for this family (the
# only in-family numeric substrate rows are the glass-core 10-2-10 TV ectc51846.2026.00134-a), so the stack is analog:
# the 2.5D HPC 4/2/4 substrate ectc51909.2023.00155-a (15 um build-up film, L/S 14/20, 40 um via, 1.3 mm core, SR 18,
# 200 um PTH, BGA) with the 5/2/5 level count of the Si-bridge 2.5D MTV substrate ectc51846.2026.00073-a. The thin film
# is chosen because the fine vias over the bridge (55 um bump pitch) need a thin dielectric (a 40 um ABF level would
# give a via aspect ratio > 2). The same substrate analogs are used in emib_t.yaml for a like-for-like comparison.
# Cavity: bridge top at the top of L2 (one dielectric over the bridge, Fig. 4(a) / Fig. 5), bridge on adhesive on the
# L5 Cu plane; the adhesive thickness closes the stack (template).
id: emib
name: EMIB
company: Intel
package_class: si_bridge_organic
family_match: {families: true}
backbone_tv: ectc.2016.201-a
summary: >-
  Intel 2.5D without an interposer: a thin Si bridge (no TSV, {m_n} metal levels at {m_line_um}/{m_space_um} um) sits
  in an organic-substrate cavity under the die edges; {fine_pitch_um} um bumps over the bridge, {coarse_pitch_um} um
  elsewhere.

params:
  # ---- reported (backbone ectc.2016.201-a unless noted)
  sbt_w_mm: {ref: ectc51687.2025.00061-a.package_x_mm, note: "outline of the EMIB CHIPS prototype MCP (backbone reports none)"}
  sbt_d_mm: {ref: ectc51687.2025.00061-a.package_y_mm, note: "outline of the EMIB CHIPS prototype MCP (backbone reports none)"}
  die_n: {ref: ectc.2016.201-a-c5.count}
  bridge_w_mm: {ref: ectc.2016.201-a-c1.x_mm, note: "lower bound of the 2 x 2 to 8 x 8 mm bridge size range"}
  bridge_d_mm: {ref: ectc.2016.201-a-c1.y_mm, note: "lower bound of the 2 x 2 to 8 x 8 mm bridge size range"}
  bridge_h_um: {ref: ectc.2016.201-a-c1.thickness_um, note: "upper bound: bridge wafer thinned below 75 um"}
  m_n: {ref: ectc.2016.201-a-L02.repeat}
  m_line_um: {ref: ectc.2016.201-a-L02.line_um}
  m_space_um: {ref: ectc.2016.201-a-L02.space_um}
  m_via_um: {ref: ectc.2016.201-a-L02.via_diameter_um}
  fine_pitch_um: {ref: ectc.2016.201-a-i1.pitch_um}
  coarse_pitch_um: {ref: ectc.2016.201-a-i2.pitch_um}
  gen2_pitch_um: {ref: ectc51687.2025.00051-b-i1.pitch_um}
  m_pairs_n: "m_n / 2"   # M4..M1 as 2 x (signal level, Vss plane level)
  # ---- template: layout (die sizes and positions are not dimensioned in any EMIB row)
  bridge_n:
    template: 2
    refs: [ectc.2016.201-a.notes]
    note: "two bridges, one under each die-die edge, as drawn in the Fig. 4(a) schematic (3 dies, 2 bridges)"
  d1_w_mm:
    analog: ectc51906.2022.00106-a-c1.x_mm
    note: "DIE 1 size not reported for EMIB; analog = processor chip of an IBM bridge (DBHi) package"
  d1_d_mm:
    analog: ectc51906.2022.00106-a-c1.y_mm
    note: "DIE 1 size not reported for EMIB; analog = processor chip of an IBM bridge (DBHi) package"
  d1_h_um:
    analog: ectc51906.2022.00106-a-c1.thickness_um
    note: "die thickness not reported for EMIB; analog = processor chip of the same DBHi package"
  d2_w_mm:
    analog: ectc51909.2023.00135-a-c2.x_mm
    note: "DIE 2 / DIE 3 (smaller dies in Fig. 4(a)) size not reported; analog = HBM2E footprint of a 2.5D TV"
  d2_d_mm:
    analog: ectc51909.2023.00135-a-c2.y_mm
    note: "DIE 2 / DIE 3 (smaller dies in Fig. 4(a)) size not reported; analog = HBM2E footprint of a 2.5D TV"
  d2_h_um: {template: "d1_h_um", note: "DIE 2 / DIE 3 drawn at the same height as DIE 1 in the Fig. 4(a) schematic"}
  d2_n: {template: "die_n - 1", note: "DIE 2 and DIE 3 flank DIE 1 (Fig. 4(a))"}
  die_gap_um:
    analog: tcpmt.2023.3312037-a-c2.gap_um
    note: "die-to-die gap not reported for EMIB; analog = Intel Co-EMIB DtD spacing ('as small as 100 um')"
  d2_px_mm: {template: "d1_w_mm + 2 * die_gap_um / 1000 + d2_w_mm", note: "DIE 2 / DIE 3 centers at the D2D gap on each side of DIE 1"}
  bridge_px_mm: {template: "d1_w_mm + die_gap_um / 1000", note: "bridge centered under each die-die gap"}
  # ---- template: substrate stack (analogs; same set as emib_t.yaml)
  bu_n:
    analog: ectc51846.2026.00073-a-L07.repeat
    note: "EMIB substrate layer count not reported; analog = 5 build-up levels per side (5/2/5) of a Si-bridge 2.5D MTV substrate"
  bu_pairs_n: {template: "(bu_n - 1) / 2", note: "L2..L5 below the L1 pad level as 2 x (signal level, plane level); the 5th dielectric sits on the core Cu"}
  sr_h_um:
    analog: ectc51909.2023.00155-a-L15.thickness_um
    note: "solder resist not reported for EMIB; analog = SR of a 2.5D HPC 4/2/4 substrate"
  cu_h_um:
    analog: ectc51687.2025.00148-a-L06.thickness_um
    note: "build-up Cu thickness not reported for EMIB (nor in the 4/2/4 film analog); analog = build-up Cu of a 4-2-4 FCBGA TV; used for every Cu level incl. core Cu"
  bu_diel_um:
    analog: ectc51909.2023.00155-a-L16.thickness_um
    note: "build-up dielectric not reported for EMIB; analog = 15 um build-up film of a 2.5D HPC 4/2/4 substrate (thin enough for the fine vias over the bridge)"
  bu_line_um:
    analog: ectc51909.2023.00155-a-L16.line_um
    note: "build-up L/S not reported for EMIB; analog = 14/20 um wiring of the same 4/2/4 substrate"
  bu_space_um:
    analog: ectc51909.2023.00155-a-L16.space_um
    note: "build-up L/S not reported for EMIB; analog = 14/20 um wiring of the same 4/2/4 substrate"
  core_h_um:
    analog: ectc51909.2023.00155-a-L17.thickness_um
    note: "core thickness not reported for EMIB; analog = CCL core of the same 4/2/4 substrate"
  sbt_h_um:
    template: "core_h_um + 2 * (sr_h_um + (bu_n + 1) * cu_h_um + bu_n * bu_diel_um)"
    note: "substrate = core + 2 x (SR + 5 build-up Cu + core Cu + 5 dielectrics) (template inputs)"
  # ---- template: vias in the substrate
  mvia_d_um:
    analog: ectc51909.2023.00155-a-i6.diameter_um
    note: "build-up microvia not reported for EMIB; analog = 40 um microvia of the same 4/2/4 substrate (top diameter)"
  mv_wall_tan:
    template: "2 * r0 / (r1 - r2)"
    refs: [ectc51687.2025.00378-a-m5.value, ectc51687.2025.00378-a-m6.value, ectc51687.2025.00378-a-m7.value]
    note: "harmonized microvia taper rule (TEMPLATE_FORMAT.md 'Template rules'): bottom = top - 2 x drawn dielectric depth / tan(sidewall angle); tan(angle) = 2 x 15 um dielectric over the pad / (41.66 um top - 38.01 um bottom) = 8.22 (83 deg), measured on a 40 um laser via in laminated dry-film dielectric (analog TV ectc51687.2025.00378-a, Fig. 7); this family's earlier 38 / 42 diameter ratio came from the same via"
  mvia_bot_um:
    template: "mvia_d_um - 2 * bu_diel_um / mv_wall_tan"
    note: "microvia bottom not reported; harmonized taper rule over the drawn bu_diel_um depth (mv_wall_tan)"
  mvia_land_um:
    template: "mvia_d_um * r0 / r1"
    refs: [001c.147203-a-i1.pad_x_um, 001c.147203-a-i1.diameter_um]
    note: "microvia land not reported for a cored organic substrate; harmonized rule, TEMPLATE_FORMAT.md 'Template rules': land / via = 110 / 70 (pad >= 110 um for a 70 um Cu-filled stacked via: minimum design rule of a coreless 150 GHz AiP antenna substrate, R-G640)"
  pth_d_um:
    analog: ectc51909.2023.00155-a-i5.diameter_um
    note: "core through hole not reported for EMIB; analog = 200 um PTH in the 1.3 mm core of the same 4/2/4 substrate"
  pth_pitch_um:
    analog: ectc51687.2025.00148-a-i4.pitch_um
    note: "PTH pitch not reported for EMIB (nor for the 4/2/4 film analog); analog = 500 um core TH pitch of a 4-2-4 FCBGA TV"
  pth_wall_um:
    template: "(r0 + r1 + r2 + r3) / 4"
    refs: [eptc62800.2024.10909809-a-m17.value, eptc62800.2024.10909809-a-m18.value, eptc62800.2024.10909809-a-m19.value, eptc62800.2024.10909809-a-m20.value]
    note: "PTH plating not reported for a cored HPC substrate; harmonized rule, TEMPLATE_FORMAT.md 'Template rules': mean of the minimum barrel Cu of legs 1-4 of a thin-core through hole (11-18.5 um, mean 14.875 um)"
  pth_land_um:
    template: "pth_d_um * 1.5"
    refs: [ectc51687.2025.00148-a-i4.pitch_um]
    note: "PTH land not reported; harmonized rule, TEMPLATE_FORMAT.md 'Template rules': 1.5 x the hole, read from the 4-2-4 FCBGA schematic (fig ectc51687.2025.00148-f01, scaled by the 500 um TH pitch)"
  fv_d_um:
    analog: ectc51906.2022.00180-a-i1.diameter_um
    note: "fine via onto the bridge pads: dims not reported; analog = 16 um laser microvia through ABF onto the pads of an embedded Si die under 55 um-pitch bumps"
  fv_bot_um:
    template: "fv_d_um - 2 * bu_diel_um / mv_wall_tan"
    note: "fine-via (laser via through the same build-up film) bottom not reported; harmonized taper rule over the drawn bu_diel_um depth (mv_wall_tan)"
  fv_land_um:
    template: 30
    refs: [ectc51906.2022.00180-a-i1.notes]
    note: "bridge pad / fine-via land not reported; largest pad of the 10/20/30 um pad arrays of the embedded-die analog (fits the 55 um pitch)"
  # ---- template: bridge BEOL
  m_h_um:
    analog: ectc51909.2023.00174-d-L02.thickness_um
    note: "bridge metal level thickness not reported; analog = TSMC LSI-1 dual-damascene Cu level"
  m_imd_um:
    analog: ectc51846.2026.00035-a-L02.thickness_um
    note: "inter-metal dielectric of the bridge not reported; analog = 1 um SiO2 ILD of a dual-damascene Si bridge"
  pad_h_um:
    template: "m_h_um"
    refs: [ectc.2016.201-a-L01.layer_name]
    note: "bridge pad layer thickness not reported; set equal to a metal level"
  br_plane_fill:
    template: 0.6
    refs: [ectc.2016.201-a-L02.properties]
    note: "Vss level metal density 50-70 % (Table II); midpoint"
  bridge_si_um:
    template: "bridge_h_um - pad_h_um - m_n * (m_h_um + m_imd_um)"
    note: "bridge Si = bridge thickness - pad layer - 4 x (via dielectric + metal level) (analog level thicknesses)"
  # ---- template: cavity
  bridge_depth_um:
    template: "sr_h_um + cu_h_um + bu_diel_um"
    refs: [ectc.2016.201-a-L04.notes]
    note: "bridge top at the top of L2: one final build-up dielectric laminated over the bridge (fine vias through it); thickness over the bridge not reported"
  cav_floor_um:
    template: "sr_h_um + (bu_n - 1) * (cu_h_um + bu_diel_um)"
    refs: [ectc.2016.201-a-L05.notes]
    note: "cavity floor = top of the L5 Cu plane (a Cu plane under the bridge in Fig. 4(a) / Fig. 5); cavity depth not reported"
  adh_h_um:
    template: "cav_floor_um - bridge_depth_um - bridge_h_um"
    refs: [ectc.2016.201-a-c3.name, ectc51909.2023.00155-a-c5.thickness_um, ectc51906.2022.00180-a-L08.thickness_um]
    note: "bridge adhesive thickness not reported; closes the cavity (floor - bridge top - bridge); DB die-attach films are 10-20 um"
  # ---- template: joints
  fine_d_um:
    analog: ectc51906.2022.00180-a-i3.diameter_um
    note: "fine bump diameter not reported for EMIB; analog = 55 um-pitch Cu/SnAg micro-bump of a glass 2.5D package"
  bump_cap_um:
    analog: ectc51906.2022.00180-a-i3.cap_height_um
    note: "solder cap height not reported; cap of the same analog joint as the standoff (R2 2026-10-20: joint drawn as Cu column + solder cap)"
  bump_h_um:
    template: "r0 + r1"
    refs: [ectc51906.2022.00180-a-i3.height_um, ectc51906.2022.00180-a-i3.cap_height_um, ectc.2016.201-a-i1.notes]
    note: "bump standoff not reported; Cu + SnAg cap of the 55 um-pitch analog; one standoff for fine and coarse bumps (mixed-CD bumps with height control)"
  coarse_d_um:
    analog: vlsitechnologyandcir46783.2024.10631478-a-i2.diameter_um
    note: "coarse bump diameter not reported for EMIB; analog = Intel Foveros 110 um-pitch package-side bump"
  uf_margin_mm: {template: 0.5, note: "capillary underfill fillet extent not reported; illustrative"}
  bga_pitch_um:
    analog: ectc51909.2023.00155-a-i4.pitch_um
    refs: [ectc.2016.201-a-i5.notes]
    note: "BGA drawn in the Fig. 4(a) schematic without dimensions; analog pitch of a large 2.5D TV"
  bga_d_um:
    analog: ectc51909.2023.00155-a-i4.diameter_um
    note: "BGA ball diameter not reported for EMIB; analog = SAC305 ball of the same 2.5D TV"
  bga_h_um:
    template: 478
    refs: [ectc51909.2023.00155-a-i4.notes]
    note: "BGA height not reported for EMIB; the analog row's notes give a measured ball height of 478 um"

parts:
  - {id: substrate, name: "Organic FCBGA substrate", kind: substrate, material: organic_laminate,
     material_label: "organic build-up substrate", w_mm: sbt_w_mm, d_mm: sbt_d_mm, h_um: sbt_h_um, base: true,
     explode_group: 0}
  - id: bridge
    name: "EMIB bridge (Si, no TSV)"
    kind: bridge
    material: silicon
    w_mm: bridge_w_mm
    d_mm: bridge_d_mm
    h_um: bridge_h_um
    in: substrate
    depth_um: bridge_depth_um
    repeat: {nx: bridge_n, pitch_x_mm: bridge_px_mm}
    explode_group: 1
  - id: adhesive
    name: "Bridge adhesive"
    kind: other
    material: other
    material_label: "adhesive (not named)"
    w_mm: bridge_w_mm
    d_mm: bridge_d_mm
    h_um: adh_h_um
    in: substrate
    depth_um: "bridge_depth_um + bridge_h_um"
    repeat: {nx: bridge_n, pitch_x_mm: bridge_px_mm}
    explode_group: 1
    note: "cavity formed at the final build-up layer down to the L5 Cu plane; cavity clearance around the bridge not drawn"
  - {id: die1, name: "DIE 1", kind: die, material: silicon, w_mm: d1_w_mm, d_mm: d1_d_mm, h_um: d1_h_um, on: substrate,
     standoff: fli_coarse, explode_group: 3}
  - id: die2
    name: "DIE 2 / DIE 3"
    kind: die
    material: silicon
    w_mm: d2_w_mm
    d_mm: d2_d_mm
    h_um: d2_h_um
    on: substrate
    standoff: fli_coarse
    repeat: {nx: d2_n, pitch_x_mm: d2_px_mm}
    explode_group: 3
  - id: uf
    name: "Capillary underfill"
    kind: underfill
    material: underfill
    material_label: "epoxy underfill"
    fill: {above: substrate, parts: [die1, die2], margin_mm: uf_margin_mm}
    explode_group: 2
    xray_default: true

layers:
  # ---- bridge: pad layer, M4..M1 (signal / Vss plane alternating), Si
  - part: bridge
    pattern:
      - {id: br_pad, name: "Bridge pad layer", material: copper, material_label: "metal (not specified)",
         role: conductor, h_um: pad_h_um,
         route: {use: pad, matrix: oxide}}
  - part: bridge
    repeat: m_pairs_n
    pattern:
      - {id: br_vs, name: "Bridge via dielectric", material: oxide, material_label: "inter-metal dielectric (not specified)",
         role: dielectric, h_um: m_imd_um, via_um: m_via_um}
      - {id: br_ms, name: "Bridge signal level (M4, M2)", material: copper, material_label: "BEOL metal (not specified)",
         role: conductor, h_um: m_h_um, line_um: m_line_um, space_um: m_space_um,
         route: {use: signal, dir: x, line_um: m_line_um, space_um: m_space_um, matrix: oxide}}
      - {id: br_vp, name: "Bridge via dielectric", material: oxide, material_label: "inter-metal dielectric (not specified)",
         role: dielectric, h_um: m_imd_um, via_um: m_via_um}
      - {id: br_mp, name: "Bridge Vss plane (M3, M1)", material: copper, material_label: "BEOL metal (not specified)",
         role: conductor, h_um: m_h_um,
         route: {use: plane, space_um: m_space_um, matrix: oxide, fill: br_plane_fill}}
  - part: bridge
    pattern:
      - {id: br_si, name: "Bridge Si", material: silicon, role: core, h_um: bridge_si_um}
  # ---- substrate front: SR, L1 pad level, L2..L5, core Cu
  - part: substrate
    pattern:
      - {id: sr_top, name: "Solder resist (top)", material: polymer_dielectric, material_label: "solder resist",
         role: passivation, h_um: sr_h_um}
      - {id: top_cu, name: "L1 pad level (FLI pads)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: pad, matrix: polymer_dielectric}}
  - part: substrate
    repeat: bu_pairs_n
    pattern:
      - {id: bu_ds, name: "Build-up dielectric", material: organic_build_up, material_label: "build-up film (not named)",
         role: dielectric, h_um: bu_diel_um}
      - {id: bu_sig, name: "Build-up signal level (L2, L4)", material: copper, role: conductor, h_um: cu_h_um,
         line_um: bu_line_um, space_um: bu_space_um,
         route: {use: signal, dir: alt, line_um: bu_line_um, space_um: bu_space_um, matrix: organic_build_up}}
      - {id: bu_dp, name: "Build-up dielectric", material: organic_build_up, material_label: "build-up film (not named)",
         role: dielectric, h_um: bu_diel_um}
      - {id: bu_pl, name: "Build-up plane (L3 GND, L5 PWR)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: plane, space_um: bu_space_um, matrix: organic_build_up}}
  - part: substrate
    pattern:
      - {id: bu_dc, name: "Build-up dielectric (on core)", material: organic_build_up,
         material_label: "build-up film (not named)", role: dielectric, h_um: bu_diel_um}
      - {id: core_cu_t, name: "Core Cu (top face)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: plane, space_um: bu_space_um, matrix: organic_laminate}}
      - {id: sbt_core, name: "Core", material: organic_laminate, material_label: "laminate core", role: core,
         h_um: core_h_um}
      - {id: core_cu_b, name: "Core Cu (bottom face)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: plane, space_um: bu_space_um, matrix: organic_laminate}}
  # ---- substrate back: mirrored L7..L10, L11 BGA pad level, SR
  - part: substrate
    repeat: bu_pairs_n
    pattern:
      - {id: bb_dp, name: "Back build-up dielectric", material: organic_build_up,
         material_label: "build-up film (not named)", role: dielectric, h_um: bu_diel_um}
      - {id: bb_pl, name: "Back plane (L7 PWR, L9 GND)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: plane, space_um: bu_space_um, matrix: organic_build_up}}
      - {id: bb_ds, name: "Back build-up dielectric", material: organic_build_up,
         material_label: "build-up film (not named)", role: dielectric, h_um: bu_diel_um}
      - {id: bb_sig, name: "Back signal level (L8, L10)", material: copper, role: conductor, h_um: cu_h_um,
         line_um: bu_line_um, space_um: bu_space_um,
         route: {use: signal, dir: alt, line_um: bu_line_um, space_um: bu_space_um, matrix: organic_build_up}}
  - part: substrate
    pattern:
      - {id: bb_dc, name: "Back build-up dielectric (outer)", material: organic_build_up,
         material_label: "build-up film (not named)", role: dielectric, h_um: bu_diel_um}
      - {id: bga_cu, name: "L11 BGA pad level", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: pad, matrix: polymer_dielectric}}
      - {id: sr_bot, name: "Solder resist (bottom)", material: polymer_dielectric, material_label: "solder resist",
         role: passivation, h_um: sr_h_um}

arrays:
  - {id: fine_d1, name: "Fine bumps over the bridge", kind: microbump, per: die1, lower: substrate,
     region: {intersect: [bridge]}, pitch_um: fine_pitch_um, diameter_um: fine_d_um, height_um: bump_h_um, cap_h_um: bump_cap_um}
  - {id: fine_d2, name: "Fine bumps over the bridge", kind: microbump, per: die2, lower: substrate,
     region: {intersect: [bridge]}, pitch_um: fine_pitch_um, diameter_um: fine_d_um, height_um: bump_h_um, cap_h_um: bump_cap_um}
  - {id: fli_coarse, name: "Coarse bumps", kind: microbump, per: die1, lower: substrate, region: {subtract: [bridge]},
     pitch_um: coarse_pitch_um, diameter_um: coarse_d_um, height_um: bump_h_um, cap_h_um: bump_cap_um,
     note: "coarse pitch rendered over the die outside the bridge; the bump map is not reported"}
  - {id: coarse_d2, name: "Coarse bumps", kind: microbump, per: die2, lower: substrate, region: {subtract: [bridge]},
     pitch_um: coarse_pitch_um, diameter_um: coarse_d_um, height_um: bump_h_um, cap_h_um: bump_cap_um}
  - {id: bga, name: "BGA balls", kind: bga, under: substrate, region: {part: substrate}, pitch_um: bga_pitch_um,
     diameter_um: bga_d_um, height_um: bga_h_um}

routing:
  layout_note: >-
    mock-up routing: net layout, shares, jogs and the signal / plane assignment of levels are illustrative (Fig. 4(a)
    and Fig. 5 of ectc.2016.201 as the visual reference); dims carry their own status
  vias:
    - {id: bv_fine, name: "Fine via onto bridge pad", kind: bridge_via, through: bu_ds_1, diameter_um: fv_d_um,
       bottom_diameter_um: fv_bot_um, land_um: fv_land_um, pitch_um: fine_pitch_um, fill: filled,
       region: {part: bridge},
       note: "used inside the bridge footprint (one per fine bump, landing fully on a bridge pad); the build-up microvia mv_s_1 spans the same dielectric outside it"}
    - {id: bv_m, name: "Bridge BEOL via", kind: beol_via, through: br_vs, diameter_um: m_via_um, fill: filled,
       note: "dual damascene, reported 2 um"}
    - {id: bv_mp, name: "Bridge BEOL via", kind: beol_via, through: br_vp, diameter_um: m_via_um, fill: filled,
       note: "dual damascene, reported 2 um"}
    - {id: mv_s, name: "Build-up microvia", kind: microvia, through: bu_ds, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_p, name: "Build-up microvia", kind: microvia, through: bu_dp, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_c, name: "Build-up microvia", kind: microvia, through: bu_dc, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_um, land_um: mvia_land_um, fill: filled}
    - {id: pth, name: "Plated through hole", kind: pth, through: sbt_core, diameter_um: pth_d_um, land_um: pth_land_um,
       pitch_um: pth_pitch_um, fill: plugged, plug: resin, wall_um: pth_wall_um,
       note: "resin-plugged, Cu-capped barrel (cores >= 400 um are drilled and plugged)"}
    # back side: laser-drilled from below, so the bottom is the wide end
    - {id: mvb_p, name: "Back microvia", kind: microvia, through: bb_dp, diameter_um: mvia_bot_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mvb_s, name: "Back microvia", kind: microvia, through: bb_ds, diameter_um: mvia_bot_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mvb_c, name: "Back microvia", kind: microvia, through: bb_dc, diameter_um: mvia_bot_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
  nets:
    # die-to-die wires on the bridge signal levels (fine bump -> L1 pad -> fine via -> bridge pad -> M4 / M2 -> across)
    - {id: d2d, kind: lateral, from: fine_d1, to: fine_d2, levels: [br_ms], share: 0.6}
    - {id: pg_fine1, kind: plane_tie, from: fine_d1, plane: br_mp_1, share: 0.3}
    - {id: pg_fine2, kind: plane_tie, from: fine_d2, plane: br_mp_1, share: 0.3}
    # coarse bumps -> build-up (fan-out jogs) -> PTH -> back build-up -> BGA
    - {id: io1, kind: vertical, from: fli_coarse, to: bga, style: stacked, jog: [bu_sig_1, bu_sig_2, bb_sig_2],
       share: 0.4}
    - {id: io2, kind: vertical, from: coarse_d2, to: bga, style: stacked, jog: [bu_sig_1, bu_sig_2, bb_sig_2],
       share: 0.4}
    - {id: pg_top, kind: plane_tie, from: fli_coarse, plane: bu_pl_1, share: 0.3}
    - {id: pg_bot, kind: plane_tie, from: bga, plane: bb_pl_2, share: 0.3}
    - {id: esc, kind: escape, from: fli_coarse, levels: [bu_sig_1], share: 0.2, length_um: 400}

callouts:
  - {target: bridge, text: "Si bridge, no TSV",
     note: "Si bridge {bridge_w_mm} x {bridge_w_mm} to 8 x 8 mm, below {bridge_h_um} um, no TSV; more than 5 bridges per package possible",
     refs: [ectc.2016.201-a-c1.notes, ectc.2016.201-a-c1.material]}
  - {target: br_ms, text: "M1-M4 L/S {m_line_um}/{m_space_um} um",
     note: "M1-M4: L/S {m_line_um}/{m_space_um} um, vias {m_via_um} um (dual damascene); 50-70 % metal density on the Vss level",
     refs: [ectc.2016.201-a-L02.properties]}
  - {target: adhesive, text: "Bridge on adhesive in cavity",
     note: "Bridge held by adhesive in a cavity at the final build-up layer, then covered by build-up dielectric",
     refs: [ectc.2016.201-a-L05.notes, ectc.2016.201-a-L04.notes]}
  - {target: fine_d1, text: "Fine {fine_pitch_um} / coarse {coarse_pitch_um} um",
     note: "Fine {fine_pitch_um} um over the bridge, coarse {coarse_pitch_um} um elsewhere; TCB + capillary underfill",
     refs: [ectc.2016.201-a-i1.bonding_method, ectc.2016.201-a-c4.name]}
  - {target: fine_d1, text: "{gen2_pitch_um} um pitch, later flow",
     note: "{gen2_pitch_um} um bump pitch in the later EMIB flow (ectc51687.2025.00051)"}
  - {target: bv_fine, text: "Fine vias land on bridge pads",
     note: "Fine vias land fully on bridge pads; coarse vias outside the bridge stack down to the core",
     refs: [ectc.2016.201-a-i3.notes, ectc.2016.201-a-i4.notes]}
  - {target: d2d, text: "D2D wires in bridge M4/M2",
     note: "Die-to-die wires on the bridge signal levels between the two fine-bump fields; example link: 300 IO/mm in a single level (mock-up level assignment)",
     refs: [ectc.2016.201-a-e1.scope, ectc.2016.201-a-L02.repeat]}
  - {target: mv_s, text: "Stacked microvias, build-up levels",
     note: "Coarse-bump nets drop through stacked filled microvias with fan-out jogs on the signal levels (mock-up; substrate stack is analog)"}
  - {target: pth, text: "Plugged PTH through core",
     note: "Plated through holes carry the nets through the core to the back build-up and BGA (analog dims)"}

insets:
  - id: bridge_d2d
    label: "Bridge levels under the Die-die gap"
    box_mm: ["bridge_px_mm / 2 - 0.25", -0.25, "bridge_px_mm / 2 + 0.25", 0.25]
    z: ["bottom:bridge", "bottom:die1"]
    view: front
  - id: bridge_gap
    label: "Die-die gap over the bridge"
    box_mm: ["bridge_px_mm / 2 - bridge_w_mm / 2 - 0.5", -1, "bridge_px_mm / 2 + bridge_w_mm / 2 + 0.5", 1]
    z: ["bottom:adhesive", "top:die1"]
    view: front
  - id: bridge_xs
    label: "Bridge in cavity: adhesive, metal levels, fine vias"
    box_mm: ["bridge_px_mm / 2 - bridge_w_mm / 2 - 0.3", -0.4, "bridge_px_mm / 2 - bridge_w_mm / 2 + 0.5", 0.4]
    z: ["bottom:adhesive", "bottom:die1"]
    view: front
  - id: fine_coarse
    label: "Fine / coarse bump transition"
    box_mm: ["bridge_px_mm / 2 - bridge_w_mm / 2 - 0.6", "bridge_d_mm / 2 - 0.6", "bridge_px_mm / 2 + 0.2",
             "bridge_d_mm / 2 + 0.6"]
    z: ["top:bridge", "top:die1"]
    view: front   # A9 D4 (2026-10-21): section view instead of the oblique camera
  - id: buildup_xs
    label: "Coarse bump to BGA: build-up, PTH"
    box_mm: [-1.5, -0.5, 1.5, 0.5]
    z: ["bottom:bga", "bottom:die1"]
    view: front

# ---- variants (L28, 2026-10-21; TEMPLATE_FORMAT.md "variants"). The base above stays the reported DB backbone
# (Fig. 4(a) 3-die schematic of ectc.2016.201); the viewer opens `default`. Research basis:
# config/package3d/RESEARCH_SOTA_EMIB.md (E14, section 7 `emib_5x_12hbm`, A5 G3 basis labels).
variants:
  base:
    id: fig4a_3die
    name: "DB backbone: 3 dies, 2 bridges (Fig. 4(a))"
    note: >-
      Backbone ectc.2016.201-a: Intel EMIB architecture, 3 dies in a row with one bridge under each die-die edge (2
      bridges = figure reading of Fig. 4(a)), bridge 2 x 2 mm (lower bound of the reported range); 65 x 65 mm outline
      of the EMIB CHIPS MCP.
  default: emib_5x_12hbm
  list:
    - id: emib_5x_12hbm
      name: "SOTA-class DB TV: >5X reticle, 6 dies + 12 HBM, 85 x 110 mm"
      note: >-
        Intel EMIB package with more than 5X reticle die area: about 85 x 110 mm, 18 dies including 12 HBM (DB cells,
        reported). Floor plan from the top-down photo (Fig. 7(a)): six HBM in a column along each long side, a 2 x 2
        block of large dies in the middle plus one die above and one below (pixel reads scaled by the 85 x 110 mm
        outline, template). Bridge count, size and placement are not reported: one bridge per die-die edge (20) is a
        modelling assumption; 8 x 8 mm is the upper end of the backbone's 2 x 2 to 8 x 8 mm range.
      source: >-
        ectc51846.2026.00365 p.4 Sec. V and p.5 Fig. 7(a) (DB rows ectc51846.2026.00365-h, -h-c1, -h-c2);
        ectc.2016.201-a-c1 notes (bridge size range); RESEARCH_SOTA_EMIB.md E14
      backbone_tv: ectc51846.2026.00365-h
      summary: >-
        Intel 2.5D without an interposer: thin Si bridges ({m_n} metal levels at {m_line_um}/{m_space_um} um, no TSV)
        in substrate cavities under die edges; {fine_pitch_um} um bumps over them. TV: {die_n} dies incl. {hbm_n} HBM,
        {sbt_w_mm} x {sbt_d_mm} mm.
      drop: [bridge_d2d, bridge_gap, bridge_xs, fine_coarse, buildup_xs]
      callouts_drop: ["Si bridge, no TSV"]
      params:
        # ---- reported (ectc51846.2026.00365-h)
        sbt_w_mm: {ref: ectc51846.2026.00365-h.package_x_mm, note: "package approximately 85 mm x 110 mm (p.4 Sec. V)"}
        sbt_d_mm: {ref: ectc51846.2026.00365-h.package_y_mm, note: "package approximately 85 mm x 110 mm (p.4 Sec. V)"}
        die_n: {ref: ectc51846.2026.00365-h.n_dies}
        hbm_n: {ref: ectc51846.2026.00365-h-c1.count}
        nonhbm_n: {ref: ectc51846.2026.00365-h-c2.count}
        reticle_x: {ref: ectc51846.2026.00365-h.reticle_multiple, note: "die area larger than 5X reticle (lower bound)"}
        # ---- template: floor plan, pixel reads of the Fig. 7(a) photo (600 dpi render of p.5); package outline 754 x
        # 1040 px = 85 x 110 mm (x along the short side)
        t4_cols_n:
          template: 2
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "2 x 2 block of large non-HBM dies in the middle (photo)"
        t4_rows_n: {template: "t4_cols_n", note: "2 x 2 block (photo)"}
        t2_n: {template: "nonhbm_n - t4_cols_n * t4_rows_n", note: "remaining non-HBM dies: one above and one below the 2 x 2 block (photo)"}
        hbm_cols_n:
          template: 2
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "one HBM column along each long (110 mm) side (photo)"
        hbm_rows_n: {template: "hbm_n / hbm_cols_n", note: "six HBM per column (photo)"}
        t4_w_mm:
          template: "sbt_w_mm * 189.5 / 754"
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "2 x 2 block die width not reported; pixel read 189.5 of the 754 px package width"
        t4_d_mm:
          template: "sbt_d_mm * 292.5 / 1040"
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "2 x 2 block die length not reported; pixel read 292.5 of the 1040 px package length"
        t4_px_mm: {template: "sbt_w_mm * 193.5 / 754", source: "ectc51846.2026.00365 p.5 Fig. 7(a)", note: "2 x 2 block column pitch, pixel read 193.5 px"}
        t4_py_mm: {template: "sbt_d_mm * 300.5 / 1040", source: "ectc51846.2026.00365 p.5 Fig. 7(a)", note: "2 x 2 block row pitch, pixel read 300.5 px"}
        t2_w_mm:
          template: "sbt_w_mm * 290 / 754"
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "top / bottom die width not reported; pixel read 290 px"
        t2_d_mm:
          template: "sbt_d_mm * 113.5 / 1040"
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "top / bottom die length not reported; pixel read 113.5 px"
        t2_py_mm:
          template: "sbt_d_mm * 2 * 360.25 / 1040"
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "top / bottom die center distance, pixel read: centers 359.5 / 361 px from the package center"
        d2_w_mm:
          template: "sbt_w_mm * 89 / 754"
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "HBM footprint not reported; pixel read 89 px (mean of 91 / 87 px of the two columns)"
        d2_d_mm:
          template: "sbt_d_mm * 93 / 1040"
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "HBM footprint not reported; pixel read 93 px (mean of the six cells of the right column)"
        hbm_px_mm: {template: "sbt_w_mm * 2 * 242.5 / 754", source: "ectc51846.2026.00365 p.5 Fig. 7(a)", note: "HBM column center distance, pixel read: column centers 244.5 / 240.5 px from the package center"}
        hbm_py_mm: {template: "sbt_d_mm * 104 / 1040", source: "ectc51846.2026.00365 p.5 Fig. 7(a)", note: "HBM pitch along the column, pixel read 104 px"}
        # ---- template: bridges (count, size and placement not reported)
        bridge_w_mm:
          template: 8
          refs: [ectc.2016.201-a-c1.notes]
          note: "bridge size not reported for this package; 8 x 8 mm = upper end of the 2 x 2 to 8 x 8 mm EMIB bridge range (backbone row notes)"
        bridge_d_mm: {template: "bridge_w_mm", note: "square bridge, upper end of the reported range"}
        bridge_n:
          template: "hbm_cols_n * hbm_rows_n + t4_rows_n + t4_cols_n + t4_cols_n * t2_n"
          refs: [ectc51846.2026.00365-h-c3.notes]
          note: "bridge count not reported (row notes); assumption, topology rule: one bridge per die-die edge = 12 HBM-die + 2 vertical and 2 horizontal edges inside the 2 x 2 block + 4 to the top / bottom dies"
        br_hpx_mm:
          template: "sbt_w_mm * 2 * 194.75 / 754"
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "HBM-die bridges centered on the HBM-die gaps (pixel read: gap centers 195.5 / 194 px from the package center); placement assumed"
        br_ty_mm:
          template: "sbt_d_mm * 2 * 300 / 1040"
          source: "ectc51846.2026.00365 p.5 Fig. 7(a)"
          note: "top / bottom die bridges centered on the edge between those dies and the 2 x 2 block (pixel read 300 px from the center); placement assumed"
        br_ix_mm: {template: "br_hpx_mm / 2", note: "inset framing: x of the left HBM-die bridges"}
        br_iy_mm: {template: "hbm_py_mm / 2", note: "inset framing: y of the HBM row just above the package center"}
      parts:
        - id: bridge
          name: "EMIB bridge (Si, no TSV)"
          kind: bridge
          material: silicon
          w_mm: bridge_w_mm
          d_mm: bridge_d_mm
          h_um: bridge_h_um
          in: substrate
          depth_um: bridge_depth_um
          repeat: &emib_grids
            - {nx: hbm_cols_n, ny: hbm_rows_n, pitch_x_mm: br_hpx_mm, pitch_y_mm: hbm_py_mm}
            - {ny: t4_rows_n, pitch_y_mm: t4_py_mm}
            - {nx: t4_cols_n, pitch_x_mm: t4_px_mm}
            - {nx: t4_cols_n, ny: t2_n, pitch_x_mm: t4_px_mm, pitch_y_mm: br_ty_mm}
          explode_group: 1
          note: "placement assumed: one bridge per die-die edge (HBM-die edges, the two inner edges of the 2 x 2 block in each direction, top / bottom die to the block)"
        - id: adhesive
          name: "Bridge adhesive"
          kind: other
          material: other
          material_label: "adhesive (not named)"
          w_mm: bridge_w_mm
          d_mm: bridge_d_mm
          h_um: adh_h_um
          in: substrate
          depth_um: "bridge_depth_um + bridge_h_um"
          repeat: *emib_grids
          explode_group: 1
        - id: die1
          name: "Non-HBM die (2 x 2 block)"
          kind: die
          material: silicon
          w_mm: t4_w_mm
          d_mm: t4_d_mm
          h_um: d1_h_um
          on: substrate
          standoff: fli_coarse
          repeat: {nx: t4_cols_n, ny: t4_rows_n, pitch_x_mm: t4_px_mm, pitch_y_mm: t4_py_mm}
          explode_group: 3
          note: "die type not stated (row -h-c2: non-HBM dies)"
        - id: die2
          name: "HBM"
          kind: hbm
          material: silicon
          w_mm: d2_w_mm
          d_mm: d2_d_mm
          h_um: d2_h_um
          on: substrate
          standoff: fli_coarse
          repeat: {nx: hbm_cols_n, ny: hbm_rows_n, pitch_x_mm: hbm_px_mm, pitch_y_mm: hbm_py_mm}
          explode_group: 3
        - id: die3
          name: "Non-HBM die (above / below the block)"
          kind: die
          material: silicon
          w_mm: t2_w_mm
          d_mm: t2_d_mm
          h_um: d1_h_um
          on: substrate
          standoff: fli_coarse
          repeat: {ny: t2_n, pitch_y_mm: t2_py_mm}
          explode_group: 3
        - id: uf
          name: "Capillary underfill"
          kind: underfill
          material: underfill
          material_label: "epoxy underfill"
          fill: {above: substrate, parts: [die1, die2, die3], margin_mm: uf_margin_mm}
          explode_group: 2
          xray_default: true
      arrays:
        - {id: fine_d3, name: "Fine bumps over the bridge", kind: microbump, per: die3, lower: substrate,
           region: {intersect: [bridge]}, pitch_um: fine_pitch_um, diameter_um: fine_d_um, height_um: bump_h_um, cap_h_um: bump_cap_um}
        - {id: coarse_d3, name: "Coarse bumps", kind: microbump, per: die3, lower: substrate, region: {subtract: [bridge]},
           pitch_um: coarse_pitch_um, diameter_um: coarse_d_um, height_um: bump_h_um, cap_h_um: bump_cap_um}
      routing:
        nets:
          - {id: d2d_ll, kind: lateral, from: fine_d1, to: fine_d1, levels: [br_ms], share: 0.6,
             note: "die-die wires on the bridge signal levels inside the 2 x 2 block (mock-up)"}
          - {id: d2d_t, kind: lateral, from: fine_d3, to: fine_d1, levels: [br_ms], share: 0.6}
          - {id: io3, kind: vertical, from: coarse_d3, to: bga, style: stacked, jog: [bu_sig_1, bu_sig_2, bb_sig_2],
             share: 0.4}
      callouts:
        - {target: bridge, text: "Si bridges, no TSV",
           note: "Si bridges (no TSV) in substrate cavities; drawn 8 x 8 mm, the upper end of the reported {bridge_h_um} um-thin 2 x 2 to 8 x 8 mm range; count (one per die-die edge) and placement are assumptions, not reported for this package",
           refs: [ectc.2016.201-a-c1.notes, ectc51846.2026.00365-h-c3.notes]}
        - {target: die2, text: "{hbm_n} HBM, {die_n} dies in total",
           note: "{die_n} dies including {hbm_n} HBM on an about {sbt_w_mm} x {sbt_d_mm} mm EMIB package; die area larger than {reticle_x}X reticle; floor plan read from the top-down photo",
           refs: [ectc51846.2026.00365-h-c2.count]}
      insets:
        - id: bridge_d2d
          label: "Bridge levels under the HBM-die gap"
          box_mm: ["-br_ix_mm - 0.25", "br_iy_mm - 0.25", "-br_ix_mm + 0.25", "br_iy_mm + 0.25"]
          z: ["bottom:bridge", "bottom:die1"]
          view: front
        - id: bridge_gap
          label: "HBM-die gap over the bridge"
          box_mm: ["-br_ix_mm - bridge_w_mm / 2 - 0.5", "br_iy_mm - 1", "-br_ix_mm + bridge_w_mm / 2 + 0.5", "br_iy_mm + 1"]
          z: ["bottom:adhesive", "top:die1"]
          view: front
        - id: bridge_xs
          label: "Bridge in cavity: adhesive, metal levels, fine vias"
          box_mm: ["-br_ix_mm + bridge_w_mm / 2 - 0.5", "br_iy_mm - 0.4", "-br_ix_mm + bridge_w_mm / 2 + 0.3", "br_iy_mm + 0.4"]
          z: ["bottom:adhesive", "bottom:die1"]
          view: front
        - id: fine_coarse
          label: "Fine / coarse bump transition"
          box_mm: ["-br_ix_mm + bridge_w_mm / 2 - 0.6", "br_iy_mm + bridge_d_mm / 2 - 0.6", "-br_ix_mm + bridge_w_mm / 2 + 0.2",
                   "br_iy_mm + bridge_d_mm / 2 + 0.6"]
          z: ["top:bridge", "top:die1"]
          view: front
        - id: buildup_xs
          label: "Coarse bump to BGA: build-up, PTH"
          box_mm: ["-t4_px_mm / 2 - 1.5", "t4_py_mm / 2 - 0.5", "-t4_px_mm / 2 + 1.5", "t4_py_mm / 2 + 0.5"]
          z: ["bottom:bga", "bottom:die1"]
          view: front
