# FCBGA baseline 3D template. Format: config/package3d/TEMPLATE_FORMAT.md. Generator: scripts/build_package3d.py.
# Backbone: ectc51529.2024.00265-a (100 x 100 mm 8-2-8 FCBGA, 1.4 mm CCL core, 50 x 50 x 0.725 mm Si chip on Cu pillar /
# SnAg bumps at 200 um pitch, capillary underfill, Cu stiffener on silicone adhesive, 1.0 mm-pitch BGA). It is a
# mechanical warpage / board-level-reliability TV: its Table I gives Cu remaining ratios only (L3/5/7/9/10/12/14/16 100%
# or 75%; L2/4/6/8/11/13/15/17 0%), no level thicknesses, L/S or vias.
# Gaps from other TVs of the same family (package_class organic_substrate): the build-up level stack (Cu, dielectric, L/S,
# stacked-via width, core-adjacent Cu) from ONE TV, the 6-N-6 R-G740M RCC substrate estc60143.2024.10712019-b (also
# 200 um bump pitch); core PTH from the 4-2-4 TV ectc51687.2025.00148-a; solder resist thickness from
# ectc51846.2026.00119-b.
# Topology (RESEARCH.md fcbga_organic): monolithic die face down on Cu pillar joints in CUF; solder resist / N build-up
# layers / laminate core with PTH / N build-up / solder resist; stiffener ring on adhesive; BGA. No interposer, no bridge:
# the reference the 2.5D / bridge families are compared against.
# The substrate is three parts (back build-up, core, front build-up) so the PTH spans only the core.
# family_match: the families.yaml rule (package_class organic_substrate), so the generator checks every reported cell
# against the TV's package_class (2026-10-20; before that the regex "^$" could only test for an empty technology_name).
#
# Routing (DevLog-011, 2026-10-20; reference config/package3d/ROUTING_REF_substrate.md archetype A):
# - Levels follow the backbone 8-2-8 numbering: front L1 (C4 pad level) .. L8, core-face Cu L9 / L10 (inside the 1.4 mm
#   CCL), back L11 .. L18 (BGA pad level). Planes on L3/5/7 and L12/14/16 = the Cu-rich levels of the backbone
#   (row -L07 / -L09 feature: "L3/5/7 100% or 75%"), both core faces planes (row -L08 notes: "L9/L10 Cu ratio 100% or
#   75%"). Signal wiring on L2/4/6/8 and L11/13/15/17 is a mock-up choice: in the backbone warpage TV these levels carry
#   0% Cu (rows -L07 / -L09 feature), i.e. the TV has no signal levels at all.
# - Level stack (coordinator decision 2026-10-20 after audit A1 B2, option B): every build-up level = 13 um Cu + 30 um
#   R-G740M RCC dielectric, L/S 25/25 um, stacked microvias of the measured 44-56 um width, all from
#   estc60143.2024.10712019-b, so via, dielectric and L/S come from one physically consistent stack. The 8-2-8 count and
#   1.4 mm core stay reported (backbone). The substrate total is therefore a template sum, 1400 + 2 x (20 + 8 x 43) =
#   2128 um, not the reported 1.8 mm: the reported 1.8 mm total with 8 levels per side leaves 22.5 um per level, i.e.
#   9.5 um insulation under 13 um Cu (the earlier model), which no build-up film in the DB supports. The reported 1.8 mm,
#   Cu ratios and pad / opening sizes are kept in the sbt_core / sr_top / bga callouts.
# - Until 2026-10-20 the microvia was the 60 um BVH of the 4-2-4 TV (ectc51687.2025.00148-a-i2, a 40 um ABF stack) and the
#   dielectric was derived from the 1.8 mm total (9.5 um): replaced as above (audit A1 B2).
# - Via styles: stacked filled laser microvias (ectc51687.2025.00148-f01, estc60143.2024.10712019-f09 "full stacked"),
#   one lateral jog in the fan-out levels near the C4 and one just above the PTH land (ectc51909.2023.00235-f04);
#   mechanically drilled PTH with resin plug and Cu lands on both core faces (estc60143.2024.10712019-f09/-f12).
id: fcbga_organic
name: FCBGA (organic build-up baseline)
company: generic
package_class: organic_substrate
family_match: {families: true}
backbone_tv: ectc51529.2024.00265-a
summary: >-
  Baseline flip chip: one {die_w_mm} x {die_d_mm} mm Si die on {bump_pitch_um} um Cu pillars with capillary underfill,
  on a {sbt_w_mm} mm {sbt_layers} build-up substrate ({core_h_um} um core with PTH); Cu stiffener; {bga_pitch_um} um
  BGA. No interposer or bridge.

params:
  # ---- reported (backbone ectc51529.2024.00265-a unless noted)
  sbt_w_mm: {ref: ectc51529.2024.00265-a-c2.x_mm}
  sbt_d_mm: {ref: ectc51529.2024.00265-a-c2.y_mm}
  sbt_rep_h_um: {ref: ectc51529.2024.00265-a-c2.thickness_um, note: "reported total substrate thickness of the warpage TV (1.8 mm incl. the 1.4 mm CCL core); not drawn (see sbt_h_um), kept in the sbt_core callout"}
  sbt_layers: {ref: ectc51529.2024.00265-a.substrate_layer_count}
  core_h_um: {ref: ectc51529.2024.00265-a-L08.thickness_um, note: "1.4 mm CCL core; row name 'CCL core (A), L9/L10' (core-face Cu L9/L10 drawn inside it)"}
  bu_inner_n: {ref: ectc51529.2024.00265-a-L07.repeat, note: "L2-L8 build-up layers on the front side"}
  die_w_mm: {ref: ectc51529.2024.00265-a-c1.x_mm}
  die_d_mm: {ref: ectc51529.2024.00265-a-c1.y_mm}
  die_h_um: {ref: ectc51529.2024.00265-a-c1.thickness_um, note: "chip thickness excluding bumps"}
  bump_pitch_um: {ref: ectc51529.2024.00265-a-i1.pitch_um}
  bump_d_um: {ref: ectc51529.2024.00265-a-i1.diameter_um}
  bump_cu_um: {ref: ectc51529.2024.00265-a-i1.height_um}
  bump_cap_um: {ref: ectc51529.2024.00265-a-i1.cap_height_um}
  bga_pitch_um: {ref: ectc51529.2024.00265-a-i2.pitch_um}
  bga_d_um: {ref: ectc51529.2024.00265-a-i2.diameter_um}
  stiff_h_um: {ref: ectc51529.2024.00265-a-c3.thickness_um}
  stiff_mat: {ref: ectc51529.2024.00265-a-c3.material}
  adh_h_um: {ref: ectc51529.2024.00265-a-c4.thickness_um, note: "silicone adhesive with 150 um glass-bead spacers (BLR build)"}
  sr_h_um:
    ref: ectc51846.2026.00119-b-L01.thickness_um
    note: "dry-film package solder resist of a substrate coupon in the same family; backbone SR thickness not given"
  bu_line_um: {ref: estc60143.2024.10712019-b-L03.line_um, note: "min track of the build-up Cu L1-L6 of the 6-N-6 TV that supplies the whole level stack (backbone gives none); applied to every signal level"}
  bu_space_um: {ref: estc60143.2024.10712019-b-L03.space_um, note: "min gap of the build-up Cu L1-L6 of the same 6-N-6 TV (backbone gives none); applied to every signal level"}
  cu_h_um: {ref: estc60143.2024.10712019-b-L03.thickness_um, note: "build-up Cu thickness of the 6-N-6 TV that supplies the level stack (backbone gives none)"}
  bu_d_h_um:
    ref: estc60143.2024.10712019-b-L04.thickness_um
    note: "build-up dielectric between Cu levels = 30 um R-G740M RCC of the same 6-N-6 TV (no glass cloth); backbone gives none"

  core_cu_h_um:
    ref: estc60143.2024.10712019-b-L05.thickness_um
    note: "core-adjacent Cu level (L7) of the 6-N-6 FCBGA TV; backbone L9/L10 thickness not given"
  bvh_424_um: {ref: ectc51687.2025.00148-a-i2.diameter_um, note: "60 um BVH of the 4-2-4 TV (40 um ABF stack); drawn until 2026-10-20, now a callout only (different level stack)"}
  pth_pitch_um: {ref: ectc51687.2025.00148-a-i4.pitch_um, note: "core through hole of the 4-2-4 FCBGA TV (1.2 mm core)"}
  pth_d_um: {ref: ectc51687.2025.00148-a-i4.diameter_um, note: "core through hole of the 4-2-4 FCBGA TV (1.2 mm core)"}
  # ---- derived
  bu_n: {derived: "bu_inner_n + 1", note: "front build-up metal layers = L1 flip-chip pad layer (row L06) + L2-L8 (row L07); 8-2-8"}
  bu_layer_h_um: {derived: "cu_h_um + bu_d_h_um", note: "one build-up level = Cu + RCC dielectric of the 6-N-6 TV"}
  bu_pair_n: {derived: "(bu_inner_n - 1) / 2", note: "signal + plane pairs between L1 and L8 (L2/L3, L4/L5, L6/L7)"}
  core_lam_h_um: {derived: "core_h_um - 2 * core_cu_h_um", note: "laminate between the core-face Cu levels L9 / L10"}
  bump_h_um: {derived: "bump_cu_um + bump_cap_um", note: "joint standoff = Cu pillar + SnAg cap"}
  # ---- template
  bu_h_um:
    template: "sr_h_um + bu_n * bu_layer_h_um"
    note: "build-up per side = SR + 8 x (13 um Cu + 30 um RCC); reported cells from two TVs (count: backbone, level: 6-N-6 TV), so the sum is not a reported total of any TV"
  sbt_h_um:
    template: "core_h_um + 2 * bu_h_um"
    note: "drawn substrate = 1.4 mm core + 2 build-up sides (2128 um); the backbone reports 1.8 mm total (sbt_rep_h_um), which cannot hold 8 levels per side of any build-up film in the DB (audit A1 B2)"
  stiff_w_mm:
    template: 16
    refs: [ectc51529.2024.00265-a-c3.name]
    note: "stiffener width 16 mm (BLR build) is given in the component name, not in a numeric column"
  uf_margin_mm:
    template: 1.5
    refs: [ectc51529.2024.00265-a-c5.notes]
    note: "CUF fillet not measured; 1.5 mm = the fillet width the paper assumes when sizing the stiffener"
  bga_h_um:
    template: 478
    refs: [ectc51909.2023.00155-a-i4.notes]
    note: "BGA height not reported in the family; measured height of the same 1.0 mm-pitch / 600 um SAC305 ball in a 2.5D TV (analog row notes)"
  # ---- template: routing (DevLog-011)
  mvia_d_um:
    template: "(44.18 + 53.46 + 48.38 + 53.9 + 56.33 + 48.6) / 6"
    refs: [estc60143.2024.10712019-b-m5.value_text, estc60143.2024.10712019-b-i2.notes]
    note: "microvia top diameter not a numeric cell; mean of the six measured stacked-microvia widths per level (44.18-56.33 um, Fig. 14 micro-section, metric text) of the 6-N-6 TV that supplies the level stack"
  mvia_land_um:
    template: "mvia_d_um * r0 / r1"
    refs: [001c.147203-a-i1.pad_x_um, 001c.147203-a-i1.diameter_um]
    note: "microvia capture / target land not reported for a cored FCBGA; harmonized organic microvia rule land / via = 110 / 70 (pad >= 110 um for a 70 um Cu-filled stacked via: minimum design rule of an in-family coreless 150 GHz AiP antenna substrate, R-G640)"
  mv_wall_tan:
    template: 3.078
    refs: [ectc51687.2025.00076-b-i1.notes]
    note: "harmonized microvia taper rule (TEMPLATE_FORMAT.md 'Template rules'): bottom = top - 2 x drawn dielectric depth / tan(sidewall angle); sidewall 72 deg, stated for a 30 um-deep laser via in ABF (analog row notes ectc51687.2025.00076-b-i1: top radius 67 um, bottom ~58 um after 72 deg taper); tan(72 deg) = 3.078"
  mvia_bot_d_um:
    template: "mvia_d_um - 2 * bu_d_h_um / mv_wall_tan"
    note: "via bottom not reported; harmonized taper rule over the drawn bu_d_h_um depth (mv_wall_tan)"
  pth_land_um:
    template: "pth_d_um * 1.5"
    refs: [ectc51687.2025.00148-a-i4.pitch_um]
    note: "PTH land not reported; harmonized rule 1.5 x the hole, read from the 4-2-4 FCBGA schematic (fig ectc51687.2025.00148-f01, scaled by the 500 um TH pitch)"
  pth_wall_um:
    template: "(r0 + r1 + r2 + r3) / 4"
    refs: [eptc62800.2024.10909809-a-m17.value, eptc62800.2024.10909809-a-m18.value, eptc62800.2024.10909809-a-m19.value, eptc62800.2024.10909809-a-m20.value]
    note: "PTH plating not reported for a cored HPC substrate; harmonized rule = mean of the minimum barrel Cu of legs 1-4 of a thin-core through hole (11-18.5 um, mean 14.875 um)"
  pad_fill:
    template: "0.7854 * 150 ** 2 / bump_pitch_um ** 2"
    refs: [ectc51529.2024.00265-a-i1.notes]
    note: "L1 Cu area fraction = one 150 um SMD pad (row notes) per 200 um bump cell"
  bga_pad_fill:
    template: "0.7854 * 700 ** 2 / bga_pitch_um ** 2"
    refs: [ectc51529.2024.00265-a-i2.notes]
    note: "L18 Cu area fraction = one 700 um SMD BGA pad (row notes) per 1.0 mm ball cell"
  plane_fill:
    template: 0.75
    refs: [ectc51529.2024.00265-a-L07.feature, ectc51529.2024.00265-a-L07.notes]
    note: "Cu-rich levels of the backbone are 100% (foil) or 75% (patterned); the patterned value is drawn"

parts:
  - {id: sbt_bu_bot, name: "Back build-up + SR", kind: substrate, material: organic_build_up,
     material_label: "build-up film / Cu, solder resist", w_mm: sbt_w_mm, d_mm: sbt_d_mm, h_um: bu_h_um, base: true,
     explode_group: 0}
  - {id: sbt_core, name: "CCL core (PTH)", kind: substrate, material: organic_laminate,
     material_label: "GFRP CCL: resin with E-glass cloth", w_mm: sbt_w_mm, d_mm: sbt_d_mm, h_um: core_h_um, on: sbt_bu_bot,
     explode_group: 0}
  - {id: sbt_bu_top, name: "Front build-up + SR", kind: substrate, material: organic_build_up,
     material_label: "build-up film / Cu, solder resist", w_mm: sbt_w_mm, d_mm: sbt_d_mm, h_um: bu_h_um, on: sbt_core,
     explode_group: 0}
  - {id: die, name: "Si die (flip chip)", kind: die, material: silicon, w_mm: die_w_mm, d_mm: die_d_mm, h_um: die_h_um,
     on: sbt_bu_top, standoff: bump, explode_group: 2, note: "simple bumped Si chip (no interposer module) in the backbone TV"}
  - id: uf
    name: "Capillary underfill (CUF)"
    kind: underfill
    material: underfill
    fill: {above: sbt_bu_top, parts: [die], margin_mm: uf_margin_mm}
    explode_group: 1
    xray_default: true
  - {id: adhesive, name: "Stiffener adhesive", kind: other, material: other,
     material_label: "silicone adhesive with glass beads", w_mm: sbt_w_mm, d_mm: sbt_d_mm, h_um: adh_h_um, shape: frame,
     frame_w_mm: stiff_w_mm, on: sbt_bu_top, explode_group: 1}
  - {id: stiffener, name: "Cu stiffener", kind: stiffener, material: copper, material_label: "copper", w_mm: sbt_w_mm,
     d_mm: sbt_d_mm, h_um: stiff_h_um, shape: frame, frame_w_mm: stiff_w_mm, on: adhesive, explode_group: 2,
     note: "outer edge assumed flush with the substrate edge (position not reported)"}

layers:
  # ---- front build-up, top down: SR, L1 pad, (L2 signal, L3 plane) x3 .. L7, L8 signal, dielectric onto the core
  - part: sbt_bu_top
    pattern:
      - {id: sr_top, name: "Solder resist (L1 side)", material: polymer_dielectric, material_label: "dry-film solder resist",
         role: passivation, h_um: sr_h_um}
      - {id: fc_pad, name: "L1 C4 pad Cu", material: copper, material_label: "Cu pads, Ni/Au + SAC pre-solder",
         role: conductor, h_um: cu_h_um, route: {use: pad, matrix: organic_build_up, fill: pad_fill}}
      - {id: fc_d1, name: "Build-up dielectric L1-L2", material: organic_build_up, material_label: "build-up film",
         role: dielectric, h_um: bu_d_h_um, via_um: mvia_d_um}
  - part: sbt_bu_top
    repeat: bu_pair_n
    pattern:
      - {id: fc_sig, name: "Front signal Cu (L2/L4/L6)", material: copper, material_label: "SAP Cu wiring",
         role: conductor, h_um: cu_h_um, line_um: bu_line_um, space_um: bu_space_um,
         route: {use: signal, dir: alt, line_um: bu_line_um, space_um: bu_space_um, matrix: organic_build_up}}
      - {id: fc_sd, name: "Build-up dielectric", material: organic_build_up, material_label: "build-up film",
         role: dielectric, h_um: bu_d_h_um, via_um: mvia_d_um}
      - {id: fc_pl, name: "Front GND/PWR plane Cu (L3/L5/L7)", material: copper, material_label: "Cu plane, 75% patterned",
         role: conductor, h_um: cu_h_um,
         route: {use: plane, space_um: bu_space_um, matrix: organic_build_up, fill: plane_fill}}
      - {id: fc_pd, name: "Build-up dielectric", material: organic_build_up, material_label: "build-up film",
         role: dielectric, h_um: bu_d_h_um, via_um: mvia_d_um}
  - part: sbt_bu_top
    pattern:
      - {id: fc_l8, name: "L8 signal Cu", material: copper, material_label: "SAP Cu wiring", role: conductor,
         h_um: cu_h_um, line_um: bu_line_um, space_um: bu_space_um,
         route: {use: signal, dir: x, line_um: bu_line_um, space_um: bu_space_um, matrix: organic_build_up}}
      - {id: fc_d8, name: "Build-up dielectric L8-L9", material: organic_build_up, material_label: "build-up film",
         role: dielectric, h_um: bu_d_h_um, via_um: mvia_d_um}
  # ---- core: L9 Cu, laminate with PTH, L10 Cu
  - id: core_stack
    part: sbt_core
    pattern:
      - {id: core_cu_top, name: "L9 core Cu (plane, PTH lands)", material: copper, material_label: "Cu foil + plating",
         role: conductor, h_um: core_cu_h_um, route: {use: plane, space_um: bu_space_um, matrix: organic_laminate, fill: plane_fill}}
      - {id: core_lam, name: "CCL laminate", material: organic_laminate, material_label: "GFRP: resin with E-glass cloth",
         role: core, h_um: core_lam_h_um}
      - {id: core_cu_bot, name: "L10 core Cu (plane, PTH lands)", material: copper, material_label: "Cu foil + plating",
         role: conductor, h_um: core_cu_h_um, route: {use: plane, space_um: bu_space_um, matrix: organic_laminate, fill: plane_fill}}
  # ---- back build-up, top down: dielectric off the core, L11 signal, (L12 plane, L13 signal) x3 .. L17, L18 BGA pad, SR
  - part: sbt_bu_bot
    pattern:
      - {id: bk_d1, name: "Build-up dielectric L10-L11", material: organic_build_up, material_label: "build-up film",
         role: dielectric, h_um: bu_d_h_um, via_um: mvia_d_um}
      - {id: bk_l11, name: "L11 signal Cu", material: copper, material_label: "SAP Cu wiring", role: conductor,
         h_um: cu_h_um, line_um: bu_line_um, space_um: bu_space_um,
         route: {use: signal, dir: x, line_um: bu_line_um, space_um: bu_space_um, matrix: organic_build_up}}
  - part: sbt_bu_bot
    repeat: bu_pair_n
    pattern:
      - {id: bk_pd, name: "Build-up dielectric", material: organic_build_up, material_label: "build-up film",
         role: dielectric, h_um: bu_d_h_um, via_um: mvia_d_um}
      - {id: bk_pl, name: "Back GND/PWR plane Cu (L12/L14/L16)", material: copper, material_label: "Cu plane, 75% patterned",
         role: conductor, h_um: cu_h_um,
         route: {use: plane, space_um: bu_space_um, matrix: organic_build_up, fill: plane_fill}}
      - {id: bk_sd, name: "Build-up dielectric", material: organic_build_up, material_label: "build-up film",
         role: dielectric, h_um: bu_d_h_um, via_um: mvia_d_um}
      - {id: bk_sig, name: "Back signal Cu (L13/L15/L17)", material: copper, material_label: "SAP Cu wiring",
         role: conductor, h_um: cu_h_um, line_um: bu_line_um, space_um: bu_space_um,
         route: {use: signal, dir: alt, line_um: bu_line_um, space_um: bu_space_um, matrix: organic_build_up}}
  - part: sbt_bu_bot
    pattern:
      - {id: bk_d18, name: "Build-up dielectric L17-L18", material: organic_build_up, material_label: "build-up film",
         role: dielectric, h_um: bu_d_h_um, via_um: mvia_d_um}
      - {id: bk_pad, name: "L18 BGA pad Cu", material: copper, material_label: "Cu pads, electroless Ni/Au",
         role: conductor, h_um: cu_h_um, route: {use: pad, matrix: organic_build_up, fill: bga_pad_fill}}
      - {id: sr_bot, name: "Solder resist (BGA side)", material: polymer_dielectric,
         material_label: "dry-film solder resist", role: passivation, h_um: sr_h_um}

arrays:
  - {id: bump, name: "Cu pillar + SnAg bumps", kind: cu_pillar, upper: die, lower: sbt_bu_top, region: {part: die},
     pitch_um: bump_pitch_um, diameter_um: bump_d_um, height_um: bump_h_um, cap_h_um: bump_cap_um,
     note: "full-area array at the reported pitch; the bump map is not reported"}
  - {id: bga, name: "BGA balls", kind: bga, under: sbt_bu_bot, region: {part: sbt_bu_bot}, pitch_um: bga_pitch_um,
     diameter_um: bga_d_um, height_um: bga_h_um, note: "full grid drawn; the TV depopulates every two rows/columns"}

routing:
  layout_note: >-
    mock-up routing: which bumps / balls belong to which net, the net shares, jog levels and escape length are
    illustrative (no substrate design is published); level order, Cu / dielectric thickness, L/S, via, land and PTH
    dims carry their own provenance
  vias:
    # front microvias: laser drilled from the top, filled, wide end up
    - {id: mv_f1, name: "Microvia L1-L2", kind: microvia, through: fc_d1, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_fs, name: "Microvia signal-plane", kind: microvia, through: fc_sd, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_fp, name: "Microvia plane-signal", kind: microvia, through: fc_pd, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_f8, name: "Microvia L8-L9", kind: microvia, through: fc_d8, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_d_um, land_um: mvia_land_um, fill: filled}
    # core PTH: drilled, plated wall, resin plug, lands on L9 / L10
    - {id: pth, name: "Core PTH (plated, resin plugged)", kind: pth, through: core_lam, diameter_um: pth_d_um,
       land_um: pth_land_um, pitch_um: pth_pitch_um, fill: plugged, plug: resin, wall_um: pth_wall_um,
       note: "mechanically drilled, Cu wall, resin plug + Cu lands as in estc60143.2024.10712019-f09/-f12 (fig; plug material not reported). AR 1364 / 200 = 6.8, above the 3.7-6.5 of the three cored TVs with both numbers (n = 3); a drilled 200 um hole through a 1.4 mm core is plausible, the hole size comes from a 1.2 mm-core TV"}
    # back microvias: laser drilled from the BGA side, filled, wide end down
    - {id: mv_b1, name: "Microvia L10-L11", kind: microvia, through: bk_d1, diameter_um: mvia_bot_d_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_bp, name: "Microvia signal-plane", kind: microvia, through: bk_pd, diameter_um: mvia_bot_d_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_bs, name: "Microvia plane-signal", kind: microvia, through: bk_sd, diameter_um: mvia_bot_d_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_b18, name: "Microvia L17-L18", kind: microvia, through: bk_d18, diameter_um: mvia_bot_d_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
  nets:
    - {id: io, kind: vertical, from: bump, to: bga, style: stacked, jog: [fc_sig_1, fc_l8, bk_l11, bk_sig_3], share: 0.1,
       note: "signal: stacked vias under the C4, fan-out jog on L2, jog onto the PTH land on L8; mirrored jogs on L11 / L17 to the BGA pad (ectc51909.2023.00235-f04)"}
    - {id: pwr, kind: vertical, from: bump, to: bga, style: stacked, jog: [fc_l8, bk_l11], share: 0.06,
       note: "power: full-stacked column under the C4, one jog onto the PTH land each side (estc60143.2024.10712019-f09/-f12); io + pwr = 0.16 ~ BGA / bump count (100 x 100 balls / 250 x 250 bumps)"}
    - {id: gnd_c4, kind: plane_tie, from: bump, plane: fc_pl_1, share: 0.4, note: "C4 GND bumps tied to the L3 plane"}
    - {id: gnd_bga, kind: plane_tie, from: bga, plane: bk_pl_3, share: 0.3, note: "BGA GND balls tied to the L16 plane"}
    - {id: esc, kind: escape, from: bump, levels: [fc_sig_1], share: 0.2, length_um: 600,
       note: "local escape wiring on L2 under the die"}

callouts:
  - {target: sbt_core, text: "{sbt_layers} substrate, {core_h_um} um core",
     note: "Backbone warpage TV: {sbt_layers} substrate, {sbt_rep_h_um} um total with a {core_h_um} um CCL core; Cu ratio L3/5/7, L9/L10, L12/14/16 100% or 75%, L2/4/6/8 and L11/13/15/17 0%. Drawn thicker: per-level Cu / dielectric of a 6-N-6 TV (see build-up callout)",
     refs: [ectc51529.2024.00265-a-L07.feature, ectc51529.2024.00265-a-L09.feature, ectc51529.2024.00265-a-L08.notes]}
  - {target: sbt_bu_top, text: "Drawn stack exceeds reported {sbt_rep_h_um} um",
     note: "the drawn substrate is the template sum of a coherent per-level stack (8 levels per side of {cu_h_um} um Cu + {bu_d_h_um} um RCC, 6-N-6 TV, plus the {core_h_um} um core), thicker than the {sbt_rep_h_um} um total of the 8-2-8 warpage TV; that total leaves 22.5 um per level, which no build-up film in the DB supports (audit A1 B2)"}
  - {target: fc_sig, text: "Build-up L/S {bu_line_um}/{bu_space_um} um",
     note: "8 Cu levels per side ({cu_h_um} um Cu + {bu_d_h_um} um RCC = {bu_layer_h_um} um per level, 6-N-6 TV estc60143.2024.10712019-b); signal on L2/4/6/8 (mock-up; 0% Cu in the warpage backbone), planes on L3/5/7"}
  - {target: mv_fs, text: "Stacked microvias, 6-N-6 stack",
     note: "filled laser blind vias stacked under the C4 and over the PTH lands; top diameter = mean of the measured 44.18-56.33 um stacked-via widths of the 6-N-6 TV ({bvh_424_um} um BVH in the 40 um ABF of the 4-2-4 TV)",
     refs: [estc60143.2024.10712019-b-m5.value_text]}
  - {target: fc_pl, text: "GND/PWR planes, 75% Cu", refs: [ectc51529.2024.00265-a-L07.feature]}
  - {target: sr_top, text: "Solder resist {sr_h_um} um",
     note: "Backbone: SMD flip-chip pads 150 um, SR opening 130 um (top); SMD BGA pads 700 um, SR opening 500 um (bottom)",
     refs: [ectc51529.2024.00265-a-L05.feature, ectc51529.2024.00265-a-L06.feature, ectc51529.2024.00265-a-L10.feature, ectc51529.2024.00265-a-L11.feature]}
  - {target: pth, text: "PTH {pth_d_um} um, {pth_pitch_um} um pitch",
     note: "core through hole {pth_d_um} um at {pth_pitch_um} um pitch (4-2-4 TV) through the {core_h_um} um core; plated wall, resin plug and lands are template"}
  - {target: bump, text: "Cu pillar {bump_pitch_um} um pitch"}
  - {target: uf, text: "Capillary underfill (CUF)", refs: [ectc51529.2024.00265-a-c5.name]}
  - {target: stiffener, text: "Cu stiffener {stiff_h_um} um thick"}
  - {target: bga, text: "BGA {bga_pitch_um} um pitch"}

insets:
  - id: die_edge
    label: "Die edge, bumps, CUF fillet"
    box_mm: ["die_w_mm / 2 - 0.6", -0.5, "die_w_mm / 2 + 2", 0.5]
    z: ["bottom:sbt_bu_top", "top:die"]
    view: front
  - id: sbt_xs
    label: "Substrate cross-section"
    box_mm: [-0.75, -0.75, 0.75, 0.75]
    z: ["bottom:sbt_bu_bot", "top:die"]
    view: front
  - id: c4_bga
    label: "C4 to BGA: vias, PTH, planes"
    box_mm: [-1.0, -0.25, 1.0, 0.25]
    z: ["bottom:bga", "top:bump"]
    view: front
  - id: stiff_edge
    label: "Stiffener on adhesive"
    box_mm: ["sbt_w_mm / 2 - stiff_w_mm - 1", -1, "sbt_w_mm / 2", 1]
    z: ["bottom:sbt_bu_bot", "top:stiffener"]
    view: front
