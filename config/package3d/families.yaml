# Packaging families for the 3D package viewer (DevLog-008).
# Generated 2026-10-19 by the research agent from data/*.csv (239 papers) + cited public sources; hand-curated fields:
#   name, company, include, priority, include_reason, summary, sources, representative_tvs pin order.
# Counts: db_papers = distinct papers with a matching TV (physical or simulation); db_physical_tvs excludes
#   tv_kind=simulation_model. Matching uses technology_name aliases (TV column), package_class, or a paper list
#   (see RESEARCH.md "Matching rules").
# representative_tvs: ranked by a geometric-completeness score (outline 2, package thickness 1, die x/y and die
#   thickness up to 3 each, other component thickness 0.5 each up to 3, layer thickness 0.4 each up to 10,
#   interconnect pitch 1 each up to 4, interconnect diameter+height 0.75 each up to 4, distinct interconnect
#   levels 0.5 each up to 4); a few families pin topology-relevant TVs first (RESEARCH.md says which).
#   has = per-TV counts: outline (0/1), die_xy / die_t = die-type components with x+y / thickness,
#   other_t = non-die components with thickness, layer_t = stack_layers rows with thickness,
#   ic_pitch / ic_d+h = interconnect rows with pitch / diameter+height, ic_levels = distinct levels.
# sources: "db:<paper_id> <locator> - <claim>" points at references/<paper_id>/text.md;
#   "url:<url> - <claim> (primary|secondary)" is a public web source checked 2026-10-19.
# match_rule keys: tn = case-insensitive regex on test_vehicles.technology_name; cls_only = any TV of these
#   package_class; papers = any TV of these paper_ids (restricted by cls if given); ic_level = TV has an
#   interconnect row at this level; excl = regex on technology_name + paper title that removes a TV;
#   excl_papers = paper_ids removed (assigned to a more specific family).
# priority: 1 = first template wave, 2 = second, 3 = later; null = not illustrated (include: false).
# The 3D generator uses these rules unchanged (template `family_match: {families: true}`; scripts/build_package3d.py
#   Matcher): tn and excl are case-insensitive there too; a template may add `tvs` / `excl_tvs` lists (2026-10-20).
# shared_with: TVs deliberately counted in this family and another one (overlaps are intended, with the reason).
# Counts and paper lists recomputed 2026-10-20 from data/*.csv (uncommitted revision-pass changes included; they can
#   drift again after that merge).
