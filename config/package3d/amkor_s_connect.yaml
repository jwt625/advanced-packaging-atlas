# S-Connect 3D template. Format: config/package3d/TEMPLATE_FORMAT.md. Generator: scripts/build_package3d.py.
# Backbone: ectc51909.2023.00175-a (mTV1, chip-last S-Connect 1x-reticle module: 1 dummy ASIC 23 x 24 mm + 2 dummy HBM2
# 8 x 12 mm on a 32.8 x 25.6 mm module with 2 connect dies 7 x 6 mm, ~70 um thick, ~5 um Cu studs; tall Cu pillars 260 um
# pitch / 135 um high in the 1st mold; 50 / 55 um micro-bumps; plated C4; 67 x 67 mm HDBU substrate). Top-die thickness
# from the warpage DOE of the same paper (ectc51909.2023.00175-c); the 3x-reticle mTV2 (-b) appears in callouts only.
# Topology (ectc51909.2023.00175 Sec. II.A-B, Fig. 1-2, Fig. 6): connect die and IPD with Cu studs face-up bonded on a
# carrier with tall Cu pillars; 1st mold ground to the stud and pillar tops; top RDL with solder capture pads; dies
# micro-bumped, capillary underfill, 2nd mold ground to the die tops; bottom RDL and plated C4; flip chip to the
# substrate. Layout per Fig. 6(a) / Table 1: ASIC beside a column of the two HBM, one connect die under each HBM-ASIC
# edge. The tall pillar (135 um) exceeds connect die + stud (~75 um), so the die bottom sits ~60 um above the 1st-mold
# bottom; what fills that gap is not described.
# Mock-up routing (DevLog-011, 2026-10-20): ubump -> top RDL (capture pads, stacked vias) -> Cu stud on the connect die
# (ASIC-HBM wires in its BEOL) or tall Cu pillar -> bottom RDL -> plated C4 -> HDBU substrate (module stack, analog
# 2.5D-TV 4/2/4 substrate) -> BGA. Sections: ectc51909.2023.00175-f01 (SEM: pillars, studs, ubumps), -f03 (schematic: 2-level top
# RDL over the connect-die BEOL, bottom RDL, C4).
#
# Uses the bridge_in_mold module of cowos_l.yaml: `drop` removes the module's bridge TSV class and its params (mTV1 has
# no connect-die TSV), `rename` gives the module parts, layers and via classes S-Connect names (ids kept), the connect
# die (`lsi`) is overridden because it sits off-center, and its layers are restated (BEOL dielectric not stated) with
# the module layer ids.
id: amkor_s_connect
name: S-Connect
company: Amkor
package_class: si_bridge_fanout
family_match: {families: true}
backbone_tv: ectc51909.2023.00175-a
summary: >-
  Amkor chip-last module: {lsi_n} Si connect dies face up with Cu studs among {ri_core_h_um} um tall Cu pillars in a 1st
  mold, RDL on both sides; ASIC + HBM on {ubump_pitch_um} um micro-bumps in a 2nd mold; C4 to substrate.

use:
  - module: bridge_in_mold
    from: cowos_l.yaml
    drop: [lsi_tsv, lsi_tsv_pitch_um, lsi_tsv_d_um, lsi_tsv_land_um, lsi_tsv_liner_um]
    rename:
      ri_back: {name: "Bottom-side RDL (C4)", material_label: "Cu RDL / dielectric (not given)"}
      ri_core: {name: "1st mold (connect die, IPD, pillars)", material_label: "EMC (1st mold)"}
      ri_front: {name: "Top-side RDL (capture pads)", material_label: "Cu RDL / dielectric (not given)"}
      tiv:
        name: "Tall Cu pillars"
        note: "pillar placement not reported; grid over the module outside the connect dies (IPDs not drawn)"
      lsi_via: {name: "Connect-die Cu studs"}
      rv_f: {name: "Top RDL via"}
      rv_b: {name: "Bottom RDL via"}
      ri_f_pass: {name: "Top RDL passivation", material_label: "dielectric (not given)"}
      ri_f_cu: {name: "Top RDL Cu"}
      ri_f_diel: {name: "Top RDL dielectric", material_label: "dielectric (not given)"}
      ri_b_diel: {name: "Bottom RDL dielectric", material_label: "dielectric (not given)"}
      ri_b_cu: {name: "Bottom RDL Cu"}
      ri_b_pass: {name: "Bottom RDL passivation", material_label: "dielectric (not given)"}

params:
  # ---- reported (backbone ectc51909.2023.00175-a unless noted)
  sbt_w_mm: {ref: ectc51909.2023.00175-a-c8.x_mm}
  sbt_d_mm: {ref: ectc51909.2023.00175-a-c8.y_mm}
  ri_w_mm: {ref: ectc51909.2023.00175-a.interposer_x_mm, note: "S-Connect module size (abstract; Table 1 rounds to 33 x 26 mm)"}
  ri_d_mm: {ref: ectc51909.2023.00175-a.interposer_y_mm, note: "S-Connect module size (abstract; Table 1 rounds to 33 x 26 mm)"}
  asic_w_mm: {ref: ectc51909.2023.00175-a-c1.x_mm}
  asic_d_mm: {ref: ectc51909.2023.00175-a-c1.y_mm}
  hbm_n: {ref: ectc51909.2023.00175-a-c2.count}
  hbm_w_mm: {ref: ectc51909.2023.00175-a-c2.x_mm}
  hbm_d_mm: {ref: ectc51909.2023.00175-a-c2.y_mm}
  lsi_n: {ref: ectc51909.2023.00175-a-c3.count}
  lsi_w_mm: {ref: ectc51909.2023.00175-a-c3.x_mm}
  lsi_d_mm: {ref: ectc51909.2023.00175-a-c3.y_mm}
  lsi_h_um: {ref: ectc51909.2023.00175-a-c3.thickness_um, note: "'height of connect die is about 70 um' (approx)"}
  lsi_via_h_um: {ref: ectc51909.2023.00175-a-i3.height_um, note: "Cu stud on the connect die, ~5 um (approx)"}
  tiv_pitch_um: {ref: ectc51909.2023.00175-a-i4.pitch_um}
  ri_core_h_um:
    ref: ectc51909.2023.00175-a-i4.height_um
    note: "1st mold thickness = tall Cu pillar height: the mold is ground to expose the pillars and studs (flow s03)"
  ubump_pitch_um: {ref: ectc51909.2023.00175-a-i1.pitch_um, note: "ASIC micro-bump pitch"}
  hbm_ubump_pitch_um: {ref: ectc51909.2023.00175-a-i2.pitch_um}
  m2_w_mm: {ref: ectc51909.2023.00175-b.interposer_x_mm}
  m2_d_mm: {ref: ectc51909.2023.00175-b.interposer_y_mm}
  # ---- derived
  lsi_gap_um:
    derived: "ri_core_h_um - lsi_h_um - lsi_via_h_um"
    note: "space under the connect die = tall pillar - die - stud (studs and pillars end at the ground mold surface)"
  # ---- template: layout (positions are not dimensioned)
  die_gap_um:
    analog: tcpmt.2023.3312037-a-c2.gap_um
    note: "die-to-die gap not reported for S-Connect; analog = Intel Co-EMIB DtD spacing ('as small as 100 um')"
  asic_x_mm:
    template: "-(asic_w_mm + die_gap_um / 1000 + hbm_w_mm) / 2 + asic_w_mm / 2"
    note: "ASIC beside the HBM column (Fig. 6(a), Table 1); die block centered on the module"
  hbm_x_mm:
    template: "(asic_w_mm + die_gap_um / 1000 + hbm_w_mm) / 2 - hbm_w_mm / 2"
    note: "HBM column on the other side of the D2D gap; die block centered on the module"
  hbm_py_mm: {template: "hbm_d_mm + die_gap_um / 1000", note: "the two HBM stacked along the ASIC edge at the D2D gap"}
  lsi_x_mm:
    template: "asic_x_mm + asic_w_mm / 2 + die_gap_um / 2000"
    note: "connect die centered under the HBM-ASIC gap (placement not dimensioned)"
  lsi_rows_n: {template: "lsi_n", note: "one connect die per HBM (2 dies, 2 HBM; placement not dimensioned)"}
  # ---- template: thicknesses and joints
  asic_h_um:
    template: "r0"
    refs: [ectc51909.2023.00175-c-L01.thickness_max_um]
    note: "built die thickness not stated; 650 um = thickest leg of the paper's 450-650 um top-die warpage DOE (lowest warpage)"
  hbm_h_um:
    template: "asic_h_um"
    refs: [ectc51909.2023.00175-F1-s10.step]
    note: "HBM height not stated; the 2nd mold is ground to expose the die tops (flow s09), so dies are coplanar"
  ubump_d_um:
    analog: ectc51906.2022.00180-a-i3.diameter_um
    note: "micro-bump diameter not reported for S-Connect; analog = 55 um-pitch Cu/SnAg micro-bump of a glass 2.5D package"
  ubump_cap_um:
    analog: ectc51906.2022.00180-a-i3.cap_height_um
    note: "solder cap height not reported; cap of the same analog joint as the standoff (R2 2026-10-20: joint drawn as Cu column + solder cap)"
  ubump_h_um:
    template: "r0 + r1"
    refs: [ectc51906.2022.00180-a-i3.height_um, ectc51906.2022.00180-a-i3.cap_height_um]
    note: "joint standoff = Cu + SnAg cap of the 55 um-pitch analog bump"
  mold_h_um: {template: "ubump_h_um + asic_h_um", note: "2nd mold ground flush with the die backs: standoff + die height"}
  c4_pitch_um:
    analog: ectc51909.2023.00155-a-i3.pitch_um
    refs: [ectc51909.2023.00175-a-i5.notes]
    note: "plated C4 pitch not given; analog = 150 um-pitch Cu/SnAg interposer-to-substrate bump of a 2.5D TV"
  c4_d_um:
    analog: ectc51909.2023.00155-a-i3.diameter_um
    note: "C4 diameter not given; analog = the same 150 um-pitch bump"
  c4_cap_um:
    analog: ectc51909.2023.00155-a-i3.cap_height_um
    note: "solder cap height not reported; cap of the same analog joint as the standoff (R2 2026-10-20: joint drawn as Cu column + solder cap)"
  c4_h_um:
    template: "r0 + r1"
    refs: [ectc51909.2023.00155-a-i3.height_um, ectc51909.2023.00155-a-i3.cap_height_um]
    note: "C4 standoff = Cu + SnAg cap of the 150 um-pitch analog bump"
  ri_front_n:
    analog: ectc51687.2025.00095-a-L05.repeat
    note: "top RDL layer count not given; analog = 2-layer FO-RDL of ASE FOCoS Bridge (bridge-in-mold peer)"
  ri_back_n: {template: 1, note: "bottom RDL layer count not given; one level drawn under the 1st mold for the C4"}
  ri_f_line_um:
    analog: ectc51687.2025.00095-a-L05.line_um
    note: "top RDL L/S not given; analog = 8/8 um 2-layer FO-RDL of ASE FOCoS Bridge (same row as the level count)"
  ri_f_space_um:
    analog: ectc51687.2025.00095-a-L05.space_um
    note: "top RDL L/S not given; analog = 8/8 um 2-layer FO-RDL of ASE FOCoS Bridge (same row as the level count)"
  ri_b_line_um:
    analog: ectc51687.2025.00095-a-L05.line_um
    note: "bottom RDL L/S not given; analog = 8/8 um FO-RDL of ASE FOCoS Bridge"
  ri_b_space_um:
    analog: ectc51687.2025.00095-a-L05.space_um
    note: "bottom RDL L/S not given; analog = 8/8 um FO-RDL of ASE FOCoS Bridge"
  ri_cu_um:
    analog: ectc51909.2023.00266-a-L02.thickness_um
    note: "RDL Cu thickness not given; analog = fan-out RDL Cu of a Deca M-Series TV"
  ri_diel_um:
    analog: ectc51846.2026.00016-a-L04.thickness_um
    note: "RDL dielectric thickness not given; analog = polyimide RDL dielectric of a mold interposer"
  tiv_d_um:
    analog: ectc51529.2024.00013-a-i4.diameter_um
    note: "tall pillar diameter not given; analog = 120 um-high Tall Pillar of the AOI pillar-suspended bridge module"
  lsi_m_n:
    analog: ectc.2016.201-a-L02.repeat
    note: "connect-die metal level count not reported; analog = 4 routing levels of the Intel EMIB bridge"
  lsi_m_um:
    analog: ectc51909.2023.00174-d-L02.thickness_um
    note: "connect-die metal level thickness not reported; analog = TSMC LSI-1 dual-damascene Cu level"
  lsi_line_um:
    analog: ectc.2016.201-a-L02.line_um
    note: "connect-die line width not reported; analog = Intel EMIB bridge 2/2 um"
  lsi_space_um:
    analog: ectc.2016.201-a-L02.space_um
    note: "connect-die line space not reported; analog = Intel EMIB bridge 2/2 um"
  lsi_via_pitch_um: {template: "ubump_pitch_um", note: "one Cu stud per ASIC micro-bump over the connect die; stud pitch not reported"}
  lsi_via_d_um: {template: "ubump_d_um", note: "Cu stud diameter not reported; set equal to the micro-bump diameter"}
  rv_d_um:
    analog: ectc51687.2025.00095-a-i2.diameter_um
    note: "RDL via size not reported; analog = 10 um passivation via landing on bridge studs (ASE FOCoS Bridge)"
  rv_land_um:
    template: "rv_d_um * 48 / 29"
    refs: [ectc51687.2025.00095-a-i3.ic_type]
    note: "RDL via land not reported; T-profile of the FOCoS-Bridge analog via (fig ectc51687.2025.00095-f04, pixel widths): pad on the lower RDL metal ~48 px over the ~29 px stem that lands on the post / stud (R2 2026-10-20; was land / via 11 / 8 of TSMC CoWoS-R)"
  rv_m_d_um:
    template: "rv_d_um"
    note: "via between the two upper RDL metals not reported; drawn like the analog 10 um via"
  rv_m_land_um:
    template: "rv_m_d_um * 92 / 30"
    refs: [ectc51687.2025.00095-a-i3.ic_type]
    note: "via land not reported; T-profile of the FOCoS-Bridge analog via (fig ectc51687.2025.00095-f04): pad on the top RDL metal ~92 px over a ~30 px stem"
  rv_m_bot_d_um:
    template: "rv_m_d_um * 26 / 31"
    refs: [ectc51687.2025.00095-a-i3.ic_type]
    note: "via bottom not reported; filled stems narrow downward in fig ectc51687.2025.00095-f04 (pixel widths ~31 px under the pad to ~26 px at the base)"
  rv_bot_d_um:
    template: "rv_d_um * 26 / 31"
    refs: [ectc51687.2025.00095-a-i3.ic_type]
    note: "via bottom not reported; taper of the FOCoS-Bridge analog via (fig ectc51687.2025.00095-f04, ~31 to ~26 px); the S-Connect schematic fig ectc51909.2023.00175-f03 also draws tapered top-RDL vias with caps"
  # ---- template: substrate (HDBU; stack not given; module stack with analogs)
  bu_n:
    analog: ectc51909.2023.00155-a-L16.repeat
    note: "HDBU layer count not given; analog = 4 build-up layers per side (4/2/4) of the substrate under a 2.5D Si-interposer TV"
  core_h_um:
    analog: ectc51909.2023.00155-a-L17.thickness_um
    note: "core thickness not reported; analog = 1.3 mm CCL core of the same 2.5D-TV substrate"
  uf_margin_mm: {template: 0.3, note: "CUF fillet extent not reported; illustrative"}
  bga_pitch_um:
    analog: ectc51909.2023.00155-a-i4.pitch_um
    note: "BGA drawn in the Fig. 1 schematic without dimensions; analog = 1.0 mm pitch of a large 2.5D TV"
  bga_d_um:
    analog: ectc51909.2023.00155-a-i4.diameter_um
    note: "BGA ball diameter not reported; analog = SAC305 ball of the same 2.5D TV"
  bga_h_um:
    template: 478
    refs: [ectc51909.2023.00155-a-i4.notes]
    note: "BGA height not reported; the analog row's notes give a measured ball height of 478 um"

parts:
  - {id: substrate, name: "HDBU substrate", kind: substrate, material: organic_laminate,
     material_label: "organic build-up substrate (HDBU)", w_mm: sbt_w_mm, d_mm: sbt_d_mm, h_um: sbt_h_um, base: true,
     explode_group: 0}
  # module parts ri_back / ri_core / ri_front come from the module (renamed in `use`); the connect die is re-placed here
  - id: lsi
    name: "Connect die (Si bridge)"
    kind: bridge
    material: silicon
    x_mm: lsi_x_mm
    w_mm: lsi_w_mm
    d_mm: lsi_d_mm
    h_um: lsi_part_h_um
    in: ri_core
    repeat: {ny: lsi_rows_n, pitch_y_mm: hbm_py_mm}
    explode_group: 2
    note: "face up; die + ~5 um Cu stud level, flush with the ground 1st-mold surface"
  - id: lsi_gap
    name: "Under connect die (drawn as 1st mold)"
    kind: other
    material: mold_compound
    material_label: "not described; drawn as the 1st-mold EMC"
    x_mm: lsi_x_mm
    w_mm: lsi_w_mm
    d_mm: lsi_d_mm
    h_um: lsi_gap_um
    in: ri_core
    depth_um: "lsi_via_h_um + lsi_h_um"
    repeat: {ny: lsi_rows_n, pitch_y_mm: hbm_py_mm}
    explode_group: 2
    xray_default: false
    note: "the die is face-up bonded on the carrier (flow s01); the medium under it is not described: drawn as the 1st-mold EMC that fills the module (assumption, R2 2026-10-20; was a neutral grey block that read as Si)"
  - {id: mold2, name: "2nd mold", kind: mold, material: mold_compound, material_label: "EMC (2nd mold)", w_mm: ri_w_mm,
     d_mm: ri_d_mm, h_um: mold_h_um, on: ri_front, explode_group: 4, xray_default: true,
     note: "ground to expose the die tops; outer edge flush with the module"}
  - {id: asic, name: "Dummy ASIC", kind: die, material: silicon, x_mm: asic_x_mm, w_mm: asic_w_mm, d_mm: asic_d_mm,
     h_um: asic_h_um, in: mold2, explode_group: 4}
  - id: hbm
    name: "Dummy HBM2"
    kind: hbm
    material: silicon
    x_mm: hbm_x_mm
    w_mm: hbm_w_mm
    d_mm: hbm_d_mm
    h_um: hbm_h_um
    in: mold2
    repeat: {ny: hbm_n, pitch_y_mm: hbm_py_mm}
    explode_group: 4
  - id: uf
    name: "Capillary underfill (CUF)"
    kind: underfill
    material: underfill
    fill: {above: ri_front, parts: [asic, hbm], margin_mm: uf_margin_mm}
    explode_group: 3
    xray_default: true

layers:
  # connect-die stack restated (dielectric not stated); ids match the module via classes
  - part: lsi
    pattern:
      - {id: lsi_stud, name: "Cu stud level", material: mold_compound, material_label: "EMC (1st mold) between the Cu studs",
         role: dielectric, h_um: lsi_via_h_um}
  - part: lsi
    repeat: lsi_sig_n
    pattern:
      - {id: lsi_m, name: "Connect-die metal level", material: copper, material_label: "BEOL metal (not specified)",
         role: conductor, h_um: lsi_m_um,
         route: {use: signal, dir: x, line_um: lsi_line_um, space_um: lsi_space_um, matrix: other}}
      - {id: lsi_imd, name: "Connect-die BEOL dielectric", material: other, material_label: "dielectric (not stated)",
         role: dielectric, h_um: lsi_imd_um}
  - part: lsi
    pattern:
      - {id: lsi_m1, name: "Connect-die M1 (GND plane)", material: copper, material_label: "BEOL metal (not specified)",
         role: conductor, h_um: lsi_m_um, route: {use: plane, matrix: other}}
      - {id: lsi_si, name: "Connect-die Si", material: silicon, role: core, h_um: lsi_si_um}

arrays:
  - {id: ubump_asic, name: "ASIC micro-bumps", kind: microbump, per: asic, lower: ri_front, pitch_um: ubump_pitch_um,
     diameter_um: ubump_d_um, height_um: ubump_h_um, cap_h_um: ubump_cap_um, note: "pitch rendered over the full die; the bump map is not reported"}
  - {id: ubump_hbm, name: "HBM micro-bumps", kind: microbump, per: hbm, lower: ri_front, pitch_um: hbm_ubump_pitch_um,
     diameter_um: ubump_d_um, height_um: ubump_h_um, cap_h_um: ubump_cap_um}
  - {id: c4, name: "Plated C4 bumps", kind: c4, upper: ri_back, lower: substrate, region: {part: ri_back},
     pitch_um: c4_pitch_um, diameter_um: c4_d_um, height_um: c4_h_um, cap_h_um: c4_cap_um,
     pad_um: c4_pad_um, opening_um: c4_open_um}
  - {id: bga, name: "BGA balls", kind: bga, under: substrate, region: {part: substrate}, pitch_um: bga_pitch_um,
     diameter_um: bga_d_um, height_um: bga_h_um,
     pad_um: bga_pad_um, opening_um: bga_open_um}

routing:
  vias:
    # the module's rv_f spans every top-RDL dielectric; split per level for the T-profile lands (R2 2026-10-20)
    - {id: rv_f, name: "Top RDL via (onto stud / pillar)", kind: rdl_via, through: ri_f_diel_2, diameter_um: rv_d_um,
       bottom_diameter_um: rv_bot_d_um, land_um: rv_land_um, fill: filled,
       note: "T-profile tapered filled via (FOCoS analog fig ectc51687.2025.00095-f04; schematic ectc51909.2023.00175-f03)"}
    - {id: rv_m, name: "Top RDL via (metal to metal)", kind: rdl_via, through: ri_f_diel_1, diameter_um: rv_m_d_um,
       bottom_diameter_um: rv_m_bot_d_um, land_um: rv_m_land_um, fill: filled,
       note: "T-profile tapered filled via (FOCoS analog fig ectc51687.2025.00095-f04)"}
  nets:
    - {id: ri_asic, kind: vertical, from: ubump_asic, to: c4, style: stacked, jog: [ri_f_cu, ri_b_cu], share: 0.4,
       note: "ASIC power / IO: top RDL -> tall Cu pillar -> bottom RDL -> plated C4 (vertical top-bottom RDL path, row -i4)"}
    - {id: d2d, kind: lateral, from: ubump_hbm, to: ubump_asic, levels: [lsi_m], share: 0.5,
       note: "ASIC-HBM wires inside the connect-die BEOL under the D2D gap (Cu studs up to the top RDL)"}

callouts:
  - {target: lsi, text: "Connect die {lsi_w_mm} x {lsi_d_mm} mm"}
  - {target: lsi, text: "~{lsi_h_um} um thick, face up", refs: [ectc51909.2023.00175-F1-s01.step]}
  - {target: lsi_via, text: "Cu stud ~{lsi_via_h_um} um"}
  - {target: tiv, text: "Pillar {ri_core_h_um}/{tiv_pitch_um} um height/pitch"}
  - {target: ubump_asic, text: "ubump {ubump_pitch_um}/{hbm_ubump_pitch_um} um ASIC/HBM"}
  - {target: ri_core, text: "Mimic IPD embedded in mold", refs: [ectc51909.2023.00175-a-c4.name]}
  - {target: mold2, text: "2nd mold ground to die tops", refs: [ectc51909.2023.00175-F1-s10.step]}
  - {target: ri_core, text: "mTV2: {m2_w_mm} x {m2_d_mm} mm, lidded", refs: [ectc51909.2023.00175-b-c8.name]}
  - {target: rv_f, text: "Top RDL vias onto studs",
     note: "top RDL levels, L/S and vias not reported; 2 levels with stacked vias drawn after the FOCoS-Bridge analog (schematic ectc51909.2023.00175-f03)"}
  - {target: d2d, text: "ASIC-HBM wires in connect die",
     note: "die-to-die wires in the connect-die metal levels; levels and lane count not reported (mock-up layout)"}
  - {target: pth, text: "Analog build-up, plugged PTH",
     note: "HDBU stack not reported; build-up, microvias and PTH from analogs (2.5D-TV 4/2/4 substrate, 4-2-4 FCBGA TV)"}

insets:
  - id: bridge_edge
    label: "Connect die under the HBM-ASIC gap"
    box_mm: ["lsi_x_mm - 0.25", "hbm_py_mm / 2 - 0.25", "lsi_x_mm + 0.25", "hbm_py_mm / 2 + 0.25"]
    z: ["bottom:ri_back", "bottom:asic"]
    view: front
  - id: module_stack
    label: "Module stack: pillars, die, studs"
    box_mm: ["lsi_x_mm - lsi_w_mm / 2 - 0.4", "hbm_py_mm / 2 - 0.3", "lsi_x_mm - lsi_w_mm / 2 + 0.4", "hbm_py_mm / 2 + 0.3"]
    z: ["top:substrate", "bottom:asic"]
    view: front
  - id: sbt_stack
    label: "C4, build-up, PTH core, BGA"
    box_mm: ["lsi_x_mm - 1.5", "hbm_py_mm / 2 - 0.5", "lsi_x_mm + 1.5", "hbm_py_mm / 2 + 0.5"]
    z: ["bottom:bga", "top:ri_back"]
    view: front
  - id: module_edge
    label: "Module edge, C4"
    box_mm: ["ri_w_mm / 2 - 1.5", -1.5, "ri_w_mm / 2 + 2", 1.5]
    z: ["top:substrate", "top:mold2"]
    view: front
