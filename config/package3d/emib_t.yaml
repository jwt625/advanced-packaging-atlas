# EMIB-T 3D template. Format: config/package3d/TEMPLATE_FORMAT.md. Generator: scripts/build_package3d.py.
# Backbone: ectc51846.2026.00051-b (EMIB25T TV: one 3 x 18 mm EMIB-T bridge with TSVs connecting two 1x-reticle top
# dies at 25 um FLI pitch; the ~50 um bridge thickness is the paper's general EMIB statement, Sec. I, not an EMIB25T
# value, so it is drawn as a template value). The substrate outline is taken from the 45 um-pitch EMIB-T package TV
# (ectc51687.2025.00051-a, 77 x 56 mm) because the backbone TV does not report one. Topology (bridge face-up in a
# substrate cavity, solder joints + underfill to cavity pads, dielectric encapsulation with vias onto bridge pads,
# surface layer + FLI) follows the EMIB-T process-step rows of ectc51687.2025.00051-a and the Fig. 3 schematic of
# ectc51846.2026.00051 (two stacked micro-vias from the surface pad to the bridge pad; TSV groups; cavity-side bumps).
# Routing (DevLog-011, 2026-10-20): no substrate number is reported for EMIB-T, so the substrate stack uses the same
# analogs as emib.yaml (2.5D HPC 4/2/4 substrate ectc51909.2023.00155-a: 15 um film, L/S 14/20, 40 um via, 1.3 mm core,
# SR 18, 200 um PTH, BGA; 5/2/5 level count of the Si-bridge MTV substrate ectc51846.2026.00073-a). Cavity: bridge top
# at the top of L3 (encapsulation dielectric + surface layer over it), cavity-side joints on pads of the core-top Cu
# level; the joint height closes the stack (template). Bridge BEOL: the paper's 'at least 10 metal layers' drawn as 10
# thin levels with a MIM band between M1 and M2. Bridge back: TSV groups end on backside pads over the cavity-side bumps
# (Fig. 3); one TSV column per cavity bump at the cavity-bump pitch (audit A1 S3, 2026-10-20).
id: emib_t
name: EMIB-T
company: Intel
package_class: si_bridge_organic
family_match: {families: true}
backbone_tv: ectc51846.2026.00051-b
summary: >-
  Intel 2.5D: a thin Si bridge with TSVs sits face-up in an organic-substrate cavity, soldered to cavity pads;
  top dies reach it through {fli_bridge_pitch_um} um FLI bumps and vias. Backbone: EMIB25T TV, {die_n} dies, one
  {bridge_w_mm} x {bridge_d_mm} mm bridge.

params:
  # ---- reported
  sbt_w_mm: {ref: ectc51687.2025.00051-a-c2.x_mm, note: "outline of the 45 um-pitch EMIB-T package TV (backbone TV reports none)"}
  sbt_d_mm: {ref: ectc51687.2025.00051-a-c2.y_mm, note: "outline of the 45 um-pitch EMIB-T package TV (backbone TV reports none)"}
  die_n: {ref: ectc51846.2026.00051-b-c2.count}
  bridge_w_mm: {ref: ectc51846.2026.00051-b-c1.x_mm}
  bridge_d_mm: {ref: ectc51846.2026.00051-b-c1.y_mm}
  fli_bridge_pitch_um: {ref: ectc51846.2026.00051-b-i1.pitch_um}
  fli_core_pitch_um:
    ref: ectc51846.2026.00051-a-i1.pitch_max_um
    note: "coarsest FLI pitch of the mixed 110/55/36 um EMIB-T TV, used outside the bridge region"
  fli_mid_pitch_um: {ref: ectc51846.2026.00051-a-i1.pitch_min_um}
  d2d45_pitch_um: {ref: ectc51687.2025.00051-a-i1.pitch_um}
  pkg45_bridges_n: {ref: ectc51687.2025.00051-a-c1.count}
  overlay_um: {ref: ectc51846.2026.00051-b-m1.value}
  mim_density: {ref: ectc51846.2026.00051-d-L02.properties}
  hbm4e_gbps: {ref: ectc51846.2026.00051-d-e1.lane_rate_gbps}
  m_n:
    ref: ectc51846.2026.00051-d-L01.repeat
    note: "'at least 10 metal layers'; the paper does not say bridge or package; drawn as bridge BEOL levels per the Fig. 3 schematic"
  # ---- derived layout
  die_px_mm: {derived: "die_w_mm + die_gap_um / 1000"}
  m_pairs_n: "(m_n - 2) / 2"   # M10..M3 as 4 x (signal level, plane level); M2 / MIM / M1 drawn separately
  # ---- template: layout
  bridge_h_um:
    template: "r0"
    refs: [ectc51846.2026.00051-b-c1.thickness_um]
    note: "~50 um is the paper's general EMIB bridge statement (ectc51846.2026.00051 p.1 Sec. I), not reported for the EMIB25T bridge"
  die_w_mm:
    template: 26
    note: "TV reports '1x reticle top dies' without size; full lithography field 26 x 33 mm assumed"
    refs: [ectc51846.2026.00051-b-c2.name]
  die_d_mm:
    template: 33
    note: "TV reports '1x reticle top dies' without size; full lithography field 26 x 33 mm assumed"
    refs: [ectc51846.2026.00051-b-c2.name]
  die_h_um:
    analog: ectc51529.2024.00322-a-c1.thickness_um
    note: "top-die thickness not reported for EMIB-T; analog = full-thickness (775 um) logic-mimic die of a 2.5D TV"
  die_gap_um:
    analog: tcpmt.2023.3312037-a-c2.gap_um
    note: "die-to-die gap not reported for EMIB-T; analog = Intel Co-EMIB DtD spacing ('as small as 100 um')"
  # ---- template: substrate stack (analogs; same set as emib.yaml)
  bu_n:
    analog: ectc51846.2026.00073-a-L07.repeat
    note: "EMIB-T substrate layer count not reported; analog = 5 build-up levels per side (5/2/5) of a Si-bridge 2.5D MTV substrate"
  bu_pairs_n: {template: "(bu_n - 1) / 2", note: "L2..L5 below the L1 pad level as 2 x (signal level, plane level); the 5th dielectric sits on the core Cu"}
  sr_h_um:
    analog: ectc51909.2023.00155-a-L15.thickness_um
    note: "solder resist not reported for EMIB-T; analog = SR of a 2.5D HPC 4/2/4 substrate"
  cu_h_um:
    analog: ectc51687.2025.00148-a-L06.thickness_um
    note: "build-up Cu thickness not reported for EMIB-T (nor in the 4/2/4 film analog); analog = build-up Cu of a 4-2-4 FCBGA TV; used for every Cu level incl. core Cu"
  bu_diel_um:
    analog: ectc51909.2023.00155-a-L16.thickness_um
    note: "build-up dielectric not reported for EMIB-T; analog = 15 um build-up film of a 2.5D HPC 4/2/4 substrate (thin enough for the fine vias over the bridge)"
  bu_line_um:
    analog: ectc51909.2023.00155-a-L16.line_um
    note: "build-up L/S not reported for EMIB-T; analog = 14/20 um wiring of the same 4/2/4 substrate"
  bu_space_um:
    analog: ectc51909.2023.00155-a-L16.space_um
    note: "build-up L/S not reported for EMIB-T; analog = 14/20 um wiring of the same 4/2/4 substrate"
  core_h_um:
    analog: ectc51909.2023.00155-a-L17.thickness_um
    note: "core thickness not reported for EMIB-T; analog = CCL core of the same 4/2/4 substrate"
  sbt_h_um:
    template: "core_h_um + 2 * (sr_h_um + (bu_n + 1) * cu_h_um + bu_n * bu_diel_um)"
    note: "substrate = core + 2 x (SR + 5 build-up Cu + core Cu + 5 dielectrics) (template inputs)"
  # ---- template: vias in the substrate
  mvia_d_um:
    analog: ectc51909.2023.00155-a-i6.diameter_um
    note: "build-up microvia not reported for EMIB-T; analog = 40 um microvia of the same 4/2/4 substrate (top diameter)"
  mv_wall_tan:
    template: "2 * r0 / (r1 - r2)"
    refs: [ectc51687.2025.00378-a-m5.value, ectc51687.2025.00378-a-m6.value, ectc51687.2025.00378-a-m7.value]
    note: "harmonized microvia taper rule (TEMPLATE_FORMAT.md 'Template rules'): bottom = top - 2 x drawn dielectric depth / tan(sidewall angle); tan(angle) = 2 x 15 um dielectric over the pad / (41.66 um top - 38.01 um bottom) = 8.22 (83 deg), measured on a 40 um laser via in laminated dry-film dielectric (analog TV ectc51687.2025.00378-a, Fig. 7); this family's earlier 38 / 42 diameter ratio came from the same via"
  mvia_bot_um:
    template: "mvia_d_um - 2 * bu_diel_um / mv_wall_tan"
    note: "microvia bottom not reported; harmonized taper rule over the drawn bu_diel_um depth (mv_wall_tan)"
  mvia_land_um:
    template: "mvia_d_um * r0 / r1"
    refs: [001c.147203-a-i1.pad_x_um, 001c.147203-a-i1.diameter_um]
    note: "microvia land not reported for a cored organic substrate; harmonized rule, TEMPLATE_FORMAT.md 'Template rules': land / via = 110 / 70 (pad >= 110 um for a 70 um Cu-filled stacked via: minimum design rule of a coreless 150 GHz AiP antenna substrate, R-G640)"
  pth_d_um:
    analog: ectc51909.2023.00155-a-i5.diameter_um
    note: "core through hole not reported for EMIB-T; analog = 200 um PTH in the 1.3 mm core of the same 4/2/4 substrate"
  pth_pitch_um:
    analog: ectc51687.2025.00148-a-i4.pitch_um
    note: "PTH pitch not reported for EMIB-T (nor for the 4/2/4 film analog); analog = 500 um core TH pitch of a 4-2-4 FCBGA TV"
  pth_wall_um:
    template: "(r0 + r1 + r2 + r3) / 4"
    refs: [eptc62800.2024.10909809-a-m17.value, eptc62800.2024.10909809-a-m18.value, eptc62800.2024.10909809-a-m19.value, eptc62800.2024.10909809-a-m20.value]
    note: "PTH plating not reported for a cored HPC substrate; harmonized rule, TEMPLATE_FORMAT.md 'Template rules': mean of the minimum barrel Cu of legs 1-4 of a thin-core through hole (11-18.5 um, mean 14.875 um)"
  pth_land_um:
    template: "pth_d_um * 1.5"
    refs: [ectc51687.2025.00148-a-i4.pitch_um]
    note: "PTH land not reported; harmonized rule, TEMPLATE_FORMAT.md 'Template rules': 1.5 x the hole, read from the 4-2-4 FCBGA schematic (fig ectc51687.2025.00148-f01, scaled by the 500 um TH pitch)"
  fv_d_um:
    template: "fli_bridge_pitch_um * 18 / 42"
    refs: [ectc51846.2026.00051-b-i2.notes]
    note: "micro-via onto bridge pads not dimensioned; read off the backbone EMIB25T X-SEM zoom fig ectc51846.2026.00051-f01 (d) (pixel widths, no scale bar): via stem ~18 px at the ~42 px FLI column pitch (25 um, row -b-i1); the 36 um TV SEM fig ectc51846.2026.00051-f04 (b) gives a similar via / pitch (~43 / 150 px at the via top). R2 2026-10-20: was the 16 um analog ectc51906.2022.00180-a-i1 (20 um-pitch vias of another package), which left 3 um between lands at 25 um pitch"
  fv_bot_um:
    template: "fv_d_um - 2 * bu_diel_um / mv_wall_tan"
    note: "fine-via (laser via through the same build-up film) bottom not reported; harmonized taper rule over the drawn bu_diel_um depth (mv_wall_tan)"
  ob_pad_fill:
    template: "0.7854 * fv_land_um ** 2 / fli_bridge_pitch_um ** 2"
    note: "Cu area fraction of L2 over the bridge (pads only, per-region level property, L18 2026-10-21): one round fine-via land per FLI site, pi / 4 x land^2 / pitch^2 (0.7854 = pi / 4)"
  fv_land_um:
    template: "fv_d_um + 2 * overlay_um"
    refs: [ectc51846.2026.00051-b-m1.qualifiers]
    note: "bridge pad / fine-via land not reported; via + 2 x the reported max via-to-pad overlay (< 3 um), so the pad captures the via; consistent with the discrete pads of fig ectc51846.2026.00051-f01 (d) (~30 px pads at ~42 px pitch, ~18 um at 25 um)"
  # ---- template: bridge BEOL and TSV
  m_line_um:
    analog: ectc.2016.201-a-L02.line_um
    note: "EMIB-T bridge L/S not reported; analog = EMIB bridge 2/2 um"
  m_space_um:
    analog: ectc.2016.201-a-L02.space_um
    note: "EMIB-T bridge L/S not reported; analog = EMIB bridge 2/2 um"
  m_via_um:
    analog: ectc.2016.201-a-L02.via_diameter_um
    note: "EMIB-T bridge via not reported; analog = EMIB 2 um dual-damascene via"
  m_h_um:
    analog: eptc59621.2023.10457670-a-L03.thickness_um
    note: "level thickness not reported; analog = 1 um dual-damascene Cu level (M1-M5) of a built 300 mm TSV Si interposer (until 2026-10-20 the 1 um level of a simulation-model bridge, ectc51846.2026.00035-a). Built bridge rows give 2-4 um (LSI / polyimide RDL bridges with <= 4 levels); 10 levels of 2 um plus IMD would leave about 14 um of Si in a ~50 um bridge, so the Si-BEOL value is kept and sits below that bridge range"
  m_imd_um:
    analog: ectc51846.2026.00035-a-L02.thickness_um
    note: "inter-metal dielectric not reported; analog = 1 um SiO2 ILD of the same dual-damascene Si bridge"
  pad_h_um: {template: "m_h_um", note: "bridge pad layer thickness not reported; set equal to a metal level"}
  mim_h_um:
    template: "m_imd_um"
    refs: [ectc51846.2026.00051-d-L02.layer_name]
    note: "MIM band thickness not reported; drawn as one via-dielectric level between M1 and M2"
  br_plane_fill:
    template: 0.6
    refs: [ectc.2016.201-a-L02.properties]
    note: "plane density not reported for EMIB-T; EMIB Vss level metal density 50-70 % (Table II), midpoint"
  bpad_h_um:
    analog: ectc51687.2025.00049-a-L04.thickness_um
    refs: [ectc51846.2026.00051-b-i3.notes]
    note: "bridge backside pad under each TSV group (Fig. 3, ectc51846.2026.00051-f03) not dimensioned; analog = 4 um Cu/Ni/Cu UBM of the bottom-side pillars of a Si bridge (DBHi coupon), the closest bridge-underside joint pad in the DB"
  bridge_si_um:
    template: "bridge_h_um - pad_h_um - m_n * (m_h_um + m_imd_um) - bpad_h_um"
    note: "bridge Si = bridge thickness - pad layer - 10 x (via dielectric + metal level) - backside pad level (analog level thicknesses)"
  tsv_pitch_um:
    template: "cav_pitch_um"
    refs: [ectc51846.2026.00051-b-i4.notes]
    note: "bridge TSV group pitch not reported; in Fig. 9 (ectc51846.2026.00051-f03) a group of 3-4 TSVs ends on one backside pad over each cavity-side bump: one group site per cavity bump at the cavity-bump pitch (harmonized rule, TEMPLATE_FORMAT.md 'Template rules': TSV pitch = endpoint pitch when no routing level lies between them), the group drawn with `cluster` (R2 2026-10-20)"
  tsv_cl_n:
    template: 4
    refs: [ectc51846.2026.00051-b-i4.notes]
    note: "TSVs per group not reported; the schematic fig ectc51846.2026.00051-f03 draws groups of 3-4 TSVs on each backside pad (4 in the left group); 4 drawn as a compact 2 x 2 group"
  tsv_cl_pitch_um:
    analog: iedm19573.2019.8993637-a-i2.pitch_min_um
    note: "TSV pitch inside a group not reported for EMIB-T; analog = 15 um minimum TSV pitch inside the TSV clusters of Intel Foveros (single / pair / 2 x 2 clusters sharing one bump), matching the Foveros TSV diameter analog"
  tsv_d_um:
    analog: vlsitechnologyandcir46783.2024.10631478-a-i3.diameter_um
    note: "bridge TSV diameter not reported; analog = Intel Foveros base-die TSV (SEM)"
  tsv_liner_um:
    template: 0.5
    refs: [vlsitechnologyandcir46783.2024.10631478-a-i3.dielectric]
    note: "TSV liner not reported for EMIB-T; 0.5 um SiO2 liner of the Foveros TSV analog"
  tsv_land_um:
    template: "tsv_cl_pitch_um + 1.5 * tsv_d_um"
    note: "TSV group pad not reported; one pad per TSV group (ectc51846.2026.00051-f03: the group ends on one backside pad): the 2 x 2 group span (one cluster pitch) plus the harmonized 1.5 x TSV land (TEMPLATE_FORMAT.md 'Template rules'), so the pad covers every TSV of the group"
  # ---- template: cavity
  bridge_depth_um:
    template: "sr_h_um + 2 * (cu_h_um + bu_diel_um)"
    refs: [ectc51687.2025.00051-F1-s05.step, ectc51687.2025.00051-F1-s06.step]
    note: "bridge top at the top of L3: encapsulation dielectric (s05) with vias + pads, then surface layer (s06) over it; two stacked vias as in the Fig. 3 schematic"
  cav_floor_um:
    template: "sr_h_um + bu_n * (cu_h_um + bu_diel_um)"
    refs: [ectc51687.2025.00051-F1-s02.step]
    note: "cavity floor = top of the core-top Cu level carrying the cavity pads (PTH right under the cavity in the Fig. 1(c) section); cavity depth not reported"
  cav_h_um:
    template: "cav_floor_um - bridge_depth_um - bridge_h_um"
    refs: [ectc51687.2025.00051-F1-s03.step, ectc51846.2026.00051-b-i3.bonding_method]
    note: "cavity-side solder joint (TCB) height not reported; closes the cavity (floor - bridge top - bridge)"
  cav_pitch_um:
    analog: ectc51846.2026.00050-e-i2.pitch_um
    note: "cavity-side bump pitch not reported; analog = 175 um bottom solder bumps of an IBM TSV bridge to laminate (power path)"
  cav_d_um: {template: "fli_core_d_um", note: "cavity-side bump diameter not reported; set equal to the coarse FLI bump"}
  cav_margin_mm: {template: 0.2, note: "cavity clearance around the bridge not reported; illustrative"}
  # ---- template: joints
  fli_bridge_d_um:
    analog: ectc51846.2026.00227-b-i1.diameter_um
    note: "FLI bump diameter at 25 um pitch not reported for EMIB-T; analog = 25 um-pitch Cu/SnAg TCB bump"
  fli_core_d_um:
    analog: vlsitechnologyandcir46783.2024.10631478-a-i2.diameter_um
    note: "FLI bump diameter at 110 um pitch not reported for EMIB-T; analog = Intel Foveros 110 um-pitch package-side bump"
  fli_h_um: {template: 30, note: "FLI joint standoff not reported in any EMIB-T or EMIB row; illustrative"}
  uf_margin_mm: {template: 0.5, note: "top-die underfill fillet extent not reported; illustrative"}
  bga_pitch_um:
    analog: ectc51909.2023.00155-a-i4.pitch_um
    note: "BGA not reported for EMIB-T; analog pitch of a large 2.5D TV (same as emib.yaml)"
  bga_d_um:
    analog: ectc51909.2023.00155-a-i4.diameter_um
    note: "BGA ball not reported for EMIB-T; analog = SAC305 ball of the same 2.5D TV"
  bga_h_um:
    template: 478
    refs: [ectc51909.2023.00155-a-i4.notes]
    note: "BGA height not reported for EMIB-T; the analog row's notes give a measured ball height of 478 um"

parts:
  - {id: substrate, name: "Organic package substrate", kind: substrate, material: organic_laminate,
     material_label: "organic build-up substrate", w_mm: sbt_w_mm, d_mm: sbt_d_mm, h_um: sbt_h_um, base: true,
     explode_group: 0}
  - {id: bridge, name: "EMIB-T bridge (Si, TSV)", kind: bridge, material: silicon, w_mm: bridge_w_mm,
     d_mm: bridge_d_mm, h_um: bridge_h_um, in: substrate, depth_um: bridge_depth_um, explode_group: 1}
  - {id: cavity_fill, name: "Cavity joints + underfill", kind: underfill, material: underfill,
     w_mm: "bridge_w_mm + 2 * cav_margin_mm", d_mm: "bridge_d_mm + 2 * cav_margin_mm", h_um: cav_h_um,
     in: substrate, depth_um: "bridge_depth_um + bridge_h_um", explode_group: 1, xray_default: true}
  - id: die
    name: Top die
    kind: die
    material: silicon
    w_mm: die_w_mm
    d_mm: die_d_mm
    h_um: die_h_um
    on: substrate
    standoff: fli_core
    repeat: {nx: die_n, pitch_x_mm: die_px_mm}
    explode_group: 3
  - id: die_uf
    name: "Top-die underfill"
    kind: underfill
    material: underfill
    fill: {above: substrate, parts: [die], margin_mm: uf_margin_mm}
    explode_group: 2
    xray_default: true
    note: "not described in EMIB-T rows; capillary underfill is reported for EMIB (ectc.2016.201)"

layers:
  # ---- bridge: pad layer, M10..M3 (signal / plane alternating), M2 / MIM band / M1, Si with TSVs
  - part: bridge
    pattern:
      - {id: br_pad, name: "Bridge pad layer", material: copper, material_label: "metal (not specified)",
         role: conductor, h_um: pad_h_um,
         route: {use: pad, matrix: oxide}}
  - part: bridge
    repeat: m_pairs_n
    pattern:
      - {id: br_vs, name: "Bridge via dielectric", material: oxide, material_label: "inter-metal dielectric (not specified)",
         role: dielectric, h_um: m_imd_um, via_um: m_via_um}
      - {id: br_ms, name: "Bridge signal level (M10, M8, M6, M4)", material: copper,
         material_label: "BEOL metal (not specified)", role: conductor, h_um: m_h_um, line_um: m_line_um,
         space_um: m_space_um,
         route: {use: signal, dir: x, line_um: m_line_um, space_um: m_space_um, matrix: oxide}}
      - {id: br_vp, name: "Bridge via dielectric", material: oxide, material_label: "inter-metal dielectric (not specified)",
         role: dielectric, h_um: m_imd_um, via_um: m_via_um}
      - {id: br_mp, name: "Bridge P/G plane (M9, M7, M5, M3)", material: copper,
         material_label: "BEOL metal (not specified)", role: conductor, h_um: m_h_um,
         route: {use: plane, space_um: m_space_um, matrix: oxide, fill: br_plane_fill}}
  - part: bridge
    pattern:
      - {id: br_vb, name: "Bridge via dielectric", material: oxide, material_label: "inter-metal dielectric (not specified)",
         role: dielectric, h_um: m_imd_um, via_um: m_via_um}
      - {id: br_m2, name: "Bridge M2 (MIM top plate, P/G)", material: copper, material_label: "BEOL metal (not specified)",
         role: conductor, h_um: m_h_um,
         route: {use: plane, space_um: m_space_um, matrix: oxide, fill: br_plane_fill}}
      - {id: br_mim, name: "High-density MIM band (M1-M2)", material: other,
         material_label: "MIM capacitor stack (not specified)", role: dielectric, h_um: mim_h_um}
      - {id: br_m1, name: "Bridge M1 (MIM bottom plate, TSV landing)", material: copper,
         material_label: "BEOL metal (not specified)", role: conductor, h_um: m_h_um,
         route: {use: plane, space_um: m_space_um, matrix: oxide, fill: br_plane_fill}}
      - {id: br_si, name: "Bridge Si (TSV)", material: silicon, role: core, h_um: bridge_si_um}
      - {id: br_bpad, name: "Bridge backside pads (TSV groups, cavity bumps)", material: copper,
         material_label: "Cu pad (not specified)", role: conductor, h_um: bpad_h_um,
         route: {use: pad, matrix: polymer_dielectric}}
  # ---- substrate front: SR, L1 pad level, L2..L5, core Cu (cavity floor, cavity pads)
  - part: substrate
    pattern:
      - {id: sr_top, name: "Solder resist (top)", material: polymer_dielectric, material_label: "solder resist",
         role: passivation, h_um: sr_h_um}
      - {id: top_cu, name: "L1 surface pad level (FLI pads)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: pad, matrix: polymer_dielectric}}
  - part: substrate
    repeat: bu_pairs_n
    pattern:
      - {id: bu_ds, name: "Build-up dielectric", material: organic_build_up, material_label: "build-up film (not named)",
         role: dielectric, h_um: bu_diel_um}
      - {id: bu_sig, name: "Build-up signal level (L2, L4)", material: copper, role: conductor, h_um: cu_h_um,
         line_um: bu_line_um, space_um: bu_space_um,
         route: {use: signal, dir: alt, line_um: bu_line_um, space_um: bu_space_um, matrix: organic_build_up,
                 regions: [{region: {part: bridge}, use: pad, fill: ob_pad_fill,
                            note: "over the bridge footprint L2 carries only the stacked fine-via pads at the FLI pitch, no traces (figs ectc51846.2026.00051-f03, -f01 (d)); outside it L2 is a signal level at the build-up L/S. In L4 the footprint lies inside the cavity (no Cu there)"}]}}
      - {id: bu_dp, name: "Build-up dielectric", material: organic_build_up, material_label: "build-up film (not named)",
         role: dielectric, h_um: bu_diel_um}
      - {id: bu_pl, name: "Build-up plane (L3 GND, L5 PWR)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: plane, space_um: bu_space_um, matrix: organic_build_up}}
  - part: substrate
    pattern:
      - {id: bu_dc, name: "Build-up dielectric (on core)", material: organic_build_up,
         material_label: "build-up film (not named)", role: dielectric, h_um: bu_diel_um}
      - {id: core_cu_t, name: "Core Cu (top face; cavity pads, PTH lands)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: mixed, dir: x, line_um: bu_line_um, space_um: bu_space_um, matrix: organic_laminate}}
      - {id: sbt_core, name: "Core", material: organic_laminate, material_label: "laminate core", role: core,
         h_um: core_h_um}
      - {id: core_cu_b, name: "Core Cu (bottom face)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: plane, space_um: bu_space_um, matrix: organic_laminate}}
  # ---- substrate back: mirrored L7..L10, L11 BGA pad level, SR
  - part: substrate
    repeat: bu_pairs_n
    pattern:
      - {id: bb_dp, name: "Back build-up dielectric", material: organic_build_up,
         material_label: "build-up film (not named)", role: dielectric, h_um: bu_diel_um}
      - {id: bb_pl, name: "Back plane (L7 PWR, L9 GND)", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: plane, space_um: bu_space_um, matrix: organic_build_up}}
      - {id: bb_ds, name: "Back build-up dielectric", material: organic_build_up,
         material_label: "build-up film (not named)", role: dielectric, h_um: bu_diel_um}
      - {id: bb_sig, name: "Back signal level (L8, L10)", material: copper, role: conductor, h_um: cu_h_um,
         line_um: bu_line_um, space_um: bu_space_um,
         route: {use: signal, dir: alt, line_um: bu_line_um, space_um: bu_space_um, matrix: organic_build_up}}
  - part: substrate
    pattern:
      - {id: bb_dc, name: "Back build-up dielectric (outer)", material: organic_build_up,
         material_label: "build-up film (not named)", role: dielectric, h_um: bu_diel_um}
      - {id: bga_cu, name: "L11 BGA pad level", material: copper, role: conductor, h_um: cu_h_um,
         route: {use: pad, matrix: polymer_dielectric}}
      - {id: sr_bot, name: "Solder resist (bottom)", material: polymer_dielectric, material_label: "solder resist",
         role: passivation, h_um: sr_h_um}

arrays:
  - {id: fli_bridge, name: "FLI bumps over bridge", kind: microbump, per: die, lower: substrate,
     region: {intersect: [bridge]}, pitch_um: fli_bridge_pitch_um, diameter_um: fli_bridge_d_um, height_um: fli_h_um}
  - {id: fli_core, name: "FLI bumps (coarse)", kind: microbump, per: die, lower: substrate,
     region: {subtract: [bridge]}, pitch_um: fli_core_pitch_um, diameter_um: fli_core_d_um, height_um: fli_h_um,
     note: "coarse pitch rendered over the die outside the bridge; the bump map is not reported"}
  - {id: cavity_bumps, name: "Cavity-side bumps", kind: microbump, in: cavity_fill, between: [bridge, substrate],
     region: {part: bridge}, pitch_um: cav_pitch_um, diameter_um: cav_d_um, height_um: cav_h_um}
  - {id: bga, name: "BGA balls", kind: bga, under: substrate, region: {part: substrate}, pitch_um: bga_pitch_um,
     diameter_um: bga_d_um, height_um: bga_h_um}

routing:
  layout_note: >-
    mock-up routing: net layout, shares, jogs, TSV grouping and the signal / plane assignment of levels are
    illustrative (Fig. 1 and Fig. 3 of ectc51846.2026.00051 as the visual reference); dims carry their own status
  vias:
    # two stacked micro-vias from the surface pad to the bridge pad (Fig. 3 / Fig. 4(b))
    - {id: bv_top, name: "Micro-via over bridge (surface layer)", kind: bridge_via, through: bu_ds_1,
       region: {part: bridge},
       diameter_um: fv_d_um, bottom_diameter_um: fv_bot_um, land_um: fv_land_um, pitch_um: fli_bridge_pitch_um,
       fill: filled,
       note: "one per FLI bump over the bridge (surface pad - via - L2 pad - via - bridge pad, figs ectc51846.2026.00051-f03, -f01 (d)); L2 is pad-only over the bridge (route region); outside the bridge the build-up microvia mv_s_1 spans the same dielectric"}
    - {id: bv_pad, name: "Micro-via onto bridge pad", kind: bridge_via, through: bu_dp_1,
       region: {part: bridge},
       diameter_um: fv_d_um, bottom_diameter_um: fv_bot_um, land_um: fv_land_um, pitch_um: fli_bridge_pitch_um,
       fill: filled,
       note: "through the encapsulation dielectric onto the bridge pad (via-to-pad overlay critical); bridge top = top of L3, so the via lands on the bridge pad inside the bridge footprint"}
    - {id: bvm_s, name: "Bridge BEOL via", kind: beol_via, through: br_vs, diameter_um: m_via_um, fill: filled}
    - {id: bvm_p, name: "Bridge BEOL via", kind: beol_via, through: br_vp, diameter_um: m_via_um, fill: filled}
    - {id: bvm_b, name: "Bridge BEOL via", kind: beol_via, through: br_vb, diameter_um: m_via_um, fill: filled}
    - {id: bvm_mim, name: "Via through MIM band", kind: beol_via, through: br_mim, diameter_um: m_via_um, fill: filled,
       note: "MIM stitched to the P/G grids with BEOL vias (ectc51846.2026.00051-d-L02 notes)"}
    - {id: tsv, name: "Bridge TSV", kind: tsv, through: br_si, diameter_um: tsv_d_um, land_um: tsv_land_um,
       pitch_um: tsv_pitch_um, liner_um: tsv_liner_um, fill: filled,
       cluster: {n: tsv_cl_n, pitch_um: tsv_cl_pitch_um},
       note: "TSV group per cavity bump: TSV tops on M1, bottoms on one backside pad over the cavity-side bump (groups of 3-4 per pad in fig ectc51846.2026.00051-f03; 4 drawn)"}
    - {id: mv_s, name: "Build-up microvia", kind: microvia, through: bu_ds, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_p, name: "Build-up microvia", kind: microvia, through: bu_dp, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_um, land_um: mvia_land_um, fill: filled}
    - {id: mv_c, name: "Build-up microvia", kind: microvia, through: bu_dc, diameter_um: mvia_d_um,
       bottom_diameter_um: mvia_bot_um, land_um: mvia_land_um, fill: filled}
    - {id: pth, name: "Plated through hole", kind: pth, through: sbt_core, diameter_um: pth_d_um, land_um: pth_land_um,
       pitch_um: pth_pitch_um, fill: plugged, plug: resin, wall_um: pth_wall_um,
       note: "resin-plugged, Cu-capped barrel in a cloth-reinforced core (Fig. 1(c) section)"}
    # back side: laser-drilled from below, so the bottom is the wide end
    - {id: mvb_p, name: "Back microvia", kind: microvia, through: bb_dp, diameter_um: mvia_bot_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mvb_s, name: "Back microvia", kind: microvia, through: bb_ds, diameter_um: mvia_bot_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
    - {id: mvb_c, name: "Back microvia", kind: microvia, through: bb_dc, diameter_um: mvia_bot_um,
       bottom_diameter_um: mvia_d_um, land_um: mvia_land_um, fill: filled}
  nets:
    # die-to-die wires on the bridge signal levels
    - {id: d2d, kind: lateral, from: fli_bridge_die_1, to: fli_bridge_die_2, levels: [br_ms], share: 0.5}
    - {id: pg_fine, kind: plane_tie, from: fli_bridge, plane: br_mp_1, share: 0.2}
    # power through the bridge: FLI over bridge -> 2 micro-vias -> bridge BEOL -> TSV -> cavity bump
    - {id: tsv_pwr, kind: vertical, from: fli_bridge, to: cavity_bumps, style: stacked, share: 0.3}
    # cavity bump -> cavity pad on core Cu -> PTH -> back build-up -> BGA
    - {id: cav_bga, kind: vertical, from: cavity_bumps, to: bga, style: stacked, jog: [core_cu_t, bb_sig_2], share: 0.6,
       note: "cavity pad -> short trace on the core-top Cu to a PTH land (cavity bumps at 175 um, PTHs at 500 um) -> PTH -> back build-up -> BGA"}
    # coarse FLI -> build-up (fan-out jogs) -> PTH -> back build-up -> BGA
    - {id: io, kind: vertical, from: fli_core, to: bga, style: stacked, jog: [bu_sig_1, bu_sig_2, bb_sig_2],
       share: 0.4}
    - {id: pg_top, kind: plane_tie, from: fli_core, plane: bu_pl_1, share: 0.3}
    - {id: pg_bot, kind: plane_tie, from: bga, plane: bb_pl_2, share: 0.3}
    - {id: esc, kind: escape, from: fli_core, levels: [bu_sig_1], share: 0.2, length_um: 400}

callouts:
  - {target: bridge, text: "EMIB-T bridge {bridge_w_mm} x {bridge_d_mm} mm",
     note: "EMIB-T bridge {bridge_w_mm} x {bridge_d_mm} mm, Si with TSVs (EMIB25T TV). Drawn ~50 um thick: the paper's general EMIB bridge statement (Sec. I), not reported for EMIB25T",
     refs: [ectc51846.2026.00051-b-c1.thickness_um]}
  - {target: br_mim, text: "On-bridge MIM capacitor {mim_density} (model)",
     note: "High-density MIM between Metal 1 and Metal 2 over the full bridge area, {mim_density} (model)",
     refs: [ectc51846.2026.00051-d-L02.notes]}
  - {target: fli_bridge, text: "FLI pitch {fli_bridge_pitch_um} um over bridge",
     note: "FLI pitch {fli_bridge_pitch_um} um over the bridge; {fli_mid_pitch_um}-{fli_core_pitch_um} um in the 2x-reticle TV"}
  - {target: bv_pad, text: "Via overlay < {overlay_um} um",
     note: "Via-to-bridge-pad overlay < {overlay_um} um (new alignment scheme)",
     refs: [ectc51846.2026.00051-b-m1.qualifiers]}
  - {target: substrate, text: "Outline from {d2d45_pitch_um} um-pitch TV",
     note: "Outline from the {d2d45_pitch_um} um-pitch EMIB-T TV ({pkg45_bridges_n} bridges)"}
  - {target: bridge, text: "HBM4e: {hbm4e_gbps} Gb/s (simulated)",
     note: "HBM4e channel over EMIB-T: {hbm4e_gbps} Gb/s (simulated)"}
  - {target: br_ms, text: "{m_n} bridge metal levels",
     note: "'At least {m_n} metal layers' (bridge or package not stated); drawn as bridge BEOL with signal / P/G alternation (mock-up)"}
  - {target: tsv, text: "TSV power path to cavity bumps",
     note: "TSVs carry power (and HSIO) from the package bottom through the bridge to the top dies; cavity-side solder joints on cavity pads, underfilled",
     refs: [ectc51846.2026.00051-b-i4.notes, ectc51687.2025.00051-a-i3.notes]}
  - {target: d2d, text: "D2D wires in bridge BEOL",
     note: "Die-to-die wires on the bridge signal levels between the two FLI fields (mock-up level assignment)"}
  - {target: mv_s, text: "Stacked microvias, build-up levels",
     note: "Coarse-bump nets drop through stacked filled microvias with fan-out jogs on the signal levels (mock-up; substrate stack is analog)"}
  - {target: pth, text: "Plugged PTH through core",
     note: "Plated through holes carry the nets through the core to the back build-up and BGA (analog dims)"}

insets:
  - id: bridge_edge
    label: "Die-die gap over the bridge"
    box_mm: ["-bridge_w_mm / 2 - 0.5", -1, "bridge_w_mm / 2 + 0.5", 1]
    z: ["bottom:cavity_fill", "top:die"]
    view: front
  - id: bridge_xs
    label: "Bridge in cavity (TSV, cavity joints)"
    box_mm: ["-bridge_w_mm / 2 - 0.3", -0.5, "-bridge_w_mm / 2 + 0.6", 0.5]
    z: ["bottom:cavity_fill", "top:substrate"]
    view: front
  - id: fli_field
    label: "FLI fine/coarse transition"
    box_mm: ["-bridge_w_mm / 2 - 0.6", "bridge_d_mm / 2 - 0.6", "-bridge_w_mm / 2 + 0.6", "bridge_d_mm / 2 + 0.6"]
    z: ["top:bridge", "top:die"]
    view: front   # A9 D4 (2026-10-21): section view instead of the oblique camera
  - id: buildup_xs
    label: "Coarse bump to BGA: build-up, PTH"
    box_mm: [-6.5, -0.5, -3.5, 0.5]
    z: ["bottom:bga", "bottom:die"]
    view: front

# ---- variants (L28, 2026-10-21; TEMPLATE_FORMAT.md "variants"). The base above stays the DB backbone (EMIB25T TV,
# transcribed by engine/src/families); the viewer opens `default`. Research basis: config/package3d/RESEARCH_SOTA_EMIB.md
# (E3, E7, E10, C1, C2, section 7 `emib_t_2026`). No primary source gives the logic die count, die sizes, bridge size
# or placement of the 2026 point: those are assumptions, stated per param. The 2028 point (> 120 x 180 mm, > 24 HBM,
# > 38 bridges, > 12x) is not drawn.
variants:
  base:
    id: emib25t
    name: "DB backbone: EMIB25T, 2 dies, one 3 x 18 mm bridge"
    note: >-
      Backbone ectc51846.2026.00051-b (EMIB25T TV): one 3 x 18 mm EMIB-T bridge with TSVs connecting two 1x-reticle
      top dies at 25 um FLI pitch; outline of the 45 um-pitch EMIB-T package TV (77 x 56 mm).
  default: class_2026
  list:
    - id: class_2026
      name: "SOTA-class roadmap 2026: ~120 x 120 mm, 12 HBM, 32 bridges (template)"
      note: >-
        Intel EMIB-T roadmap point for 2026: package ~120 x 120 mm, 12 HBM, more than 20 EMIBs (platform brief) or 30+
        bridges (ECTC 2025, conflict C1 not resolved), more than 8x (or more than 9x, C2) reticle silicon. Drawn: 8
        one-reticle tiles (26 x 33 mm, as the backbone dies) in 4 x 2 plus 12 HBM, 10.0x reticle in total, which meets
        both reticle statements; 32 bridges (two per tile-tile edge, one per HBM edge), which meets
        both bridge statements. Tile count, die and bridge sizes and every position are assumptions (template).
      source: >-
        Intel Foundry platform brief 367370-001US (2025-11) p.5 Fig. 9 ('2026 > 8x ~120x120 12 > 20'); ectc51687.2025.00051
        p.4 Fig. 6 ('~120mmx120mm, 30+ bridges, >8x Reticle Equiv.', 40 um w/TSV); ectc51846.2026.00051 p.1 (> 120 x 120
        mm, more than 9x reticles); RESEARCH_SOTA_EMIB.md E3, E7, E10, C1, C2
      summary: >-
        Intel 2.5D: thin Si bridges with TSVs face-up in organic-substrate cavities, soldered to cavity pads; top dies
        reach them through {fli_bridge_pitch_um} um FLI bumps and vias. Roadmap-class layout (template): reticle-size
        tiles, HBM rows and many bridges on a large substrate.
      drop: [bridge_edge, bridge_xs, fli_field, buildup_xs]
      callouts_drop: ["EMIB-T bridge {bridge_w_mm} x {bridge_d_mm} mm", "Outline from {d2d45_pitch_um} um-pitch TV"]
      params:
        sbt_w_mm:
          template: 120
          source: "Intel Foundry platform brief 367370-001US (2025-11) p.5 Fig. 9; ectc51687.2025.00051 p.4 Fig. 6"
          note: "~120 x 120 mm package of the 2026 EMIB-T roadmap point (figure labels; no DB cell)"
        sbt_d_mm:
          template: 120
          source: "Intel Foundry platform brief 367370-001US (2025-11) p.5 Fig. 9; ectc51687.2025.00051 p.4 Fig. 6"
          note: "~120 x 120 mm package of the 2026 EMIB-T roadmap point (figure labels; no DB cell)"
        hbm_n:
          template: 12
          source: "Intel Foundry platform brief 367370-001US (2025-11) p.5 Fig. 9"
          note: "12 HBM at the 2026 point (figure table)"
        tile_n:
          template: 8
          note: "logic die count not stated for the roadmap point (assumption): 8 one-reticle tiles + 12 HBM = 10.0x of 830 mm2, which satisfies both '> 8x' (brief, ECTC 2025 Fig. 6) and 'more than 9x' (ECTC 2026); conflict C2 not resolved"
        pair_n: {template: 2, note: "mirror pair / two per edge (layout assumption)"}
        bridge_w_mm_tv: {ref: ectc51846.2026.00051-b-c1.x_mm, note: "EMIB25T bridge (callout)"}
        bridge_d_mm_tv: {ref: ectc51846.2026.00051-b-c1.y_mm, note: "EMIB25T bridge (callout)"}
        tile_cols_n: {template: 4, note: "tiles in 4 columns x 2 rows (assumption; the long block side along x)"}
        tile_rows_n: {template: "tile_n / tile_cols_n", note: "tile rows = tiles / columns"}
        die_py_mm: {template: "die_d_mm + die_gap_um / 1000", note: "tile row pitch = tile length + D2D gap"}
        hbm_w_mm:
          analog: ectc51529.2024.00049-a-c2.x_mm
          note: "HBM footprint not stated for the roadmap point; analog = 11 x 11 mm HBM of a TSMC CoWoS-R TV"
        hbm_d_mm:
          analog: ectc51529.2024.00049-a-c2.y_mm
          note: "HBM footprint not stated for the roadmap point; analog = 11 x 11 mm HBM of a TSMC CoWoS-R TV"
        hbm_h_um: {template: "die_h_um", note: "HBM height not stated; drawn coplanar with the tiles"}
        hbm_y_mm:
          template: "die_py_mm / 2 + die_d_mm / 2 + die_gap_um / 1000 + hbm_d_mm / 2"
          note: "HBM rows along the two long edges of the tile block, one D2D gap away (assumption)"
        hbm_in_px_mm: {template: "die_px_mm", note: "one HBM centered on each inner tile edge (assumption)"}
        hbm_off_mm: {template: "die_w_mm / 4", note: "two HBM over each corner tile, at its quarter points (assumption)"}
        hbm_out1_px_mm: {template: "3 * die_px_mm - 2 * hbm_off_mm", note: "inner HBM of each corner tile (x = 1.5 tile pitch - quarter)"}
        hbm_out2_px_mm: {template: "3 * die_px_mm + 2 * hbm_off_mm", note: "outer HBM of each corner tile (x = 1.5 tile pitch + quarter)"}
        bridge_w_mm:
          template: 8
          refs: [ectc.2016.201-a-c1.notes, ectc51846.2026.00051-b-c1.x_mm]
          note: "EMIB-T bridge size not stated for the roadmap point; 8 x 8 mm = upper end of the 2 x 2 to 8 x 8 mm EMIB bridge range (the EMIB25T 3 x 18 mm bridge does not fit one per HBM edge); assumption"
        bridge_d_mm: {template: "bridge_w_mm", note: "square bridge (assumption)"}
        bridge_n:
          template: "hbm_n + 2 * ((tile_cols_n - 1) * tile_rows_n + tile_cols_n * (tile_rows_n - 1))"
          note: "drawn bridge count (assumption): one per HBM-tile edge + two per tile-tile edge = 32; meets both '> 20 EMIBs' (brief) and '30+ bridges' (ECTC 2025); conflict C1 not resolved"
        br_v_py_mm:
          template: "die_d_mm - 2 * bridge_d_mm - 3"
          note: "two bridges per tile-tile edge along y, centred on the edge midpoint at this pitch so that each stays 1.5 mm clear of the bridges on the crossing edge and on the HBM edge (assumption)"
        br_h_off_mm: {template: "die_w_mm / 4", note: "two bridges per tile-tile edge along x, at the quarter points of the 26 mm edge (assumption)"}
        br_hbm_py_mm: {template: "die_py_mm + die_d_mm + die_gap_um / 1000", note: "HBM bridges centered on the HBM-tile gap (assumption)"}
        br_iy_mm: {template: "die_py_mm / 2 - br_v_py_mm / 2", note: "inset framing: the lower bridge of the central tile-tile edge in the upper row"}
        bx_mm: {template: "-1.5 * die_px_mm", note: "inset framing: x of a corner-tile center (no bridge there)"}
      parts:
        - id: bridge
          name: "EMIB-T bridge (Si, TSV)"
          kind: bridge
          material: silicon
          w_mm: bridge_w_mm
          d_mm: bridge_d_mm
          h_um: bridge_h_um
          in: substrate
          depth_um: bridge_depth_um
          repeat: &emibt_grids
            - {nx: pair_n, ny: tile_rows_n, pitch_x_mm: hbm_in_px_mm, pitch_y_mm: br_hbm_py_mm}
            - {nx: pair_n, ny: tile_rows_n, pitch_x_mm: hbm_out1_px_mm, pitch_y_mm: br_hbm_py_mm}
            - {nx: pair_n, ny: tile_rows_n, pitch_x_mm: hbm_out2_px_mm, pitch_y_mm: br_hbm_py_mm}
            - {nx: "tile_cols_n - 1", ny: pair_n, pitch_x_mm: die_px_mm, pitch_y_mm: br_v_py_mm, y_mm: "die_py_mm / 2"}
            - {nx: "tile_cols_n - 1", ny: pair_n, pitch_x_mm: die_px_mm, pitch_y_mm: br_v_py_mm, y_mm: "-die_py_mm / 2"}
            - {nx: tile_cols_n, pitch_x_mm: die_px_mm, x_mm: "-br_h_off_mm"}
            - {nx: tile_cols_n, pitch_x_mm: die_px_mm, x_mm: br_h_off_mm}
          explode_group: 1
          note: "placement assumed: one bridge under each HBM-tile edge, two under each tile-tile edge"
        - id: cavity_fill
          name: "Cavity joints + underfill"
          kind: underfill
          material: underfill
          w_mm: "bridge_w_mm + 2 * cav_margin_mm"
          d_mm: "bridge_d_mm + 2 * cav_margin_mm"
          h_um: cav_h_um
          in: substrate
          depth_um: "bridge_depth_um + bridge_h_um"
          repeat: *emibt_grids
          explode_group: 1
          xray_default: true
        - id: die
          name: "Logic tile (1x reticle, assumed)"
          kind: die
          material: silicon
          w_mm: die_w_mm
          d_mm: die_d_mm
          h_um: die_h_um
          on: substrate
          standoff: fli_core
          repeat: {nx: tile_cols_n, ny: tile_rows_n, pitch_x_mm: die_px_mm, pitch_y_mm: die_py_mm}
          explode_group: 3
        - id: hbm
          name: HBM
          kind: hbm
          material: silicon
          w_mm: hbm_w_mm
          d_mm: hbm_d_mm
          h_um: hbm_h_um
          on: substrate
          standoff: fli_core
          repeat:
            - {nx: pair_n, ny: pair_n, pitch_x_mm: hbm_in_px_mm, pitch_y_mm: "2 * hbm_y_mm"}
            - {nx: pair_n, ny: pair_n, pitch_x_mm: hbm_out1_px_mm, pitch_y_mm: "2 * hbm_y_mm"}
            - {nx: pair_n, ny: pair_n, pitch_x_mm: hbm_out2_px_mm, pitch_y_mm: "2 * hbm_y_mm"}
          explode_group: 3
          note: "12 HBM along the two long edges: one over each inner tile, two over each corner tile (assumption)"
        - id: die_uf
          name: "Top-die underfill"
          kind: underfill
          material: underfill
          fill: {above: substrate, parts: [die, hbm], margin_mm: uf_margin_mm}
          explode_group: 2
          xray_default: true
          note: "not described in EMIB-T rows; capillary underfill is reported for EMIB (ectc.2016.201)"
      arrays:
        - {id: fli_hbm, name: "HBM FLI bumps over bridge", kind: microbump, per: hbm, lower: substrate,
           region: {intersect: [bridge]}, pitch_um: fli_bridge_pitch_um, diameter_um: fli_bridge_d_um, height_um: fli_h_um}
        - {id: fli_hbm_core, name: "HBM FLI bumps (coarse)", kind: microbump, per: hbm, lower: substrate,
           region: {subtract: [bridge]}, pitch_um: fli_core_pitch_um, diameter_um: fli_core_d_um, height_um: fli_h_um}
      routing:
        nets:
          - {id: d2d, kind: lateral, from: fli_bridge, to: fli_bridge, levels: [br_ms], share: 0.5,
             note: "tile-tile wires on the bridge signal levels (mock-up level assignment)"}
          - {id: d2d_hbm, kind: lateral, from: fli_hbm, to: fli_bridge, levels: [br_ms], share: 0.5,
             note: "HBM-tile wires on the bridge signal levels (mock-up)"}
      callouts:
        - {target: bridge, text: "EMIB-T bridges with TSV",
           note: "EMIB-T bridges (Si with TSVs) in substrate cavities; count, size (8 x 8 mm) and placement drawn for the 2026 roadmap point are assumptions; the reported EMIB25T bridge is {bridge_w_mm_tv} x {bridge_d_mm_tv} mm"}
        - {target: substrate, text: "Roadmap-class package (template)",
           note: "Package outline and HBM count of the Intel 2026 EMIB-T roadmap point (platform brief Fig. 9, ECTC 2025 Fig. 6); tile count and layout are assumptions"}
      insets:
        - id: bridge_edge
          label: "Tile-tile gap over a bridge"
          box_mm: ["-bridge_w_mm / 2 - 0.5", "br_iy_mm - 1", "bridge_w_mm / 2 + 0.5", "br_iy_mm + 1"]
          z: ["bottom:cavity_fill", "top:die"]
          view: front
        - id: bridge_xs
          label: "Bridge in cavity (TSV, cavity joints)"
          box_mm: ["-bridge_w_mm / 2 - 0.3", "br_iy_mm - 0.5", "-bridge_w_mm / 2 + 0.6", "br_iy_mm + 0.5"]
          z: ["bottom:cavity_fill", "top:substrate"]
          view: front
        - id: fli_field
          label: "FLI fine/coarse transition"
          box_mm: ["-bridge_w_mm / 2 - 0.6", "br_iy_mm - 0.6", "-bridge_w_mm / 2 + 0.6", "br_iy_mm + 0.6"]
          z: ["top:bridge", "top:die"]
          view: front
        - id: hbm_edge
          label: "HBM-tile gap over a bridge"
          box_mm: ["die_px_mm / 2 - 0.5", "br_hbm_py_mm / 2 - bridge_d_mm / 2 - 0.5", "die_px_mm / 2 + 0.5",
                   "br_hbm_py_mm / 2 + bridge_d_mm / 2 + 0.5"]
          z: ["bottom:cavity_fill", "top:hbm"]
          view: right
        - id: buildup_xs
          label: "Coarse bump to BGA: build-up, PTH"
          box_mm: ["bx_mm - 1.5", "die_py_mm / 2 - 0.5", "bx_mm + 1.5", "die_py_mm / 2 + 0.5"]
          z: ["bottom:bga", "bottom:die"]
          view: front
