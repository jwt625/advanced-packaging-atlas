insets:
  - id: bridge_edge
    label: "Bridge under the HBM-ASIC gap"
    box_mm: ["-lsi_px_mm / 2 - 0.25", "1.5 * lsi_py_mm - 0.25", "-lsi_px_mm / 2 + 0.25", "1.5 * lsi_py_mm + 0.25"]
    z: ["bottom:ri_back", "bottom:asic"]
    view: front
  - id: module_stack
    label: "Module stack: pillars, bridge, RDL"
    box_mm: ["-lsi_px_mm / 2 - lsi_w_mm / 2 - 0.4", "1.5 * lsi_py_mm - 0.3", "-lsi_px_mm / 2 - lsi_w_mm / 2 + 0.4",
             "1.5 * lsi_py_mm + 0.3"]
    z: ["top:substrate", "bottom:asic"]
    view: front
  - id: sbt_stack
    label: "C4, build-up, PTH core, BGA"
    box_mm: ["-lsi_px_mm / 2 - 1.5", "1.5 * lsi_py_mm - 0.5", "-lsi_px_mm / 2 + 1.5", "1.5 * lsi_py_mm + 0.5"]
    z: ["bottom:bga", "top:ri_back"]
    view: front
  - id: module_edge
    label: "Module edge, C4, CoS underfill"
