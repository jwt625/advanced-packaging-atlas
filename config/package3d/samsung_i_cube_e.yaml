insets:
  - id: bridge_edge
    label: "Bridge at the logic edge (HBM side)"
    box_mm: ["-logic_w_mm / 2 - 0.3", "2.5 * lsi_py_mm - 0.25", "-logic_w_mm / 2 + 0.2", "2.5 * lsi_py_mm + 0.25"]
    z: ["bottom:ri_back", "bottom:logic"]
    view: front
  - id: interposer_stack
    label: "Interposer: posts, DAF, bridge, RDL"
    box_mm: ["-lsi_px_mm / 2 - lsi_w_mm / 2 - 0.4", "2.5 * lsi_py_mm - 0.3", "-lsi_px_mm / 2 - lsi_w_mm / 2 + 0.4",
             "2.5 * lsi_py_mm + 0.3"]
    z: ["top:substrate", "bottom:hbm"]
    view: front
  - id: sbt_stack
    label: "C4, build-up, PTH core, BGA"
    box_mm: ["-lsi_px_mm / 2 - 1.5", "2.5 * lsi_py_mm - 0.5", "-lsi_px_mm / 2 + 1.5", "2.5 * lsi_py_mm + 0.5"]
    z: ["bottom:bga", "top:ri_back"]
    view: front
  - id: ll_bridge
    label: "Bridge under logic-logic edge"
    box_mm: [-0.2, -0.2, 0.2, 0.2]
    z: ["bottom:ri_back", "bottom:logic"]
    view: right
