# Reconciliation with the reference checklists (S1, 2026-10-20). Element lists were drafted from DevLog-011 first,
# then changed as below after reading ROUTING_REF_substrate.md (R1, section 5), ROUTING_REF_si.md (R2, section 5) and
# ROUTING_REF_rdl.md (R3, section 5). Reference items that are dimensions / proportions (thickness ratios, pitch
# bands, L/S ranges, land/via ratio) are M5 / M6 / M7 items, not M2 presence items, and are not repeated here.
reconciliation:
  - {ref: R1, archetype: organic_substrate, change: "microvia-per-dielectric now needs land_um and fill (R1: filled, lands on both levels)"}
  - {ref: R1, archetype: organic_substrate, change: "pdn_plane split into pdn_plane_top / pdn_plane_bot (R1: >= 1 plane level per side)"}
  - {ref: R1, archetype: organic_substrate, change: "added bu_symmetric (R1: bottom build-up mirrors the top level count, n-2-n)"}
  - {ref: R1, archetype: organic_substrate, change: "pth_class needs wall_um and fill plugged (R1: plug distinct from the Cu wall for cores >= 400 um; all atlas cores are >= 1000 um)"}
  - {ref: R1, archetype: organic_substrate, change: "added net_jog (R1: >= 1 jog / staggered segment per vertical net, C4 -> PTH -> BGA fan-out)"}
  - {ref: R1, archetype: glass_core_substrate, change: "microvia lands / fill as above; added bu_symmetric (R1: symmetric count both faces)"}
  - {ref: R1, archetype: coreless, change: "R1 archetype B (coreless / thin core) not added: no atlas family uses it"}
  - {ref: R2, archetype: si_tsv_interposer, change: "tsv_class needs `upper` (R2: TSV top lands on an M1 pad)"}
  - {ref: R2, archetype: si_tsv_interposer, change: "bs_rdl accepts C4 UBM directly on the TSV (TSV via at the bottom face) as well as 1-2 backside RDL levels (R2: CoWoS 2013 has no backside RDL)"}
  - {ref: R2, archetype: si_tsv_interposer, change: "added beol_plane (R2: ground / power levels between the D2D signal levels)"}
  - {ref: R2, archetype: si_bridge_substrate, change: "added cavity_bumps for variant tsv (R2: cavity-side solder joints + pads under the TSV bridge)"}
  - {ref: R2, archetype: bridge_in_mold, change: "bridge_attach accepts solder joints at the bridge bottom (R2: TSV bridges are soldered, others on DAF)"}
  - {ref: R2, archetype: si_bridge_substrate, change: "R2 'no TSV, no bridge-bottom joints' (EMIB) kept implicit: TSV items are only expected for variant tsv"}
  - {ref: R3, archetype: organic_rdl_interposer, change: "added rdl_plane (R3: >= 1 plane / wide-strap power level distinct from signal levels)"}
  - {ref: R3, archetype: hybrid_bond_stack, change: "added pkg_joints for variant packaged (R3: bumps under the base die / wafer); soic and foveros_direct get variant packaged"}
  - {ref: R3, archetype: hybrid_bond_stack, change: "net_vertical uses `crosses: [hybrid_bond]` (net span includes the bond interface) instead of through_scope"}
  - {ref: R3, archetype: organic_rdl_interposer, change: "R3 '>= 4 RDL levels' (CoWoS-R) and the chip-first panel Cu studs are family-specific; kept as >= 2 levels (variant single_level: >= 1) and noted for M7"}
  # F1 fix pass (2026-10-20, DevLog-011 fix-pass queue + T6 / T7 reports)
  - {ref: F1, archetype: organic_rdl_interposer, change: "net_d2d not expected for variant cored (bridge-in-mold: the D2D wires live in the bridge BEOL, checked by bridge_in_mold.net_d2d)"}
  - {ref: F1, archetype: organic_rdl_interposer, change: "back_rdl not expected for variant no_back_rdl (FOCoS-Bridge TV-1: bottom passivation only, ectc51687.2025.00095-a-L08)"}
  - {ref: F1, archetype: organic_rdl_interposer, change: "tiv_class `upper` / `lower` resolve through-part via ends to the neighbouring part's conductor / via / endpoint (scorer)"}
  - {ref: F1, archetype: bridge_in_mold, change: "bridge_attach not expected for variant tsv: the LSI TSV lands on the back-side RDL of the interposer (ROUTING_REF_si.md CoWoS-L path and 'TSV in LSI (CoWoS-L)'), so there is no DAF / bridge-bottom joint in that flow (reason reworded by F2 per A1 minor M9; 'not reported' alone is not 'absent')"}
  - {ref: F1, archetype: organic_substrate, change: "pth_class accepts a Cu-filled through hole (fill filled, no wall / plug; X-Cube thin core)"}
  # F2 fix pass (2026-10-20, audit A1 DevLog/audits/package3d_routing_audit_A1_2026-10-20.md)
  - {ref: F2, archetype: organic_substrate, change: "pth_class: Cu-filled branch gated on scope core <= 400 um (R1 PTH wall / plug rule); plugged branch needs wall_um and plug in [resin, copper] (A1 S9)"}
  - {ref: F2, archetype: organic_rdl_interposer, change: "rdl_via per gap needs land_um (A1 S8: without lands the M6 land rules are vacuous)"}
  - {ref: F1, archetype: "si_tsv_interposer, organic_rdl_interposer", change: "net_d2d / beol_plane use when dies_share_min 2 (dies on one scope instance; Foveros: two tiles on two separate base dies)"}
  - {ref: F1, archetype: die, change: "die_encap not applicable when the die's only non-hybrid joints land on no part of the family (SoIC bottom bumps to an off-model carrier)"}
  - {ref: F1, archetype: fan_out_panel, change: "mapping: backbone switched to the 3-RDL chip-last TV 2380-4505-2020.1.000042-a (variant chip_last, multi-level; dies chip1, chip2a, chip2b)"}
