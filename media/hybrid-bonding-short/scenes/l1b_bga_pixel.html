<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>l1b bga pixel</title>
<script src="../lib/apa.js"></script>
<script src="../lib/textfx.js"></script>
</head>
<body>
<script>
// L1B: BGA (ball grid array) 1.0 mm pitch, package substrate to board, cross-section as 8-bit pixel art.
// Logical 320x180, one logical pixel = 6x6 screen px = 21.28 um; pitch = 47 lp = 282 px.
// Row 100 starts at y 600 = board pad top (joint plane). Geometry: l1b_bga_pixel.notes.md.
const { W, H, LINE_Y } = APA;
let ctx, src;

const S = 6;                       // screen px per logical px
const UM = 1000 / 47;              // um per logical px
const LW = 320 + 16, LH = 180;     // source width carries the pan margin
const ROW0 = LINE_Y / S;           // 100: first row of the board pad
const PITCH = 47;
const PAN_LPS = 4;                 // logical px per second (24 px/s), stepped like a tile scroller

// PICO-8 palette
const PAL = ['#000000', '#1D2B53', '#7E2553', '#008751', '#AB5236', '#5F574F', '#C2C3C7', '#FFF1E8',
  '#FF004D', '#FFA300', '#FFEC27', '#00E436', '#29ADFF', '#83769C', '#FF77A8', '#FFCCAA'];
const [K0, K1, K2, K3, K4, K5, K6, K7, , K9, , K11, , K13, , K15] = PAL.map((_, i) => i);

const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (c, r) => (BAYER[r & 3][c & 3] + 0.5) / 16;

// rows (explicit, see notes): package SR 79, package pad 78, build-up 70-77 (L6..L9 Cu on even rows), core 9-69
const R_SRP = 79, R_PADP = 78, R_BU0 = 70, R_BU1 = 77, R_CORE0 = 9, R_CORE1 = 69;
const R_PADB0 = 100, R_PADB1 = 101, R_SRB = 101;
const balls = [];
for (let n = -3; n <= 4; n++) balls.push(136.5 + n * PITCH);   // centers on half pixels: symmetric columns
const PADP = 350 / UM, OPENP = 250 / UM, PADB = 200 / UM, OPENB = 250 / UM;

function nearest(c) { let b = balls[0]; for (const x of balls) if (Math.abs(c + 0.5 - x) < Math.abs(c + 0.5 - b)) b = x; return b; }

const TOP = 12;                    // static rows above row 0, shown while the package is still above its final place
function build() {
  const g = new Uint8Array(LW * (LH + TOP));
  const set = (c, r, k) => { if (c >= 0 && c < LW && r >= -TOP && r < LH) g[(r + TOP) * LW + c] = k; };
  const pths = balls.filter((_, i) => i % 2 === 1).map((x) => x + PITCH / 2);

  // --- cavity
  for (let r = R_SRP + 1; r < R_PADB0; r++) for (let c = 0; c < LW; c++) {
    let k = K1;
    if (r === R_SRP + 1 && ((c + r) & 1)) k = K0;      // a dithered shadow line under the package
    set(c, r, k);
  }
  // --- board laminate: FR-4, green, glass weave as rows of lens beads, Cu planes every 395 um
  for (let r = R_SRB + 1; r < LH; r++) for (let c = 0; c < LW; c++) set(c, r, K3);
  const planeRows = [];
  for (let z = 35 + 360; ROW0 + z / UM < LH; z += 395) planeRows.push(Math.round(ROW0 + z / UM));
  // one ply of glass cloth per dielectric: lens beads (fill yarns cut across), lit top row, dark underside
  const weaveRows = [];
  let prev = R_SRB + 1;
  for (const pr of planeRows.concat([LH + 8])) { weaveRows.push(Math.round((prev + pr) / 2)); prev = pr + 2; }
  weaveRows.forEach((wr, i) => {
    const L = 19, off = (i % 2) * 9 + 3;
    for (let c = -L; c < LW + L; c++) {
      const u = ((c - off) % L + L) % L;
      if (u >= 3 && u <= 15) set(c, wr, K11);
      if (u >= 5 && u <= 13) set(c, wr + 1, K1);
      if (u >= 6 && u <= 12) set(c, wr - 1, K11);
    }
  });
  for (const pr of planeRows) for (let c = 0; c < LW; c++) { set(c, pr, K9); set(c, pr + 1, K4); }
  // --- board SR row and NSMD pads
  for (let c = 0; c < LW; c++) set(c, R_SRB, K3);
  for (const bx of balls) {
    for (let c = Math.floor(bx - OPENB); c <= Math.ceil(bx + OPENB); c++) {
      const d = Math.abs(c + 0.5 - bx);
      if (d < OPENB) { set(c, R_SRB, K0); set(c, R_PADB0, K1); }
      if (d < PADB) { set(c, R_PADB0, K15); set(c, R_PADB1, K9); }
    }
  }

  // --- package core: brown laminate, dark lens beads, PTHs
  for (let r = 0; r <= R_CORE1; r++) for (let c = 0; c < LW; c++) set(c, r, K4);
  const plies = 8, ph = (R_CORE1 - R_CORE0 + 1) / plies;
  for (let i = 0; i < plies; i++) {
    const wr = Math.round(R_CORE0 + ph * (i + 0.5));
    const L = 23, off = (i % 2) * 11 + 5;
    for (let c = -L; c < LW + L; c++) {
      const u = ((c - off) % L + L) % L;
      if (u >= 7 && u <= 15) set(c, wr - 2, K15);
      if (u >= 3 && u <= 19) set(c, wr - 1, K2);
      if (u >= 2 && u <= 20) set(c, wr, K2);
      if (u >= 4 && u <= 18) set(c, wr + 1, K2);
      if (u >= 8 && u <= 14) set(c, wr + 2, (u & 1) ? K2 : K4);
    }
  }
  for (const hx of pths) {
    const dr = 100 / UM; // 4.7 lp
    for (let c = Math.floor(hx - dr - 1); c <= Math.ceil(hx + dr + 1); c++) {
      const d = Math.abs(c + 0.5 - hx);
      if (d >= dr) continue;
      for (let r = R_CORE0; r <= R_CORE1; r++) set(c, r, d >= dr - 1 ? K9 : ((r + c) % 3 === 0 ? K13 : K5));
    }
  }
  // --- build-up stacks (top 0-8 and bottom 70-77): dielectric plum, Cu levels on alternating rows
  const dielRows = [1, 3, 5, 7, 71, 73, 75, 77];
  for (const r of dielRows) for (let c = 0; c < LW; c++) set(c, r, K2);
  const cuRow = (r, pattern) => { for (let c = 0; c < LW; c++) set(c, r, pattern(c) ? K9 : K2); };
  // planes with clearances (L6 core Cu with PTH lids, L9 GND plane) and signal levels (L7, L8)
  cuRow(70, (c) => { const b = nearest(c); return Math.abs(c + 0.5 - b) > 2.5 || false; });
  cuRow(76, (c) => Math.abs(c + 0.5 - nearest(c)) > 2.5);
  const traces = (seed) => { const r2 = APA.rng(seed); const m = new Uint8Array(LW); let c = Math.floor(r2() * 6); while (c < LW) { const l = 3 + Math.floor(r2() * 10); for (let q = 0; q < l && c + q < LW; q++) m[c + q] = 1; c += l + 2 + Math.floor(r2() * 6); } return (cc) => m[cc] === 1; };
  cuRow(72, traces(3));
  cuRow(74, traces(4));
  for (let c = 0; c < LW; c++) {
    set(c, -1, (c % 7) === 3 ? K9 : K3);                                    // top SR, C4 pad openings
    for (let r = -5; r <= -2; r++) set(c, r, (c % 7) >= 2 && (c % 7) <= 4 ? (r <= -4 ? K9 : K6) : (((c + r) & 1) ? K5 : K13));
    for (let r = -TOP; r <= -6; r++) set(c, r, r === -6 ? K13 : K5);          // Si interposer
  }
  cuRow(0, traces(5)); cuRow(2, (c) => true); cuRow(4, traces(6)); cuRow(6, traces(7)); cuRow(8, (c) => true);
  // via stacks under every pad (2 lp wide), lands on L9/L8/L7; even balls route on L7 to a PTH lid
  balls.forEach((bx, i) => {
    const c0 = Math.round(bx - 1);
    for (let r = 71; r <= 77; r++) { set(c0, r, K9); set(c0 + 1, r, K9); }
    for (const r of [72, 74, 76]) for (let c = c0 - 1; c <= c0 + 2; c++) set(c, r, K9);
    if (i % 2 === 1) {
      const hx = bx + PITCH / 2;
      for (let c = c0; c <= Math.round(hx + 1); c++) set(c, 72, K9);
      for (let c = Math.round(hx - 1); c <= Math.round(hx); c++) set(c, 71, K9);
    } else {
      for (let c = c0; c <= c0 + 1; c++) set(c, 71, K2);
    }
  });
  for (const hx of pths) for (let c = Math.floor(hx - 6); c <= Math.ceil(hx + 6); c++) { set(c, 70, K9); set(c, 8, K9); }
  // --- package SR and pads (SMD)
  for (let c = 0; c < LW; c++) { set(c, R_PADP, K3); set(c, R_SRP, K3); }
  for (const bx of balls) for (let c = Math.floor(bx - PADP); c <= Math.ceil(bx + PADP); c++) {
    const d = Math.abs(c + 0.5 - bx);
    if (d < PADP) set(c, R_PADP, K9);
    if (d < PADP && d >= PADP - 1) set(c, R_PADP, K4);
  }
  return g;
}


// ---- ball attach + reflow (all a function of t; whole logical-pixel steps) ----
// The balls are already attached to the package pads (ball attach); the package drops the last rows onto the board
// pads, each ball melts and wets its pad (staggered left to right, 1-2 frame squash), then the package collapses from
// the pre-reflow ball height (478 um) to the 444 um standoff with a one-frame overshoot.
const T_TOUCH = 0.16, STAGGER = 0.025, SQUASH = 0.08;
const T_MELT = balls.map((_, i) => T_TOUCH + 0.02 + STAGGER * i);
const T_LAST = T_MELT[T_MELT.length - 1];
function pkgRows(t) {                                     // package height above its final place, in rows
  if (t < T_TOUCH) return 2 + Math.round(5 * (1 - (t / T_TOUCH) ** 2));
  const u = t - T_LAST;
  if (u < 0.03) return 2;
  if (u < 0.07) return 1;
  if (u < 0.11) return 0;
  if (u < 0.15) return -1;                                // overshoot: the whole row squashes for one frame
  return 0;
}
const SOLID_R = 304.4 / UM, SOLID_C = 174.0 / UM;         // attached ball: 478 um tall from a 500 um SR opening
const LV = (() => { const v = [0.22, -0.7, 0.68]; const d = Math.hypot(...v); return v.map((a) => a / d); })();
const isBall = (k) => k === K5 || k === K6 || k === K7 || k === K13;

function drawBalls(f, t, sRows) {
  const ySR = R_SRP + 1 - sRows;                          // first cavity row = package SR bottom
  const set = (c, r, k) => { if (c >= 0 && c < LW && r >= 0 && r < LH) f[r * LW + c] = k; };
  const gUm = 439 + sRows * UM;                           // package SR to board pad top
  balls.forEach((bx, i) => {
    const melted = t >= T_MELT[i];
    const squash = melted && t < T_MELT[i] + SQUASH;
    let R, yc;
    if (!melted) { R = SOLID_R; yc = ySR + SOLID_C; }
    else {
      const z0 = (250 * 250 - 200 * 200 + gUm * gUm) / (2 * gUm);
      R = Math.sqrt(200 * 200 + z0 * z0) / UM; yc = ROW0 - z0 / UM;
    }
    const sx = squash ? 1.12 : 1;
    for (let c = Math.floor(bx - OPENP); c <= Math.ceil(bx + OPENP); c++) if (Math.abs(c + 0.5 - bx) < OPENP) set(c, ySR - 1, K6); // neck
    for (let r = ySR; r < R_PADB0; r++) for (let c = Math.floor(bx - R * sx - 1); c <= Math.ceil(bx + R * sx + 1); c++) {
      const dx = (c + 0.5 - bx) / sx, dy = r + 0.5 - yc;
      const q = (dx * dx + dy * dy) / (R * R);
      if (q > 1) continue;
      if (melted && r === R_PADB0 - 1 && Math.abs(c + 0.5 - bx) > PADB + 0.3 + (squash ? 1 : 0)) continue;
      const nzv = Math.sqrt(1 - q), nx = dx / R, ny = dy / R;
      let lam = nx * LV[0] + ny * LV[1] + nzv * LV[2];
      lam += Math.max(0, ny) * Math.pow(1 - nzv, 1.5) * 0.25;   // bounce light from the board
      const sm = Math.min(1, Math.max(0, (r - ySR - 1) / 5));
      lam *= 1 - 0.3 * sm * sm * (3 - 2 * sm);                   // the package shades the lower body: overlay band stays calm
      const band = r >= 84 && r <= 98;
      const v = lam + (bay(c, r) - 0.5) * (band ? 0.1 : 0.16);
      let k = v > 0.74 ? K6 : v > 0.44 ? K13 : K5;
      if (nx > 0.8 && ny > -0.1 && nx + (bay(c, r) - 0.5) * 0.12 > 0.86) k = K13;
      set(c, r, k);
    }
    // wetting flash at the pad edges while the ball squashes (row 99, below the overlay band)
    if (squash) { set(Math.floor(bx - PADB - 1), R_PADB0 - 1, K7); set(Math.floor(bx + PADB + 1), R_PADB0 - 1, K7); }
  });
  // outline: shadow side K0, lit side K5
  const out = f.slice(ySR * LW, R_PADB0 * LW);
  for (let r = ySR; r < R_PADB0 - 1; r++) for (let c = 1; c < LW - 1; c++) {
    const k = f[r * LW + c];
    if (!isBall(k)) continue;
    const nb = [f[r * LW + c - 1], f[r * LW + c + 1], f[(r + 1) * LW + c]].some((v) => v === K1 || v === K0);
    if (nb) out[(r - ySR) * LW + c] = (c + 0.5 - nearest(c)) < 3 ? K0 : K5;
  }
  f.set(out, ySR * LW);
  for (const bx of balls) {                               // specular glint, above the overlay band
    const c = Math.round(bx + 5), r = ySR + 2;
    set(c, r, K7); set(c + 1, r, K7); set(c - 1, r + 1, K7); set(c, r + 1, K6);
  }
}

// ---- overlay word as 8-bit title text (STYLE.md "Styled text") ----
// Press Start 2P sampled on the scene's own logical grid: one font pixel = one logical pixel (6 screen px) at the
// default 64 px size (whole multiples above), pen and baseline snapped to the grid, PICO-8 colours only: K7 / K15
// two-row ramp, a K0 outline (8-neighbour) and a K0 drop shadow (+1, +1), like arcade title text. A one-off K10
// glint steps diagonally across the letters (t 0.06-0.34 s, scene time); the word is complete from frame 0.
const textGrid = new Map();
function wordGrid(word, k, fam) {
  const key = word + '|' + k;
  if (textGrid.has(key)) return textGrid.get(key);
  const cell = 8 * k;                                   // sample at 8 screen px per font px (crisp), then rescale
  const m = TFX.mask(word, { family: fam, size: 8 * cell, pad: 2 * cell });
  const nc = Math.ceil(m.width / cell) + 1, top = 9, bot = 2, nr = top + bot;   // rows: baseline - 9 .. + 2
  const on = new Uint8Array(nc * nr);
  for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++) {
    on[r * nc + c] = m.cov(m.ox + (c + 0.5) * cell, m.oy + (r - top + 0.5) * cell) > 0.5 ? 1 : 0;
  }
  let r0 = nr, r1 = -1;
  for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++) if (on[r * nc + c]) { r0 = Math.min(r0, r); r1 = Math.max(r1, r); }
  const gd = { nc, nr, top, on, r0, r1, adv: Math.round(m.width / cell) };
  textGrid.set(key, gd);
  return gd;
}
function textHook(g, word, t, p, info) {
  const k = Math.max(1, Math.round(info.size / 64)), cell = S * k;
  const gd = wordGrid(word, k, info.fonts.pixel8);
  const dark = info.tone === 'dark' || /^#(0|1|2|3)/i.test(info.color);
  const FILL_T = PAL[dark ? K0 : K7], FILL_B = PAL[dark ? K1 : K15], RIM = PAL[dark ? K7 : K0], GLINT = PAL[10];
  const x0 = Math.round((info.x - gd.adv * cell / 2) / S) * S;     // pen on the logical grid
  const yb = Math.round(info.baseline / S) * S;                     // baseline on a logical row edge
  const { nc, nr, top, on } = gd;
  const at = (c, r) => (c >= 0 && r >= 0 && c < nc && r < nr ? on[r * nc + c] : 0);
  const px = (c, r) => g.fillRect(x0 + c * cell, yb + (r - top) * cell, cell, cell);
  g.fillStyle = RIM;                                                // outline + drop shadow
  for (let r = -2; r < nr + 2; r++) for (let c = -2; c < nc + 2; c++) {
    if (at(c, r)) continue;
    let rim = false;                                                // 1-lp ring, plus that ring shifted (+1, +1)
    for (let b = -2; b <= 1 && !rim; b++) for (let a = -2; a <= 1; a++) {
      if ((a === -2 || b === -2) && (a > 0 || b > 0)) continue;
      if (at(c + a, r + b)) { rim = true; break; }
    }
    if (rim) px(c, r);
  }
  const split = gd.r1 - 2;                                          // bottom two ink rows in the ramp colour
  const gs = Math.floor(Math.max(0, t - 0.06) / 0.02);              // glint step (one diagonal per 20 ms)
  const glintOn = t >= 0.06 && t < 0.34;
  for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++) {
    if (!on[r * nc + c]) continue;
    const d = c + (gd.r1 - r) - (gs - 4);
    g.fillStyle = glintOn && d >= 0 && d < 2 && r < split ? GLINT : r > split ? FILL_B : FILL_T;
    px(c, r);
  }
}

let stat, frameIdx, sctx, img, px32, pal32;
APA.scene({
  meta: { text: 'light' },
  init() {
    ({ ctx } = APA.canvas('2d'));
    stat = build();
    frameIdx = new Uint8Array(LW * LH);
    src = document.createElement('canvas');
    src.width = LW; src.height = LH;
    sctx = src.getContext('2d');
    img = sctx.createImageData(LW, LH);
    px32 = new Uint32Array(img.data.buffer);
    pal32 = PAL.map((h) => (255 << 24) | (parseInt(h.slice(5, 7), 16) << 16) | (parseInt(h.slice(3, 5), 16) << 8) | parseInt(h.slice(1, 3), 16));
  },
  render(t) {
    t = Math.max(0, t);
    const sRows = pkgRows(t);
    const ySR = R_SRP + 1 - sRows;
    const f = frameIdx;
    for (let r = 0; r < LH; r++) {
      if (r < ySR) f.set(stat.subarray((r + sRows + TOP) * LW, (r + sRows + TOP + 1) * LW), r * LW);
      else if (r < R_PADB0) for (let c = 0; c < LW; c++) f[r * LW + c] = r === ySR && ((c + r) & 1) ? K0 : K1;
      else f.set(stat.subarray((r + TOP) * LW, (r + TOP + 1) * LW), r * LW);
    }
    drawBalls(f, t, sRows);
    for (let i = 0; i < LW * LH; i++) px32[i] = pal32[f[i]];
    sctx.putImageData(img, 0, 0);
    const off = Math.min(LW - 320, Math.floor(t * PAN_LPS));
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(src, off, 0, 320, 180, 0, 0, W, H);
  },
  text: textHook,
});
</script>
</body>
