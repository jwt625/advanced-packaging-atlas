# Single-crystal silicon (lane L2, DevLog-012). Stored units are the source units; the loader converts to SI.
schema: ap-sim.materials/1
group: silicon
verified_on: 2026-10-21
materials:
  si_crystal:
    description: single-crystal Si, undoped or lightly doped (bulk die, interposer, bridge, HBM core dies)
    class: semiconductor
    tier: mvp
    status: partial
    template_keys: [silicon]
    valid_T_C: [-73.15, 326.85]   # 200-600 K: span of the CTE (Swenson) and k (Ho-Powell-Liley) tables used here
    properties:
      density:
        value: 2.3290
        unit: g/cm3
        basis: measured
        source: physrev.161.756
        locator: "journal p.757 Sec. II: pure (undoped, 150 Ohm cm n-type) sample 2.3290 +- 0.0002 g/cm3 at 25 C, hydrometric (P-doped sample 2.3297)"
        condition: "25 C; T dependence not applied"
        note: "was 2330 kg/m3 via Hopcroft 2010 p.7 Sec. XI (citing Hall); L21 2026-10-21 reads the primary"
        verified_on: 2026-10-21
      cp:
        model: table_T
        T_K: [100, 200, 298.15, 300, 400, 500, 600, 700]
        value: [258.8, 556.7, 712.1, 713.9, 788.4, 830.7, 860.0, 883.1]
        unit: J/kgK
        basis: derived
        source: janaf_si_1998
        locator: "J. Phys. Chem. Ref. Data Monograph 9 p.1881, Silicon (Si) reference-state table (crystal 0-1685 K), column Cp (J/K mol): 100 K 7.268, 200 K 15.636, 298.15 K 20.000, 300 K 20.050, 400 K 22.142, 500 K 23.330, 600 K 24.154, 700 K 24.803; A_r = 28.0855 (page header)"
        condition: "isobaric heat capacity at p = 0.1 MPa, crystal; converted per unit mass c_p = Cp / (A_r x 1e-3 kg/mol) (lane L27); linear interpolation between the tabulated nodes (Cp is concave: at 250 K the chord 200-298.15 K lies below the curve; no intermediate JANAF node)"
        note: "was N/A ('no primary Si specific-heat source read 2026-10-20'); added by L27 2026-10-21 for thermal_transient (L24 finding: every Si case failed)"
        verified_on: 2026-10-21
      k:
        model: table_T
        T_K: [200, 223.2, 250, 273.2, 298.2, 300, 323.2, 350, 373.2, 400, 473.2, 500, 573.2, 600]
        value: [2.64, 2.25, 1.91, 1.68, 1.49, 1.48, 1.33, 1.19, 1.08, 0.989, 0.814, 0.762, 0.651, 0.619]
        unit: W/cmK
        basis: measured
        source: hpl1972
        locator: "journal p.394, Thermal conductivity of silicon, recommended values (solid)"
        condition: "high-purity Si; >= 300 K recommended, +-5 % 300-1000 K; < 300 K 'merely typical values' (Remarks)"
        verified_on: 2026-10-20
      elastic:
        model: cubic
        C11: 1.6564
        C12: 0.6394
        C44: 0.7951
        unit: 1e12 dyn/cm2
        basis: measured
        source: physrev.161.756
        locator: "journal p.758 Table III column 'Present study' (pure Si, 25 C, +-0.02 %); same values in Table IV column Pure"
        condition: "25 C, adiabatic moduli (ultrasonic pulse echo, p.758 'true adiabatic elastic moduli'); T dependence not applied (Hall gives Cij(T) only 4.2-310 K: alternative cubic_T_hall1967)"
        note: "was 165.6 / 63.9 / 79.5 GPa via Hopcroft 2010 Table III (same data, rounded); L21 2026-10-21 reads the primary. Adiabatic-isothermal difference not applied. McSkimin-Andreatch (Hall Table III, ref. 17): 1.6563 / 0.6387 / 0.7955. Isotropic shortcuts are derived on request (opts.elastic)"
        verified_on: 2026-10-21
      cte:
        kind: instantaneous
        Tref_K: 293.15
        model: table_T
        T_K: [200, 220, 240, 260, 280, 293.15, 300, 325, 350, 375, 400, 450, 500, 550, 600]
        value: [1.406, 1.715, 1.986, 2.223, 2.432, 2.555, 2.618, 2.816, 2.984, 3.128, 3.251, 3.453, 3.610, 3.737, 3.844]
        unit: ppm/K
        basis: measured
        source: swenson1983
        locator: "journal p.181 Table 2, alpha' = (L20)^-1 (dL/dT); > 300 K from Eq. (1) with Table 1, <= 300 K from Lyon et al."
        condition: "evaluated recommended values; Tref = 293.15 K (dL/L20 = 0 row)"
        check:
          T_K: [200, 220, 240, 260, 280, 293.15, 300, 325, 350, 375, 400, 450, 500, 550, 600]
          dL_L_1e6: [-189.7, -158.5, -121.4, -79.3, -32.8, 0, 17.7, 85.7, 158.3, 234.7, 315, 482, 659, 843, 1033]
          locator: "journal p.181 Table 2, column dL/L20 (1e-6)"
        verified_on: 2026-10-20
      eps_r:
        model: table_T
        T_K: [150, 200, 250, 300, 350, 370]
        value: [11.50, 11.54, 11.60, 11.665, 11.73, 11.75]
        unit: "1"
        basis: measured
        source: krupka2006
        locator: "p.3 (journal p.3997) Fig. 2, dashed curve, digitized 2026-10-20 (reading uncertainty about +-0.005)"
        condition: "float-zone high-resistivity p-type Si, 6.62-11.5 GHz; 'the relative permittivity [is] independent of frequency' (p.3 text)"
        verified_on: 2026-10-20
      tan_delta:
        model: conductivity
        basis: measured
        source: krupka2006
        locator: "p.1 Eqs. (1)-(2): tan_d = tan_d_d + sigma / (omega eps0 eps_r); losses of HR-Si conductivity-dominated (abstract)"
        note: "lattice term tan_d_d not included (not given as a number for > 25 K); sigma must be set per wafer variant"
        verified_on: 2026-10-20
      sigma:
        value: N/A
        missing: "wafer resistivity is a per-part spec (standard vs HR-Si); set sigma in the case overrides"
    alternatives:
      iso_tcpmt2025_3614186:
        property: elastic
        use: sensitivity (paper isotropic Si)
        model: iso
        E: 131
        nu: 0.3
        unit: GPa
        basis: paper_model_input
        source: tcpmt.2025.3614186
        locator: "p.6 Table II row 9 Silicon Die (shear 50.38 GPa), all temperatures"
        verified_on: 2026-10-20
      iso_tcpmt2025_3538554:
        property: elastic
        use: sensitivity (paper isotropic Si)
        model: iso
        E: 170.0
        nu: 0.28
        unit: GPa
        basis: paper_model_input
        source: tcpmt.2025.3538554
        locator: "p.7 Table IV row Si"
        verified_on: 2026-10-20
      iso_nist_solder_db_t1_12:
        property: elastic
        use: sensitivity (handbook isotropic Si chip)
        model: iso
        E: 162
        nu: 0.22
        unit: GPa
        basis: handbook
        source: nist_solder_db_v4
        locator: "Table 1.12 row Silicon chip (-73, 27, 127 C all 162 GPa, nu 0.22), from Wong and Matsunaga, NEPCON West 1995"
        verified_on: 2026-10-20
      cte_ectc51529_2024_00155:
        property: cte
        use: sensitivity (paper constant Si CTE)
        kind: instantaneous
        value: 3.2
        unit: ppm/K
        basis: paper_model_input
        source: ectc51529.2024.00155
        locator: "p.3 Table IV row Silicon (CTE a1 = a2 = 3.2)"
        verified_on: 2026-10-20
      cte_ectc2011_5898527:
        property: cte
        use: sensitivity (paper constant Si CTE)
        kind: instantaneous
        value: 3
        unit: ppm/K
        basis: paper_model_input
        source: ectc.2011.5898527
        locator: "p.2 Table 2 row Si (room-temperature properties)"
        verified_on: 2026-10-20
      cte_tcpmt2025_3614186:
        property: cte
        use: sensitivity (paper constant Si CTE)
        kind: instantaneous
        value: 2.80
        unit: ppm/K
        basis: paper_model_input
        source: tcpmt.2025.3614186
        locator: "p.6 Table II row 9 Silicon Die, instantaneous CTE 2.80E-06, all temperatures"
        verified_on: 2026-10-20
      cubic_T_hall1967:
        property: elastic
        use: sensitivity (Cij(T) of pure Si, 4.2-310 K; cryogenic / -55 C studies)
        model: cubic
        C11:
          model: table_T
          T_K: [4.2, 50, 100, 150, 200, 250, 298.15, 310]
          value: [1.6754, 1.67527, 1.67417, 1.67099, 1.66654, 1.66134, 1.6564, 1.65522]
          locator: "journal p.758 Table V (4.2 K) and Table III (25 C) printed; 50-250 K and 310 K digitized 2026-10-21 from Fig. 1 (p.757, pure curve; tick-fit residual <= 8e-5, reading uncertainty about +-0.0003 x 1e12 dyn/cm2; the digitized 4.2 K and 298 K points reproduce the tables to 1e-4)"
        C12:
          model: table_T
          T_K: [4.2, 50, 100, 150, 200, 250, 298.15, 310]
          value: [0.6492, 0.64901, 0.64839, 0.64641, 0.64418, 0.64172, 0.6394, 0.63898]
          basis: derived
          locator: "4.2 K and 25 C printed (Tables V, III); other points C12 = C11 - 2 C' from Fig. 1 and Fig. 2 (p.759, C' = (C11 - C12)/2, pure curve) digitized 2026-10-21; uncertainty about +-0.0007 x 1e12 dyn/cm2"
        C44:
          model: table_T
          T_K: [4.2, 50, 100, 150, 200, 250, 298.15, 310]
          value: [0.8024, 0.80232, 0.80188, 0.80081, 0.79923, 0.79715, 0.7951, 0.79454]
          locator: "journal p.758 Table V (4.2 K) and Table III (25 C) printed; other points digitized 2026-10-21 from Fig. 3 (p.759, pure curve; reading uncertainty about +-0.0001 x 1e12 dyn/cm2)"
        unit: 1e12 dyn/cm2
        basis: measured
        source: physrev.161.756
        condition: "pure Si (150 Ohm cm n-type), adiabatic, corrected for thermal expansion (p.759); data range 4.2-310 K (refuses above 36.85 C without allowExtrapolation)"
        verified_on: 2026-10-21
      k_glassbrenner1964:
        property: k
        use: sensitivity (primary measurement; 3-6 % above the HPL 1972 recommended values at 300-600 K)
        model: table_T
        T_K: [200, 250, 300, 400, 500, 600, 700, 800]
        value: [2.66, 1.95, 1.56, 1.05, 0.80, 0.64, 0.52, 0.43]
        unit: W/cmK
        basis: measured
        source: physrev.134.a1058
        locator: "journal p.A1062 Table I, Si column ('representative values', high-purity single crystals, +-5 %); the last digit of 2.66 (200 K) is barred 'rather uncertain'"
        condition: "smoothed values; table continues to 1681 K (0.216)"
        verified_on: 2026-10-21
      cte_okada1984:
        property: cte
        use: "sensitivity (primary fit; within 0.06 ppm/K of the Swenson default at 200-600 K; secant max 0.0495, instantaneous max 0.053 at the Swenson nodes, audit A8 M5)"
        kind: instantaneous
        model: expr_T
        expr: "3.725*(1 - 2.718281828459045^(-5.88e-3*(T_K - 124))) + 5.548e-4*T_K"
        range_C: [-153.15, 1226.85]
        unit: ppm/K
        basis: measured
        source: "1.333965"
        locator: "journal p.318 Eq. (5): alpha(t) = (3.725{1 - exp[-5.88e-3 (t - 124)]} + 5.548e-4 t) x 1e-6 /K, t in K; p.320: applicable 120-1500 K; p.319 Table IV calculated column (2.55 at 298.2 K, 3.59 at 500 K) reproduced"
        condition: "X-ray lattice parameter of FZ and CZ Si, measured 300-1500 K; fit agrees with Lyon et al. within +-1e-7 /K above about 120 K (p.320); exp written as 2.718281828459045^x (expression grammar has no exp)"
        verified_on: 2026-10-21
      k_ectc51687_2025_00085:
        property: k
        use: sensitivity (paper linear k(T) model for SoC / HBM dies)
        model: linear_T
        a: 117.5
        b: -0.42
        T0_C: 100
        range_C: [20, 105]
        unit: W/mK
        basis: paper_model_input
        source: ectc51687.2025.00085
        locator: "p.3 Table 3 rows SoC die and HBM die: k = 117.5 - 0.42 x (T[C] - 100)"
        note: "range_C = span of that paper's thermal model (inlet 20 C, max Tj 104.7 C, Table 4); the paper states no validity range"
        verified_on: 2026-10-20
    missing:
      - "cp: no source read"
      - "Cij(T) above 310 K: Hall 1967 measures 4.2-310 K only (alternative cubic_T_hall1967); Bourgeois coefficients (Hopcroft Table IV, p.6) not applied, reference temperature of the polynomial not printed in Hopcroft"
      - "k and alpha defaults stay on the evaluated compilations (HPL 1972, Swenson 1983); Glassbrenner-Slack 1964 k(T) and Okada-Tokumaru 1984 alpha(T) are alternatives (L21 2026-10-21)"

  si_hr:
    inherits: si_crystal
    description: high-resistivity float-zone Si (EM variant of si_crystal; mechanical and thermal data inherited)
    class: semiconductor
    tier: "1"
    status: partial
    valid_T_C: [-73.15, 326.85]
    properties:
      tan_delta:
        value: 0.001866
        f_GHz: 6.685
        range_C: [20, 30]
        unit: "1"
        basis: measured
        source: krupka2006
        locator: "p.3 (journal p.3997) Table I row TE011, 6.685 GHz, sample #1 (d = 15.455 mm)"
        condition: "room-temperature measurement (temperature not stated more precisely; range_C 20-30 C is this lane's reading of 'room temperature'); sample resistivity not stated in the text; losses rise above 310 K (p.4)"
        verified_on: 2026-10-20
    alternatives:
      tan_delta_he111:
        property: tan_delta
        use: sensitivity (second mode, same sample)
        value: 0.001901
        f_GHz: 6.797
        range_C: [20, 30]
        unit: "1"
        basis: measured
        source: krupka2006
        locator: "p.3 Table I row HE111, 6.797 GHz"
        verified_on: 2026-10-20
    missing:
      - "resistivity of the Krupka samples not stated in the text; HR-Si vendor resistivity spec (Okmetic) not read"
