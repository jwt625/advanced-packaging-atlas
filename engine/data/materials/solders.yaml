    class: solder
    tier: "1"
    status: partial
    valid_T_C: [-55, 138]   # solidus of Sn-58Bi 138 C (NIST DB Table 2.2.19)
    properties:
      elastic: {model: iso, E: 11.9, nu: 0.35, unit: GPa, basis: paper_model_input, source: tcpmt.2025.3538554, locator: "p.7 Table V row SnBi (Bi: 52 %): E 11.9 GPa, nu 0.35, alpha 14.0 ppm/C", verified_on: 2026-10-20}
      cte: {kind: instantaneous, value: 14.0, unit: ppm/K, basis: paper_model_input, source: tcpmt.2025.3538554, locator: "p.7 Table V row SnBi (Bi: 52 %)", verified_on: 2026-10-20}
      k: {value: 61, unit: W/mK, basis: template, analog_of: "sac305 (Indalloy 256, Sn-based solder)", source: indium_pds_100346, locator: "p.1 properties table: thermal conductivity 61 W/mK", sensitivity: {property: k, delta: {factor: [0.5, 2]}}, note: "no Sn-Bi k read", verified_on: 2026-10-20}
    alternatives:
      cte_nist_sn58bi: {property: cte, use: sensitivity (handbook Sn-58Bi at 20 C), kind: instantaneous, value: 15, unit: ppm/K, basis: handbook, source: nist_solder_db_v4, locator: "Table 2.2.19 row Sn-58Bi: Tsol 138 C, CTE (20 C) 1.5 (x 1e-5 /C); resistivity 30-35 uOhm cm (Glazer 1994 as cited)", verified_on: 2026-10-20}
