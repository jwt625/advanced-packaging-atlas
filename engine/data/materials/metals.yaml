      k: {value: 26.1, unit: W/mK, basis: datasheet, source: combmet_430, locator: "p.1 Physical properties at 20 C: thermal conductivity 26.1 W/m-K", condition: "20 C; T dependence not applied", verified_on: 2026-10-20}
      elastic:
        model: iso
        E: {value: 200, unit: GPa, basis: datasheet, source: combmet_430, locator: "p.1 Physical properties at 20 C: modulus of elasticity 200 x 10^3 MPa (29 x 10^3 ksi)", condition: "20 C; T dependence not applied", verified_on: 2026-10-20}
        nu: {value: 0.290, basis: template, analog_of: "ss304 (another stainless grade; Ledbetter 1980, 295 K)", source: ledbetter1980_ss, locator: "NBSIR 80-1627 report p.131 Table 1, Stainless 304, 295 K: nu 0.290", sensitivity: {property: nu, delta: {abs: 0.05}}, note: "no 430 Poisson ratio in a readable source (TotalMateria entry paywalled)", verified_on: 2026-10-20}
      cte:
        kind: instantaneous
        value: 11
        unit: ppm/K
        basis: paper_model_input
        source: ectc51687.2025.00027
        locator: "p.3 Sec. III.A text: 'SUS430 (CTE: 11 ppm/C)'"
        verified_on: 2026-10-20
      sigma: {value: 60, quantity: resistivity, unit: uohm cm, basis: datasheet, source: combmet_430, locator: "p.1 Physical properties at 20 C: electrical resistivity 60 uOhm cm", verified_on: 2026-10-20}
    alternatives:
      cte_combmet_20_300: {property: cte, use: sensitivity (datasheet mean 20-300 C), kind: secant, Tref_C: 20, value: 10.4, range_C: [20, 300], unit: ppm/K, basis: datasheet, source: combmet_430, locator: "p.1 coefficient of expansion 10.4 um/m-C (20-300 C)", verified_on: 2026-10-20}
    assumptions:
      - {id: paper_cte_default, text: "default CTE = the 11 ppm/C used by the 120 mm package papers (ectc51687.2025.00027); datasheet 20-300 C mean 10.4 is the alternative"}
    missing: ["Poisson ratio (template analog of 304)", "E(T)", "the datasheet states its values are 'for reference only', 'not intended for engineering or design'"]

