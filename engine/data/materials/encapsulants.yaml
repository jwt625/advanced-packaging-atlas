          log10_E_GPa: [-1.0075, -1.0075, -1.0032, -1.0032, -1.0032, -0.9993, -0.9950, -0.9950, -0.9869, -0.9830, -0.9830, -0.9830, -0.9788, -0.9706, -0.9500, -0.9500, -0.9582, -0.9419, -0.9419, -0.9299, -0.9462, -0.8888, -0.8845, -0.9051, -0.8763, -0.8725, -0.8313, -0.8275, -0.7743, -0.7743, -0.7495, -0.7006, -0.6925, -0.6145, -0.5982, -0.5776, -0.5163, -0.4837, -0.4224, -0.3445, -0.2832, -0.2913, -0.2133, -0.1931, -0.0701, -0.0418, 0.0318, 0.0811, 0.0936, 0.1424, 0.2449, 0.2654, 0.3224, 0.3387, 0.4086, 0.4210, 0.4699, 0.5230, 0.5191, 0.5354, 0.6010, 0.6130, 0.6091, 0.6379, 0.6542, 0.6662, 0.6867, 0.6949, 0.6992, 0.7154, 0.7116, 0.7317, 0.7360, 0.7317, 0.7441, 0.7523, 0.7604, 0.7604, 0.7604, 0.7729, 0.7767, 0.7810, 0.7849, 0.7849, 0.7892, 0.7973, 0.8016, 0.8016, 0.8054, 0.8054]
