      xilinx_c4uf_cte: {property: cte, use: sensitivity (Xilinx C4 UF, room temperature), kind: instantaneous, value: 32, unit: ppm/K, basis: paper_model_input, source: ectc.2011.5898527, locator: "p.2 Table 2 row C4 UF (CTE 32 ppm)", verified_on: 2026-10-20}
    missing: ["k, cure shrinkage inherited from underfill_cuf (k is a template analog there)", "Tg method not stated"]
