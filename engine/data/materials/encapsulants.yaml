        locator: "p.87 Fig. 11(b) storage-modulus master curve of the filled EMC (Tref 120 C; DMA tension 0.32-32 Hz, 20-200 C, p.87 Sec. 2.4); p.88 Table 6 row Filled (C1 11.1, C2 56.6, Tg^DMA 126.4 C, H 401 kJ/mol, T0 200.5, Tc 90 C) and Eqs. (9)-(10); p.87 Table 5 row Filled (glassy 7239 MPa, rubbery 108.3 MPa, 1 Hz)"
