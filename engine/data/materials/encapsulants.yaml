      ncp_b_cte: {property: cte, use: sensitivity (NCP-B, acryl base), kind: instantaneous, value: 40, unit: ppm/K, basis: paper_model_input, source: ectc51906.2022.00106, locator: "p.2 Table I column NCP-B (acryl, filler 60 wt %, CTE 40, modulus 7 GPa)", verified_on: 2026-10-20}
