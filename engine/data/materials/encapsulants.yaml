    assumptions:
      - {id: single_paper_set, text: "default E (below Tg), CTE and Tg = one paper row (ectc51529.2024.00155 Bottom CUF); Xilinx C4 UF (ectc.2011.5898527) is the alternative"}
      - {id: above_tg_modulus_inherited, text: "the source gives one modulus; the above-Tg modulus is inherited from underfill_cuf (ectc51909.2023.00155 E2 100 MPa)"}
    properties:
      tg: {value: 160, unit: C, method: not_stated, basis: paper_model_input, source: ectc51529.2024.00155, locator: "p.3 Table IV row Bottom CUF: Tg 160 C (same in ectc51687.2025.00027 p.3 Table IV)", verified_on: 2026-10-20}
      elastic:
        model: iso
        E: {model: bilinear_tg, below: 6.9, above: 0.1, unit: GPa, basis: paper_model_input, source: [ectc51529.2024.00155, ectc51909.2023.00155], locator: "below Tg: ectc51529.2024.00155 p.3 Table IV row Bottom CUF, modulus 6.9 GPa; above Tg: inherited from underfill_cuf, ectc51909.2023.00155 p.3 Table 8 CUF E2 100 MPa", inherited_from: "underfill_cuf (above-Tg value only)", verified_on: 2026-10-20}
