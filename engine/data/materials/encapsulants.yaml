      - {id: single_paper_set, text: "default set = one paper table (ectc51906.2022.00106 Table I, citing its ref [3]); NCP-A / NCP-B are alternatives"}
    properties:
      elastic:
        model: iso
        E: {value: 10, unit: GPa, basis: paper_model_input, source: ectc51906.2022.00106, locator: "p.2 Table I column NCP-C (epoxy, filler 60 wt %, Tg (DMA) > 170 C, CTE 30 ppm, modulus 10 GPa), citing its ref [3]", condition: "temperature not stated; T dependence not applied", verified_on: 2026-10-20}
        nu: {value: 0.29, basis: template, analog_of: "underfill (tcpmt.2025.3614186 bump underfill nu 0.29)", source: tcpmt.2025.3614186, locator: "p.6 Table II row 6 Bump Underfill: nu 0.29", sensitivity: {property: nu, delta: {abs: 0.05}}, verified_on: 2026-10-20}
      cte: {kind: instantaneous, value: 30, unit: ppm/K, basis: paper_model_input, source: ectc51906.2022.00106, locator: "p.2 Table I column NCP-C: CTE 30 ppm", verified_on: 2026-10-20}
      k: {value: 0.95, unit: W/mK, basis: template, analog_of: "Panasonic CV8710U (silica-filled epoxy molding compound)", source: panasonic_cv8710, locator: "p.2 table, CV8710U thermal conductivity 0.95 W/mK, hot wire, 25 C", sensitivity: {property: k, delta: {factor: [0.5, 2]}}, verified_on: 2026-10-20}
    alternatives:
