      viscoelastic:
        status: tier2_data
        model: prony_proportional
        analog_of: "model EMC of Sadeghinia 2012 (j.ijadhadh.2011.10.007: EPN 1180 + BPA + 50 vol% fused silica; Prony E0 6.431 GPa, 1 Hz glassy storage modulus 7239 MPa, Tg(E'') 112.5 C), not the default emc grade (ectc51909.2023.00155: E 18000 / 400 MPa below / above Tg 140 C); any scaling to the default grade is a consumer assumption (audit A8 M9)"
        modulus: "tensile (elongation) relaxation modulus E(t) = E0 (g_inf + sum g_i exp(-t / tau_i)), proportional relaxation (constant nu): the form of engine/src/mech/viscoelastic.mjs"
        material: "model EMC of the source: epoxy Novolac EPN 1180 + Bisphenol-A + 64.5 wt% (50 vol%) fused silica FB-940, fully cured (p.83 Sec. 2.1); analog for the generic emc entry, not the grade of its E / CTE default"
        Tref_C: 120
        E0_GPa: 6.431
        E_inf_GPa: 0.097481
        g_inf: 0.0151579
        prony:
          - {g: 0.011974, tau_s: 1e-13, E_GPa: 0.077005}
          - {g: 0.00492684, tau_s: 1e-12, E_GPa: 0.031685}
          - {g: 0.033703, tau_s: 1e-11, E_GPa: 0.21675}
          - {g: 0.00446061, tau_s: 1e-10, E_GPa: 0.028686}
          - {g: 0.0181409, tau_s: 1e-09, E_GPa: 0.11667}
          - {g: 0.0341616, tau_s: 1e-08, E_GPa: 0.21969}
          - {g: 0.0233519, tau_s: 1e-07, E_GPa: 0.15018}
          - {g: 0.0515774, tau_s: 1e-06, E_GPa: 0.3317}
          - {g: 0.0684322, tau_s: 1e-05, E_GPa: 0.44009}
          - {g: 0.148799, tau_s: 0.0001, E_GPa: 0.95694}
          - {g: 0.245753, tau_s: 0.001, E_GPa: 1.5804}
          - {g: 0.217995, tau_s: 0.01, E_GPa: 1.4019}
          - {g: 0.0921681, tau_s: 0.1, E_GPa: 0.59274}
          - {g: 0.0236602, tau_s: 1, E_GPa: 0.15216}
          - {g: 0.00461497, tau_s: 10, E_GPa: 0.029679}
          - {g: 0.000776202, tau_s: 100, E_GPa: 0.0049918}
          - {g: 0.000346961, tau_s: 1000, E_GPa: 0.0022313}
        shift:
          type: piecewise
          Tc_C: 90
          below: {type: arrhenius, Ea_J_mol: 401450.7, Tref_C: 200.5}
          above: {type: wlf, C1: 11.1, C2_K: 56.6, Tref_C: 120}
          convention: "engine form (mech/viscoelastic.mjs shiftFactor): log10 a_T = -C1 (T - Tref) / (C2 + T - Tref), ln a_T = Ea / R (1/T - 1/Tref), reduced time dxi = dt / a_T. The source prints the reciprocal factor (p.88 Eqs. 9-10: log a_T = +C1 (T - Tref) / (C2 + T - Tref) above Tc and log a_T = -H / (2.30 R) (1/T - 1/T0) below Tc; Fig. 12 rises with T). Ea = H ln(10) / 2.30 = 401000 x 1.0011240 = 401450.7 J/mol (was stored rounded as 401448, relative 6.7e-6; audit A8 M2 quoted 401449.8, recomputed by L27 2026-10-21 as 401450.7)"
          source_values: {C1: 11.1, C2: 56.6, Tref_C: 120, Tg_DMA_C: 126.4, H_kJ_mol: 401, T0: 200.5, T0_unit_printed: K, Tc_C: 90}
          note: "T0 is printed under the header 'T0 (K)' but Fig. 12(b) is reproduced only with T0 in C (473.65 K): at 60 / 80 C the model gives log a_T (source form) -18.67 / -15.11 vs -18.63 / -14.91 read from the Fig. 12 vector curve (+5 display offset removed); with 200.5 K the 60 C value would be +41.6 (+45.2 at 80 C; Eq. 9 with H 401 kJ/mol, R 8.314 J/mol K; corrected from 'about +71' per audit A8 M1). The branches are not continuous at Tc (Arrhenius -13.47, WLF -12.52 decades at 90 C, source form). Source defect 4 (found by audit A8 M3 from the Fig. 12 vector data, not re-checked by L27): the Fig. 12 line styles are swapped against the legend; the dotted line labelled WLF fit is the Arrhenius curve (low-T branch, equals Eq. 9 at 24.9 C) and the dash-dot line labelled Arrhenius fit is the WLF curve (high-T branch, equals Eq. 10 at 85 C, diverging toward its 63.4 C singularity); no data impact (the red shift-factor curve and Table 6 were used). Engine shiftFactor supports wlf | arrhenius only: piecewise is pending (viscoelastic engine lane, L27 Part C not started this round)"
        fit:
          method: "Prony series fitted by lane L21 to the storage-modulus master curve: E'(w) = E_inf + sum E_i (w tau_i)^2 / (1 + (w tau_i)^2), tau_i = 1e-13 .. 1e3 s one per decade, non-negative least squares on relative residuals; zero terms dropped; g_i = E_i / E0, E0 = E_inf + sum E_i"
          residual: "max 7.8 %, rms 2.2 % over the 90 master-curve points (largest in the transition, where the shifted isotherms scatter)"
          range_log10_omega_rad_s: [-3.256, 13.034]
        master_curve:
          note: "Fig. 11(b) markers of the shifted isotherms (vector data; the unshifted isotherm points at the six measured frequencies 10^0.31-10^2.57 rad/s excluded), axis calibration from the plot ticks, placement uncertainty < 0.01 decade"
