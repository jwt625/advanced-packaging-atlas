schema: ap-sim-val/0
id: A/TA2-interface-R
tier: A
title: TA1 plus a contact resistance at the TIM / Cu interface
status: unvalidated
physics: [thermal_stationary]
box_compatible: true
tests: [thin-layer / interface resistance element, temperature jump at an interface]
inputs:
  base: A/TA1-multilayer-R     # all TA1 inputs, plus:
  physics:
    thermal:
      bcs_add:
        - {selection: "interface:tim|cu", type: contact_resistance, R_m2K_W: 1.0e-5}   # R = 0.1 K/W over 1e-4 m2
  studies: [{id: s1, type: thermal_stationary}]
expected:
  - {quantity: T_bottom_C, value: 155.365, unit: C, tolerance: {rel_rise: 1.0e-3}, script_key: TA2.T_bottom_C}
  - {quantity: jump_K, definition: "T(tim side) - T(cu side) at the interface", value: 10.0, unit: K, tolerance: {rel: 1.0e-3},
     script_key: TA2.jump_K}
  - {quantity: R_tot_K_W, value: 1.30365, unit: K/W, tolerance: {rel: 1.0e-3}, script_key: TA2.R_tot_K_W}
formula: "jump = R_c'' q''; q'' = 1e6 W/m2, R_c'' = 1e-5 m2K/W"
provenance:
  formula: "R6 section 1.2 TA2"
  values: "validation/expected/tier_a.py ta1(rc=1e-5)"
  use: "same mechanism as the TIM1 contact-resistance sweep in ectc51687.2025.00085-d (CoWoS-R calibration)"
missing: []
assumptions:
  - "Selection `interface:<a>|<b>` and BC type `contact_resistance` are not in SPEC v0 (contract-change request L4-1). Fallback: a 1 um box of k = t / R_c'' = 0.1 W/mK between tim and cu gives the same jump to O(1e-4)."
