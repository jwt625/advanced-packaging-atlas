  - "power for the Table 3 / Table 5 tests (not stated)"
  - "vapor-chamber heat-sink model (TV -b): dimensions and ThetaCA not given"
assumptions:
  - "Cold plate as fixed temperature or high HTC on the lid top; ThetaJC independent of power (linear model)."
