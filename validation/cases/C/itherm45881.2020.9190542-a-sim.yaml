derived:   # validation/expected/derived_checks.py
  - {quantity: superposition, rule: "Tj_i = Tamb + sum_j R_ij P_j with R11 = R22 = 0.1676, R12 = R21 = 0.0681 K/W fits all 14 cases of TV -b within 0.06 C",
     metric_ids: "itherm45881.2020.9190542-b-m1 .. -b-m42", status: pass,
     use: "engine gate: the influence matrix from two single-die runs must predict the multi-die cases to the same precision (linear conduction)"}
  - {quantity: ThetaJC_BLT_slope_C_W_per_m, value: 375, rule: ">= 235 (1D bound 1 / (k A_dies), k 6 W/mK, A_dies 707.85 mm2)", status: pass,
     reading: "Tj is a maximum, so the BLT term weighs the hot region: A_eff 444 mm2 < die area"}
observations:
  - "TIM-type sweep vs BLT sweep: a 1D TIM term predicts dTheta(3.2 -> 6.0 W/mK, 60 um) = 0.0124 C/W, but Table 5 shows 0.003 (sim) / 0.002 (test), while the BLT sweep is 1.6x above the 1D term. The TIM rows likely include interface / coverage effects (coverage 90-98 %, rows a-m13..m15) that the paper does not quantify. Use the TIM-type rows as rank-order targets (A > B > C ~ D), not absolute, until resolved (L4 inference, 2026-10-20)."
