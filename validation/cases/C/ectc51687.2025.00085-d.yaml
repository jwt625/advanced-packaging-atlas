derived:   # validation/expected/derived_checks.py cowos_r()
  - {quantity: dRjc_dBLT_C_W_per_m, value: 5.725, method: "least squares over d-m4, -m6, -m8, -m10"}
  - {quantity: A_eff_mm2, value: 2031, rule: "range [1331, 2685]", method: "1 / (k_In 86 W/mK x slope)",
     reading: "between the 4 SoC die areas (1331 mm2) and the TIM1 model area (2685 mm2): the BLT term spreads beyond the dies. An engine run must land in the same window; outside it means a wrong TIM area or lateral spreading in the lid / TIM."}
  - {quantity: Rjc_linear_in_contact_R, rule: "d-m12..m18 linear in normalized R_c within 5 %", value: "slopes 0.00318 / 0.00318 / 0.00333 C/W per unit normalized R_c over the 0-0.33 / 0.33-0.67 / 0.67-1 steps", status: pass}
