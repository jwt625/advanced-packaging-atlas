title: Chip-last FOPLP - EMC-molded strip warpage after transfer to a second glass carrier (0.7 mm)
status: untestable
untestable_reason: >-
  The measured object is the strip bonded to a second glass carrier: the strip was transferred to that carrier and
  the first one removed (p.6 Sec. III.E). The sim case models a free strip, and carrier thickness and bond layer are
  not stated. The free-strip linear result is 12.6 mm (sag / thickness 28.5, far beyond the about 0.5 limit of
  small-deflection theory), so a free large thin strip also needs geometric nonlinearity (lane L9).
