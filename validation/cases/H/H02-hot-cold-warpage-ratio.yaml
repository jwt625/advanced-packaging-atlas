schema: ap-sim-val/0
id: H/H02-hot-cold-warpage-ratio
tier: H
title: 'Ratio |w(HT)| / |w(RT)| for lidded / ring 2.5D packages with a sign flip [weak: 2 papers]'
status: unvalidated
physics:
- thermo_elastic
strength: weak
scope_package_classes:
- si_interposer_2p5d (Amkor TSV 2.5D legs)
- si_bridge_fanout (CoWoS-L_6x TV_1.6x lid, TV_4.8x ring)
applies_to:
- cowos_s/warpage_corner_stress (Amkor-like lid / stiffener legs)
- cowos_l/warpage_rt_ht (lid vs ring variants)
rule:
  type: ratio_range_per_class
  expr: 'Amkor-type lidded / stiffened TSV 2.5D: |w_HT| / |w_RT| in [0.75, 1.0]; CoWoS-L_6x: ratio(TV_1.6x lid) > 1 > ratio(TV_4.8x ring)'
  observed: 'Amkor legs 1-7: 0.819-0.938 (7 FEM pairs, one paper); 00091-a 2.31 (lid), 00091-b 0.575 (ring) (one paper)'
  strength: weak
  requires_shape_class:
  - dome
  - bowl
  shape_class_note: warpage result field shape_class (L8, being added; L9 proposal dome | bowl | W | saddle); for W or saddle shapes the rule
    is reported, not gated
fails_if: Amkor-like variant outside [0.75, 1.0] (observed band 0.82-0.94 widened by about 0.07 on each side for figure-read bars), or the CoWoS-L
  lid variant ratio <= 1, or the ring variant ratio >= 1
n_papers: 2
