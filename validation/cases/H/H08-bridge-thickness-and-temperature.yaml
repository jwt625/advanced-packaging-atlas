- bridge-die sub-model (a bare Si bridge die with TSV, 47-65 um); cowos_l LSI dies are the closest canonical analogue; not emib_t (bridge embedded
  in the substrate)
rule:
  type: monotonic
  expr: w decreasing in bridge thickness at each T; w increasing in T at each thickness
  strength: weak
fails_if: w increases with bridge thickness at any T, or w decreases with T at any thickness
n_papers: 1
