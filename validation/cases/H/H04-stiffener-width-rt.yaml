id: H/H04-stiffener-width-rt
tier: H
title: RT warpage decreases monotonically with stiffener width; no consistent width trend at reflow
status: unvalidated
physics:
- thermo_elastic
strength: moderate
scope_package_classes:
- organic_substrate FCBGA (ectc51529.2024.00265)
- si_interposer_2p5d (estc60143.2024.10712129; JOINT2 2024 FEM at 260 C)
applies_to:
- fcbga_organic/substrate_warpage (stiffener width sweep)
- si_interposer_peers/120mm_warpage (stiffener footprint sweep)
rule:
  type: monotonic
  expr: 'w_RT strictly decreasing in stiffener width per series; at HT: no gate (direction not consistent across papers)'
  strength: moderate
fails_if: w_RT does not decrease between two adjacent widths of a series (any increase fails); HT width trends are not gated
