notes:
- Graphite film (bulk k > 20 W/mK, thickness direction) ranks worse than liquid-metal gel (> 6 W/mK) in CoWoS-R; a model with bulk k only would
  invert that pair. Expected failure mode of a k-only TIM model, recorded so it is not mistaken for a solver bug.
- InFO_oS gel 3.2 -> 6.0 W/mK changes ThetaJC by 0.002-0.003 C/W, about 4-6x less than a 1D TIM term predicts (see C/itherm45881.2020.9190542-a-sim
  observations).
