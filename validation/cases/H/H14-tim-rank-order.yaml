schema: ap-sim-val/0
id: H/H14-tim-rank-order
tier: H
title: TIM rank order is not set by bulk k alone across TIM families
status: unvalidated
physics:
- thermal_stationary
strength: moderate
scope_package_classes:
- organic_rdl_interposer (CoWoS-R, InFO_oS)
applies_to:
- cowos_r/thermal_rjc
- info_os/theta_jc_tim
rule:
  type: rank_order
  expr: 'CoWoS-R: R(indium) < R(LM gel) < R(graphite film); InFO_oS: R(film 25/30) < R(gel 6) <= R(gel 3.2)'
  strength: moderate
fails_if: 'in a model with TIM interface resistance: R(indium) >= R(LM gel) or R(LM gel) >= R(graphite) (CoWoS-R), or R(film) >= R(gel 6) (InFO_oS).
  A bulk-k-only TIM model is expected to invert graphite vs LM gel and is not gated'
n_papers: 2
