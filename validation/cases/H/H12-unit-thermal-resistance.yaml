schema: ap-sim-val/0
id: H/H12-unit-thermal-resistance
tier: H
title: Area-normalized junction-to-case / -coolant resistance of liquid-cooled or cold-plate-tested packages is 10-50 C-mm2/W
status: unvalidated
physics:
- thermal_stationary
strength: moderate
scope_package_classes:
- organic_rdl_interposer (CoWoS-R, InFO_oS)
- hybrid_bonded_3d laminate specimen
- wafer_scale cooler
- microjet test chip
applies_to:
- cowos_r/thermal_rjc
- info_os/theta_jc_tim
- soic/thermal_stack
rule:
  type: order_of_magnitude
  expr: R'' = R x heated area in [10, 50] C-mm2/W
  derived: CoWoS-R 0.0108 C/W x 1331 mm2 (4 SoC) = 14.4; InFO_oS 0.021-0.065 C/W x 707.85 mm2 (2 dies) = 14.9-46.0 (L4 arithmetic; heated area
    = die area, an assumption)
  strength: moderate
fails_if: R x heated area outside [10, 50] C-mm2/W (one decade around the observed 10.8-46)
n_papers: 5
