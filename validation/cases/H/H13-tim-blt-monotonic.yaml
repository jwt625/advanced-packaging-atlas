rule:
  type: monotonic
  expr: R strictly increasing in BLT; dR/dBLT >= 1 / (k_TIM A_heated)
  strength: moderate
fails_if: R does not increase with BLT, or dR/dBLT < 1 / (k_TIM A_heated) with A_heated = total heated die area
