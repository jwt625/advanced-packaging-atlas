schema: ap-sim-val/0
id: H/H01-warpage-sign-flip-rt-ht
tier: H
title: Warpage sign flips between RT and reflow temperature for lidded / ring-stiffened 2.5D packages
status: unvalidated
physics:
- thermo_elastic
strength: moderate
scope_package_classes:
- si_bridge_fanout (CoWoS-L_6x MTVs, lid and ring)
- si_interposer_2p5d (Amkor TSV 2.5D, lid / stiffener legs; estc60143 unstiffened)
applies_to:
- cowos_l/warpage_rt_ht (lid and ring variants)
- cowos_s/warpage_corner_stress (lid / stiffener variants)
rule:
  type: sign_flip
  expr: sign(w(25-30 C)) != sign(w(240-260 C)) for each support pair
  strength: moderate
  requires_shape_class:
  - dome
  - bowl
  shape_class_note: warpage result field shape_class (L8, being added; L9 proposal dome | bowl | W | saddle); for W or saddle shapes the rule
    is reported, not gated
fails_if: a sim variant mapped to a support pair returns the same sign at RT (25-30 C) and HT (240-260 C), compared in that paper's own sign convention
n_papers: 3
