notes:
- 'Pairs: 00091-a (TV_1.6x with lid) 64 / -148 um and 00091-b (TV_4.8x with stiffener ring 18-12-2 mm) 186 / -107 um (CoWoS-L_6x mechanical TVs,
  measured; -b confirmed on p.4 Fig. 7(c)); Amkor TSV 2.5D legs 1-7 (simulated, HT temperature not stated); estc60143 no-stiffener reference 850
  / -960 um.'
- 'Not universal: the same estc60143 package with a 1-2 mm stiffener keeps its sign (565 / 490 um), and the Si-bridge fan-out 00073-a stays negative
  (-164 / -86 um). A sim of a stiffened variant that flips is not an error per se; the rule gates only the variants that map to the support pairs.'
- 'Sign conventions differ per paper (00091: ''as labeled'', convention not stated; Amkor: cry +, smile -; estc60143: + convex icon). The rule
  compares signs within one paper, so the convention cancels.'
