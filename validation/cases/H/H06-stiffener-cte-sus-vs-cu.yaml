notes:
- 'Counter-example (Amkor TSV 2.5D FEM, p.4 Table II / Fig. 9): leg 7 ''Stiffener (SUS 430)'' gives 172 / -159 um vs leg 3 ''Stiffener'' (material
  not stated in Table II) 110 / -101 um, i.e. larger at both RT and HT. If leg 3 is Cu, this contradicts the JOINT2 direction; the rule is therefore
  gated only on the JOINT2 cases (si_interposer_peers/120mm_warpage) until the leg-3 material is known (L4 self-check, 2026-10-20).'
- 'JOINT2 2024 (moire, 28 x 30 mm, substrate A): SUS430 485 / -85 um vs Cu -330 / 770 um at 30 / 243 C; JOINT2 2025 coplanarity (size S): SUS430
  696 / 71 um vs Cu 396 / 462 um at 30 / 195 C.'
- 'Two papers from the same consortium (JOINT2): related builds, not fully independent.'
