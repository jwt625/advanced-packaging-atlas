id: H/H05-stiffener-thickness-rt
tier: H
title: RT warpage decreases with lid / stiffener thickness
status: unvalidated
physics:
- thermo_elastic
strength: moderate
scope_package_classes:
- si_interposer_2p5d (estc60143.2024.10712129, ectc51906.2022.00108, ectc.2011.5898527 sim)
applies_to:
- si_interposer_peers/xilinx_tsv_lid (lid thickness 1.0 / 1.5 mm)
- cowos_s/warpage_corner_stress (stiffener thickness)
rule:
  type: monotonic
  expr: w_RT decreasing in lid / stiffener thickness per series
  strength: moderate
fails_if: w_RT increases by more than 5 um when lid / stiffener thickness increases (5 um covers the 1 um 0.7 / 1 mm pair of 00108)
n_papers: 3
