schema: ap-sim-val/0
id: H/H03-stiffener-vs-none
tier: H
title: A lid or stiffener reduces RT package warpage to 0.4-0.75 of the unstiffened value
status: unvalidated
physics:
- thermo_elastic
strength: moderate
scope_package_classes:
- organic_substrate FCBGA (ectc51529.2024.00265)
- si_interposer_2p5d (estc60143.2024.10712129, ectc.2011.5898527 sim, ectc51906.2022.00108)
applies_to:
- fcbga_organic/substrate_warpage vs fcbga_organic/substrate_warpage_bare
- si_interposer_peers/xilinx_tsv_lid (lid vs no lid)
- cowos_s/warpage_corner_stress (stiffener vs none)
rule:
  type: ratio_range
  expr: w_RT(with lid or stiffener) / w_RT(none) in [0.40, 0.75]
  observed: 'ectc51529.2024.00265: 525-612 / 1035 = 0.51-0.59; estc60143.2024.10712129: 345-565 / 850 = 0.41-0.66; ectc.2011.5898527 (sim): 162.56
    / 335.28 = 0.485; ectc51906.2022.00108: 203-294 / 400 = 0.51-0.74 (no-stiffener basis unspecified)'
  strength: moderate
fails_if: w_RT(with) / w_RT(none) < 0.40 or > 0.75 for a matched pair of variants
n_papers: 4
