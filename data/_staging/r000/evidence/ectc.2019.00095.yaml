excluded:
  - "more than 20 Tbps memory bandwidth (attributed to ref [13])"
  - "SoIC+ roadmap point (~1 um pitch, ~1E6 counts/mm2, Fig. 5): future generation, not a built TV"
  - "Fig. 5 flip chip point (~130 um pitch, ~58 counts/mm2): generic industry reference, no TV"
  - "Fig. 3(d) multi-tier microbump stacks (4 and 10 tiers): comparison photo of typical 3DIC, no data"
  - "Fig. 1 partition concepts and Fig. 4 CoWoS/InFO_PoP concept schematics (DRAM, HBM, interposer): concept drawings, not described as built"
  - "prior TSV logic-on-logic and wide I/O memory-on-logic work [3-5]"
not_reported:
  - die sizes, thicknesses, process nodes, number of tiers in the InFO_PoP TV
  - SoIC bond metallurgy, dielectric, pad size, bonding method, temperature, anneal, alignment
  - TSV and TDV diameter, depth, pitch, keep-out zone
  - InFO_PoP RDL, mold, package size and thickness
  - stack_layers (no layer stack disclosed)
  - absolute R, L, C, energy pJ/bit, thermal resistance (only normalized ratios)
  - EM, SM, Vbd stress conditions and n_samples; Table 1 n_samples
  - protocol, lane rate, bandwidth of any D2D link
  - optical_interfaces
