figure_reading_method: >-
  Fig. 5, Fig. 6 and Fig. 9 cropped from the 150 dpi page renders and upscaled 3x; values read by pixel calibration
  against axis ticks (Fig. 5 and Fig. 6 log axes, about 106 and 159 px per decade in the upscaled crops). Bar-chart
  ratios (Figs. 7, 10, 11) taken from the printed labels, not bar heights.
