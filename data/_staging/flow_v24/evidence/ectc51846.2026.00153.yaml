judgment_calls:
  - "Six TVs: each EMC type/thickness, chip presence, panel size and the panel-to-panel coupon is a distinct stack."
  - "Glass carrier metal (light-to-heat) layer added to stacks from the Fig. 1 mechanism schematic; the text calls the coupon a three-layer structure."
  - "Chip bonding step kept with performed=no for EMC-only coupons; pressure-oven cure left blank (not stated whether applied without chips)."
  - "fan_out_panel class for chip-first coupons is an inference (paper: 'simplified assessment assuming chip-first assembly')."
  - "buckets add organic_rdl_fanout because the coupons emulate chip-first FO-PLP; primary_bucket panel kept."
