figure_reading_method: >-
  Fig. 3 re-cropped at 300 dpi; coplanarity values from colour-pixel marker centroids against the plot frame
  (800 um = 439 px), +/-15 um where markers overlap; categories are 30-100 C in 10 C steps then 105-200 C in 5 C steps (28 points).
  SUS430_M markers at 195 C overlap SUS430_L/S lines and were not entered. Fig. 2(c) bar data labels read directly.
  Tables I, II, III, IV, V, VI read from page renders; match text.md.
