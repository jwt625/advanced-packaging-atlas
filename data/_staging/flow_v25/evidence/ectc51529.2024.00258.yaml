figure_reading_method: >-
  400 dpi re-crops of Fig. 3, 4, 11, 12-17. Fig. 4 markers read against 25 um gridlines (+/-3 um). Linear resistance
  axes (Fig. 12, 14, 16) read at about 3.5 px/ohm (+/-2 ohm). Log leakage axes read from tick-label centres
  (about 85-110 px per decade, +/-0.05 decade). n_samples = number of plotted points per series (10 for chain
  resistance, 5 for leakage).
