excluded:
  - "EVC insertion loss below 0.5 dB in O-band even for 0.5 mm EVC (Introduction) attributed to ref [9]"
  - "Earlier imec CoD2W hybrid-bonding demonstrations with Si/glass carriers (refs [3]-[8]) and electrical-connectivity use of this flow (ref [10])"
  - "Fig. 1(A) vision schematic of multi-XPU optical interconnect wafer (no numbers)"
judgment_calls:
  - "Two TVs: Fig. 7 shows two different temporary carrier stacks (RL on TBM vs RL on die) with different debond methods; final bonded stack is the same."
  - "EVC loss results (Sec. IV) attached to TV b: Abstract and Conclusions tie 96% yield, 2.4 um and <0.5 dB to one wafer; the paper does not say explicitly."
  - "Die-to-wafer interface entered as interconnect level optical / optical_coupling with bonding_method fusion (paper: dielectric bonding, N2 plasma activation, DI rinse)."
  - "Position of the TV b release-layer coat relative to tape transfer and carrier debond is not stated; placed before tape transfer."
not_reported:
  - electrical_interfaces; die count per wafer; PIC function (modulators/PDs not stated as present on these dies)
  - TBM, release layer, bonding dielectric and protective layer materials; plasma power/time; bond temperature, force, anneal
  - laser debond wavelength/fluence; UV-laser debond equipment name; warpage measurement tool
  - EVC MFD, polarization, channel count; bond strength; reliability
