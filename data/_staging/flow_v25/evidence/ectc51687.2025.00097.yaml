  - "Fig. 17 X-section attached to TV a (technology not stated; inorganic, thin temporary layer)."
  - "Permanent bond entered as wafer_to_wafer_hybrid level with ic_type unspecified; only 'hydrophilic bonding' and SiO2 transit layer are described (bonding_method fusion for TV a)."
