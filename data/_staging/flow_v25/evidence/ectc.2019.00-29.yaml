notes: >-
  Fig. 3 caption is used twice (p.2 mask set and p.3 daisy chain schematics); text calls the p.3 figure Fig. 4.
  p.3 Fig. 3 legend lists daisy chains (corner x4, outer row x3, inner row x3; 8/10/5 um RDL1-RDL2 chains x2/x1/x1)
  and meanders (8 um x4, 10 um x2, 5 um x2); not tabulated.
