figure_reading_method: >-
  Page renders read at 150 dpi; Fig. 12, Fig. 17 and Fig. 22 re-rendered from source.pdf at 500-900 dpi (scratch crops,
  not kept) to read SEM measurement labels. Fig. 22 label-to-layer assignment follows the thin vertical measurement
  line next to each label and was checked against the image scale (about 0.078 um/px from the 29.5 um line).
  Fig. 12 top/bottom CD labels illegible (low-resolution embedded image): not used; sidewall angles legible.
