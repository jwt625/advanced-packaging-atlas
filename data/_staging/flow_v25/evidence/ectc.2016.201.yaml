figure_reading_method: >-
  Fig. 4(a) SEM inset bump-pitch labels read from the native embedded image (1170x526 px, xref 85 of source.pdf)
  cropped and upscaled 4x in scratch (not kept); labels low resolution but read as "130um bump pitch" and "55um bump pitch".
  Fig. 10 and Fig. 12 read by eye against gridlines from a 300 dpi re-render; values flagged approx.
