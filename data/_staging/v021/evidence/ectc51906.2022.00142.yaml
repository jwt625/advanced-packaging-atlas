figure_reading_method: >-
  Fig. 5, Fig. 6 and Fig. 12 values read by pixel calibration of the embedded chart images (img_p03_1, img_p04_9,
  img_p05_1) against their gridlines; Fig. 12 on a log axis (23 px per decade). Fig. 7 coplanarity labels illegible
  even after 400 dpi re-render (raster-limited); SEM/FIB scale bars (Figs. 9, 10, 11, 13) not used for dimensions.
