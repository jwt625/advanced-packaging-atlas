figure_reading_method: >-
  Candidate crops (all complete for the figures used). Bump and pad diameters from SEM panel titles of Figs. 10, 11,
  16, 17 ("20um pitch (7um dia)" etc.). Fig. 13 bars read against 1 um gridlines (+/-0.1 um). Fig. 20 legend read
  for pitches and daisy-chain bump counts; yields taken from the text, not read off the CDF plateaus.
