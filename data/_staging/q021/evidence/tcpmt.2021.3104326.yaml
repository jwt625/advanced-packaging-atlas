excluded:
  - "Indium bump pitch limit 7.5 um (ref [11])"
  - "10 um pitch D2W and <=1 um pitch W2W Cu/SiO2 hybrid bonding (refs [17], [18])"
  - "0-500 mT magnetic field results and ~2 mT SnAg hysteresis (authors' prior work ref [22])"
  - "CTE values of Cu, TiN, SiO2 (ref [28]); Cu RRR literature ranges (refs [31], [32]); Tc literature values Al ~1.2 K, Sn 3.7 K, TiN up to 6 K"
  - "Underfill qualification to 77 K reported in prior work (not re-measured here)"
