  - TC bonding temperature for the Fig. 10-12 samples; bonding pressure in MPa
  - electrical resistance / daisy-chain continuity, reliability tests, yield statistics
  - die shear sample count; nanoparticle loading in paste; which alloy (Sn or Sn-Ag-Cu) used per bond test
judgment_calls:
  - "Three TVs by pad pitch / chip build: 40 um bump-only coupon, 10 um 10x10 mm chip pair, 20 um 4.6x4.6 mm chip pair; hot-plate vs TCB and 0.5 vs 1.0 N are variants of TV c."
  - "Paste-material metrics (DSC, viscosity, particle size) attached to TV c with scope 'applies to all TVs'."
  - "Interconnect level/type 'other' (chip-to-chip self-assembled nanosolder joint; not a microbump or Cu pillar)."
  - "Electrical insulation statement entered as author_estimate (EDS-based, no electrical test)."
