figure_reading_method: >-
  Page renders p.2-6; 400 dpi re-crops of Fig. 2(b) and Fig. 12(b). Fig. 2(b) plateaus read against the 50-300 C
  axis (~1.58 px/C at 400 dpi crop scale, +/-3 C). Fig. 12(b) peaks read against 0-24 MPa axis (+/-0.3 MPa).
  Fig. 8 DSC peak temperatures are printed labels. Fig. 10 gaps are printed labels.
