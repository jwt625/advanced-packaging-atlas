figure_reading_method: >-
  Tables I-V are images only (text layer empty); read from page renders and a 300 dpi re-crop of Table II.
  Fig. 5(b), 6(b), 6(c) labels read at 300 dpi; layer assignment of each thickness label from arrow positions,
  cross-checked: Table II tCu = mean of the two winding thicknesses (S2 (9.95+26.6)/2 = 18.3; S3 (14.9+18.7)/2 = 16.8)
  and tgap ~ sum of labelled gap layers (S3 147.8 um vs 150 um). Fig. 8(d) efficiency read +/-1%.
