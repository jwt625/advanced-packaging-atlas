figure_reading_method: >-
  400-450 dpi re-crops of Fig. 3 (SEM labels), Fig. 12 steps 1-14 (p.4 and p.5 labels), Fig. 16. Fig. 16 markers
  located by color-pixel centroids (axis 0-4 W/mm2 = rows 443-30, 103.3 px per W/mm2); chip-1 triangles partly hidden
  by chip-2 circles, read from triangle base minus half height (+/-0.07). Table 2 values match text.md.
