figure_reading_method: >-
  Candidate crops viewed for Fig. 1, 3, 4, 5, 6, 8, 10-16. Fig. 4(c) overlay values printed on the plot. Fig. 11
  thickness labels (~6 um SiO2, ~4 um Si) read from SEM. Fig. 12 medians read at 50% cumulative (+/-0.005 ohm).
  Fig. 6 re-cropped (manual) to drop a line of body text. Table 1 values match text.md.
