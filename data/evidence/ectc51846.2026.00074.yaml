figure_reading_method: >-
  Page renders; Fig. 5 and Fig. 6 legends re-cropped at 600 dpi (blurry: Fig. 5 min about -80.7 MPa, Fig. 6 max 60.37 MPa);
  Fig. 11 re-cropped at 300 dpi (ABF and photoresist drawn on both sides, liner drawn). Table II read from candidate
  crop (matches text.md). X-ray Figs. 8-10, 13-15 viewed for qualitative result only (no scale given).
